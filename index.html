/* ---------- hoofdscherm: dagen naast elkaar ---------- */
function DayBoardView({ trip, days, agenda, setAgenda, shopping, setShopping, todos, photoIndex, images, loadImages, selected, setSelected, me, onGoTo, weer }) {
  const [addOpen, setAddOpen] = useState(null);
  const dagScroller = useRef(null);
  const scrollTimer = useRef(null);

  useEffect(() => { loadImages(); }, [photoIndex.length]);

  /* Tikken op een dag bovenaan schuift de volledige dagkaart naar die dag. */
  useEffect(() => {
    const scroller = dagScroller.current;
    if (!scroller || !selected) return;
    const kaart = scroller.querySelector(`[data-dagkaart="${selected}"]`);
    if (!kaart) return;
    const doel = kaart.offsetLeft - 16;
    if (Math.abs(scroller.scrollLeft - doel) > 4) {
      scroller.scrollTo({ left: doel, behavior: "smooth" });
    }
  }, [selected, days.length]);

  if (!days.length) return <Empty>Nog geen reisdagen ingesteld.</Empty>;

  /* Na een veeg wordt de dag die het dichtst in het midden staat geselecteerd. */
  const onthoudZichtbareDag = () => {
    const scroller = dagScroller.current;
    if (!scroller) return;
    clearTimeout(scrollTimer.current);
    scrollTimer.current = setTimeout(() => {
      const midden = scroller.getBoundingClientRect().left + scroller.clientWidth / 2;
      let beste = null;
      let afstand = Infinity;
      scroller.querySelectorAll('[data-dagkaart]').forEach((kaart) => {
        const r = kaart.getBoundingClientRect();
        const verschil = Math.abs(r.left + r.width / 2 - midden);
        if (verschil < afstand) {
          afstand = verschil;
          beste = kaart;
        }
      });
      const iso = beste && beste.getAttribute('data-dagkaart');
      if (iso && iso !== selected) setSelected(iso);
    }, 100);
  };

  const renderDag = (iso, index) => {
    const plannen = agenda
      .filter((a) => a.date === iso)
      .sort((a,b) => (a.heleDag ? "00" : a.time || "99").localeCompare(b.heleDag ? "00" : b.time || "99"));
    const lijst = shopping.filter((s) => s.date === iso);
    const kiekjes = photoIndex.filter((p) => p.date === iso);
    const stops = (trip.stops || []).filter((s) => s.place).length;
    const open = addOpen === iso;

    return (
      <section
        key={iso}
        data-dagkaart={iso}
        className="rounded-[24px] shrink-0"
        style={{
          flex: "0 0 calc(100% - 18px)",
          scrollSnapAlign: "center",
          scrollSnapStop: "always",
          background: C.bone,
          border: `2px solid ${C.line}`,
          boxShadow: SCHADUW.kaart,
          padding: 14,
          minWidth: 0,
        }}
      >
        <div className="flex items-start justify-between gap-3">
          <div>
            <Eyebrow color={C.marigold}>Dag {String(index + 1).padStart(2,"0")}</Eyebrow>
            <h2 className="font-serif capitalize" style={{ color: C.ink, fontSize: 25, lineHeight: 1.15, marginTop: 3 }}>{fmtLong(iso)}</h2>
          </div>
          {weer && weer[iso] && (
            <span className="rounded-xl" style={{ padding: "6px 9px", background: "#FFFFFF", border: `2px solid ${C.koraal}`, color: C.marigold, fontSize: 13, fontWeight: 800 }}>
              {weerInfo(weer[iso].code).emoji} {weer[iso].max}°C
            </span>
          )}
        </div>

        <div className="flex items-center justify-between" style={{ marginTop: 14 }}>
          <Eyebrow color={C.marigold}>Gebeurtenissen</Eyebrow>
          <button
            type="button"
            onClick={() => setAddOpen(open ? null : iso)}
            aria-label="Plan toevoegen"
            className="rounded-full"
            style={{ width: 28, height: 28, background: C.koraal, color: "#FFFFFF", border: 0, fontSize: 20, lineHeight: 1 }}
          >
            {open ? "−" : "+"}
          </button>
        </div>

        <NamenOphalen agenda={agenda} setAgenda={setAgenda} dagIso={iso} auto />
        {plannen.length ? (
          <ul className="space-y-2 mt-2">
            {plannen.map((a) => <AgendaRegel key={a.id} item={a} items={agenda} setItems={setAgenda} compact fotos={[]} images={images} />)}
          </ul>
        ) : (
          <div className="rounded-2xl mt-2" style={{ padding: 14, background: `${C.koraal}0D`, color: C.muted }}>Nog niets gepland.</div>
        )}

        {open && <div className="mt-3"><DagToevoegen iso={iso} agenda={agenda} setAgenda={setAgenda} me={me} /></div>}

        <div className="grid grid-cols-3 gap-2" style={{ marginTop: 12 }}>
          {[0,1,2].map((n) => {
            const p = kiekjes[n];
            return (
              <button key={n} type="button" onClick={() => onGoTo("fotos")} className="rounded-2xl overflow-hidden" style={{ height: 76, background: C.boneSoft, border: `1.5px solid ${C.line}`, padding: 0 }}>
                {p && images[p.id] ? <img src={images[p.id]} alt={p.caption || "Foto"} className="w-full h-full object-cover" /> : <DecorThumb variant={n} />}
              </button>
            );
          })}
        </div>

        <div className="grid grid-cols-2" style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${C.line}` }}>
          <div style={{ paddingRight: 13, borderRight: `1px solid ${C.line}` }}>
            <div className="flex items-center gap-2 mb-2">
              <Icoon naam="lijst" kleur={C.koraal} maat={18} />
              <Eyebrow color={C.marigold}>Boodschappen ({lijst.filter((x) => !x.done).length || lijst.length})</Eyebrow>
            </div>
            {lijst.length ? (
              <ul className="space-y-2">
                {lijst.slice(0,4).map((i) => (
                  <li key={i.id} className="flex items-center gap-2" style={{ fontSize: 13 }}>
                    <input type="checkbox" checked={i.done} onChange={() => setShopping(shopping.map((x) => x.id === i.id ? { ...x, done: !x.done } : x))} style={{ width: 17, height: 17, accentColor: C.lucht }} />
                    <span style={{ color: C.ink, textDecoration: i.done ? "line-through" : "none" }}>{i.text}</span>
                  </li>
                ))}
              </ul>
            ) : <p className="text-sm" style={{ color: C.muted }}>Nog niets nodig.</p>}
          </div>

          <button
            type="button"
            onClick={() => onGoTo("reis")}
            aria-label="Open alle reisdetails"
            className="text-left w-full rounded-2xl focus:outline-none focus:ring-2"
            style={{
              paddingLeft: 13,
              paddingTop: 2,
              paddingBottom: 2,
              paddingRight: 4,
              background: "transparent",
              border: 0,
              color: C.ink,
              minWidth: 0,
            }}
          >
            <div className="flex items-center justify-between gap-2 mb-2">
              <span className="flex items-center gap-2 min-w-0">
                <Icoon naam="reis" kleur={C.ink} maat={18} />
                <Eyebrow color={C.ink}>Reisdetails</Eyebrow>
              </span>
              <span aria-hidden="true" style={{ color: C.marigold, fontSize: 22, lineHeight: 1 }}>›</span>
            </div>
            <ul className="space-y-2" style={{ color: C.ink, fontSize: 13 }}>
              {trip.travelDistanceM ? <li className="flex gap-2"><span>◷</span><strong>{afstandTekst(trip.travelDistanceM)}</strong></li> : null}
              {trip.travelDurationS ? <li className="flex gap-2"><span>◷</span><strong>{duurTekst(trip.travelDurationS)} rijden</strong></li> : null}
              <li className="flex gap-2"><span>◷</span><strong>{stops} tussenstop{stops === 1 ? "" : "s"}</strong></li>
            </ul>
            <span className="block mt-2" style={{ color: C.muted, fontSize: 11, fontWeight: 700 }}>
              Tik om de volledige reis te openen
            </span>
          </button>
        </div>
      </section>
    );
  };

  return (
    <div>
      <div style={{ marginBottom: 12 }}>
        <DayStrip days={days} selected={selected} onSelect={setSelected} />
      </div>

      <div
        ref={dagScroller}
        onScroll={onthoudZichtbareDag}
        className="ft-scrollbar flex overflow-x-auto"
        aria-label="Veeg door de reisdagen"
        style={{
          gap: 12,
          marginLeft: -16,
          marginRight: -16,
          paddingLeft: 16,
          paddingRight: 16,
          paddingBottom: 10,
          scrollSnapType: "x mandatory",
          WebkitOverflowScrolling: "touch",
          overscrollBehaviorX: "contain",
          touchAction: "pan-x pan-y",
        }}
      >
        {days.map(renderDag)}
      </div>

      <p className="text-center" style={{ color: C.muted, fontSize: 11, fontWeight: 700, marginTop: 2 }}>
        Veeg naar links of rechts voor een andere dag
      </p>
    </div>
  );
}

/* ---------- photos ---------- */
function PhotosView({ index, setIndex, images, loadImages, days, selected, setSelected, me, trip }) {
  const [caption, setCaption] = useState("");
  const [link, setLink] = useState("");
  const [busy, setBusy] = useState("");
  const [albumBusy, setAlbumBusy] = useState("");
  const [open, setOpen] = useState(null);
  const fileRef = useRef(null);
  const albumRef = useRef(null);
  const oneDriveRef = useRef(null);

  const [videos, setVideos] = useState({});

  useEffect(() => {
    loadImages();
  }, [index.length]);

  useEffect(() => {
    if (!open || open.type !== "video" || !open.inline || videos[open.id]) return;
    let stop = false;
    (async () => {
      try {
        const film = await loadKey(`video:${open.id}`, null);
        if (!stop && film) setVideos((v) => ({ ...v, [open.id]: film }));
      } catch (e) {
        /* video staat er niet meer */
      }
    })();
    return () => {
      stop = true;
    };
  }, [open]);

  const handleFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    let added = [];
    let klachten = [];
    for (let n = 0; n < files.length; n++) {
      const file = files[n];
      const isVideo = (file.type || "").startsWith("video/");
      setBusy(`${isVideo ? "Video" : "Foto"} ${n + 1} van ${files.length} wordt klaargezet...`);
      try {
        const id = uid();
        if (isVideo) {
          const beeldje = await videoBeeldje(file);
          const past = file.size <= VIDEO_MAX;
          const okBeeld = await saveKey(`photo:${id}`, beeldje);
          if (!okBeeld) {
            klachten.push(
              OPSLAG.vol
                ? `De opslag van deze browser zit vol (${mbTekst(opslagGebruik())} in gebruik).`
                : "Het beeldje van deze video kon niet bewaard worden."
            );
          }
          const naarWolk = !past && window.AppFiles && window.AppFiles.beschikbaar;
          let url = "";
          if (naarWolk) {
            try {
              url = await window.AppFiles.upload(`video-${id}`, file, (pct) =>
                setBusy(`Video wordt geupload: ${pct}%`)
              );
            } catch (e) {
              klachten.push("De video kon niet geupload worden: " + (e.message || ""));
            }
          }
          const okVideo = past ? await saveKey(`video:${id}`, await bestandNaarTekst(file)) : false;
          if (okBeeld) {
            added.push({
              id,
              date: selected,
              caption: caption.trim(),
              trip: trip.name,
              by: me.name,
              at: new Date().toISOString(),
              type: "video",
              inline: okVideo,
              url: url || undefined,
            });
            if (!okVideo && !url)
              klachten.push(
                "Die video is te groot om hier te bewaren. Het beeldje staat er wel; zet de video ergens online en plak de link erbij."
              );
          }
        } else {
          let dataUrl = await maakPassend(file);
          let ok = await saveKey(`photo:${id}`, dataUrl);
          if (!ok && OPSLAG.vol) {
            /* Ruimte tekort: nog een keer, een stuk kleiner. */
            setBusy("De opslag is bijna vol, ik probeer een kleinere versie\u2026");
            dataUrl = await resizeImage(file, 800, 0.6);
            ok = await saveKey(`photo:${id}`, dataUrl);
          }
          if (ok) {
            added.push({
              id,
              date: selected,
              caption: caption.trim(),
              trip: trip.name,
              by: me.name,
              at: new Date().toISOString(),
              type: "foto",
            });
          } else {
            klachten.push(
              OPSLAG.vol
                ? `De opslag van deze browser zit vol (${mbTekst(
                    opslagGebruik()
                  )} in gebruik). Verwijder wat foto's, of zet Firebase aan zodat alles op de server komt.`
                : "Deze foto kon niet bewaard worden."
            );
          }
        }
      } catch (err) {
        klachten.push(err.message || "Dit bestand kon niet toegevoegd worden.");
      }
    }
    if (added.length) {
      setIndex([...index, ...added]);
      setCaption("");
    }
    setBusy(klachten.join(" "));
    if (fileRef.current) fileRef.current.value = "";
  };

  const geldigeDatum = (jaar, maand, dag) => {
    const y = Number(jaar);
    const m = Number(maand);
    const d = Number(dag);
    if (y < 1900 || y > 2200 || m < 1 || m > 12 || d < 1 || d > 31) return null;
    const test = new Date(y, m - 1, d, 12, 0, 0);
    if (test.getFullYear() !== y || test.getMonth() !== m - 1 || test.getDate() !== d) return null;
    return `${String(y).padStart(4, "0")}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  };

  /* Android en Google Foto's geven soms de download-datum door als lastModified.
     Daarom kijken we ook naar namen zoals IMG_20250801, PXL_20250801 en IMG-20250801-WA0001. */
  const datumUitBestandsnaam = (naam) => {
    const schoon = String(naam || "");
    const patronen = [
      /(?:^|\D)((?:19|20)\d{2})[-_.]?([01]\d)[-_.]?([0-3]\d)(?:\D|$)/,
      /(?:^|\D)([0-3]\d)[-_.]([01]\d)[-_.]((?:19|20)\d{2})(?:\D|$)/,
    ];
    let m = schoon.match(patronen[0]);
    if (m) return geldigeDatum(m[1], m[2], m[3]);
    m = schoon.match(patronen[1]);
    if (m) return geldigeDatum(m[3], m[2], m[1]);
    return null;
  };

  const opnameDatum = (file, exif) => {
    if (exif && exif.datum) return { datum: exif.datum, bron: "opnamedatum" };
    const uitNaam = datumUitBestandsnaam(file && file.name);
    if (uitNaam) return { datum: uitNaam, bron: "bestandsnaam" };
    if (file && file.lastModified) {
      const d = new Date(file.lastModified);
      if (!isNaN(d.getTime())) {
        return {
          datum: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`,
          bron: "bestandsdatum",
        };
      }
    }
    return { datum: null, bron: null };
  };

  const handleAlbum = async (e) => {
    const gekozen = Array.from((e && e.target && e.target.files) || []);
    const files = gekozen.slice(0, 80);
    if (!files.length) {
      setAlbumBusy("Er zijn geen foto's geselecteerd.");
      return;
    }
    if (!days.length) {
      setAlbumBusy("Sla eerst de vertrek- en terugreisdatum op. Daarna kan de app foto's over de reisdagen verdelen.");
      if (albumRef.current) albumRef.current.value = "";
      if (oneDriveRef.current) oneDriveRef.current.value = "";
      if (e && e.target) e.target.value = "";
      return;
    }

    setAlbumBusy(`${files.length} foto${files.length === 1 ? "" : "'s"} geselecteerd. De datums worden gelezen…`);
    const nieuw = [];
    let buiten = 0;
    let zonderDatum = 0;
    let mislukt = 0;
    let nietOndersteund = 0;
    const fouten = [];
    const perDag = {};

    for (let n = 0; n < files.length; n++) {
      const file = files[n];
      setAlbumBusy(`Foto ${n + 1} van ${files.length} wordt bekeken…`);
      try {
        const type = String(file.type || "").toLowerCase();
        const naam = String(file.name || "").toLowerCase();
        const lijktFoto = type.startsWith("image/") || /\.(jpe?g|png|webp|heic|heif)$/i.test(naam);
        if (!lijktFoto) {
          nietOndersteund++;
          continue;
        }

        const exif = await leesExif(file);
        const { datum, bron } = opnameDatum(file, exif);
        if (!datum) {
          zonderDatum++;
          continue;
        }
        if (!days.includes(datum)) {
          buiten++;
          continue;
        }

        let beeld;
        try {
          beeld = await maakPassend(file);
        } catch (err) {
          mislukt++;
          const melding = err && err.message ? err.message : "De foto kon niet worden geopend.";
          if (fouten.length < 2) fouten.push(`${file.name || "Foto"}: ${melding}`);
          continue;
        }

        const id = uid();
        let ok = await saveKey(`photo:${id}`, beeld);
        if (!ok && OPSLAG.vol) {
          try {
            beeld = await resizeImage(file, 720, 0.55);
            ok = await saveKey(`photo:${id}`, beeld);
          } catch (err) {
            ok = false;
          }
        }
        if (!ok) {
          mislukt++;
          if (fouten.length < 2) fouten.push(`${file.name || "Foto"}: opslaan lukte niet.`);
          if (OPSLAG.vol) break;
          continue;
        }

        nieuw.push({
          id,
          date: datum,
          caption: "",
          trip: trip.name,
          by: me.name,
          at: new Date().toISOString(),
          type: "foto",
          plek: exif && exif.punt ? exif.punt : undefined,
          bron,
        });
        perDag[datum] = (perDag[datum] || 0) + 1;
      } catch (err) {
        mislukt++;
        if (fouten.length < 2) fouten.push(`${file.name || "Foto"}: ${err && err.message ? err.message : "onbekende fout"}.`);
      }
    }

    if (nieuw.length) await setIndex([...index, ...nieuw]);
    const aantalDagen = Object.keys(perDag).length;
    const delen = [];
    if (nieuw.length) delen.push(`${nieuw.length} foto${nieuw.length === 1 ? "" : "'s"} toegevoegd aan ${aantalDagen} ${aantalDagen === 1 ? "reisdag" : "reisdagen"}.`);
    else delen.push("Er zijn geen foto's toegevoegd.");
    if (buiten) delen.push(`${buiten} foto${buiten === 1 ? " viel" : "'s vielen"} buiten de ingestelde reisdata (${days[0]} t/m ${days[days.length - 1]}).`);
    if (zonderDatum) delen.push(`${zonderDatum} foto${zonderDatum === 1 ? " had" : "'s hadden"} geen leesbare opname- of bestandsdatum.`);
    if (nietOndersteund) delen.push(`${nietOndersteund} bestand${nietOndersteund === 1 ? " was" : "en waren"} geen ondersteunde foto.`);
    if (mislukt) delen.push(`${mislukt} foto${mislukt === 1 ? " kon" : "'s konden"} niet worden verwerkt${OPSLAG.vol ? "; de opslag zit vol" : ""}.`);
    if (gekozen.length > 80) delen.push(`De eerste 80 van ${gekozen.length} geselecteerde foto's zijn verwerkt.`);
    if (fouten.length) delen.push(fouten.join(" "));
    setAlbumBusy(delen.join(" "));
    if (albumRef.current) albumRef.current.value = "";
    if (oneDriveRef.current) oneDriveRef.current.value = "";
    if (e && e.target) e.target.value = "";
  };

  const voegLinkToe = () => {
    const url = link.trim();
    if (!url) return;
    setIndex([
      ...index,
      {
        id: uid(),
        date: selected,
        caption: caption.trim(),
        trip: trip.name,
        by: me.name,
        at: new Date().toISOString(),
        type: "link",
        url,
      },
    ]);
    setCaption("");
    setLink("");
  };

  const grouped = useMemo(() => {
    const map = {};
    index.forEach((p) => {
      (map[p.date] = map[p.date] || []).push(p);
    });
    return map;
  }, [index]);

  const counts = useMemo(() => {
    const c = {};
    index.forEach((p) => (c[p.date] = (c[p.date] || 0) + 1));
    return c;
  }, [index]);

  const [reacties, setReacties] = useState({});
  const [praat, setPraat] = useState({});
  const [praatTekst, setPraatTekst] = useState("");
  const [groot, setGroot] = useState(false);
  const [zoom, setZoom] = useState(1);
  const [schuif, setSchuif] = useState({ x: 0, y: 0 });
  const gebaar = useRef(null);
  const laatsteTik = useRef(0);

  const [snelEmojis, setSnelEmojis] = useState(STANDAARD_EMOJIS);
  const [emojiPop, setEmojiPop] = useState(false);
  const [emojiKies, setEmojiKies] = useState(false);
  const drukTimer = useRef(null);
  const langIngedrukt = useRef(false);

  /* De vijf van deze persoon onthouden. */
  useEffect(() => {
    (async () => {
      const eigen = await loadKey("emoji-set", null, false);
      if (Array.isArray(eigen) && eigen.length === 5) setSnelEmojis(eigen);
    })();
  }, []);

  const startDruk = () => {
    langIngedrukt.current = false;
    clearTimeout(drukTimer.current);
    drukTimer.current = setTimeout(() => {
      langIngedrukt.current = true;
      setEmojiKies(false);
      setEmojiPop(true);
    }, 450);
  };
  const eindDruk = () => {
    clearTimeout(drukTimer.current);
    if (!langIngedrukt.current) setGroot(true);
    langIngedrukt.current = false;
  };
  const annuleerDruk = () => {
    clearTimeout(drukTimer.current);
    langIngedrukt.current = false;
  };

  const kiesEmoji = async (emo) => {
    await wisselEmoji(emo);
    if (!snelEmojis.includes(emo)) {
      const nieuw = [emo, ...snelEmojis].slice(0, 5);
      setSnelEmojis(nieuw);
      await saveKey("emoji-set", nieuw, false);
    }
    setEmojiKies(false);
    setEmojiPop(false);
  };

  /* Reacties en opmerkingen bij deze foto ophalen. */
  useEffect(() => {
    setGroot(false);
    setZoom(1);
    setSchuif({ x: 0, y: 0 });
    if (!open) return;
    let stop = false;
    (async () => {
      const r = await loadKey(`reacties:${open.id}`, {});
      const pr = await loadKey(`praat:${open.id}`, []);
      if (stop) return;
      setReacties((v) => ({ ...v, [open.id]: r || {} }));
      setPraat((v) => ({ ...v, [open.id]: Array.isArray(pr) ? pr : [] }));
    })();
    return () => {
      stop = true;
    };
  }, [open]);

  const wisselEmoji = async (emo) => {
    const nu = { ...(reacties[open.id] || {}) };
    const wie = Array.isArray(nu[emo]) ? [...nu[emo]] : [];
    const i = wie.indexOf(me.name);
    if (i >= 0) wie.splice(i, 1);
    else wie.push(me.name);
    if (wie.length) nu[emo] = wie;
    else delete nu[emo];
    setReacties((v) => ({ ...v, [open.id]: nu }));
    await saveKey(`reacties:${open.id}`, nu);
  };

  const stuurPraat = async () => {
    const tekst = praatTekst.trim();
    if (!tekst) return;
    const lijst = [
      ...(praat[open.id] || []),
      { id: uid(), by: me.name, text: tekst, at: new Date().toISOString() },
    ];
    setPraat((v) => ({ ...v, [open.id]: lijst }));
    setPraatTekst("");
    const ok = await saveKey(`praat:${open.id}`, lijst);
    if (!ok) setBusy("De opmerking kon niet opgeslagen worden.");
  };

  /* Alle beelden op volgorde, zoals ze op het scherm staan. */
  const volgorde = useMemo(
    () => days.filter((d) => grouped[d] && grouped[d].length).flatMap((d) => grouped[d]),
    [grouped, days]
  );
  const huidige = open ? volgorde.findIndex((p) => p.id === open.id) : -1;
  const blader = (stap) => {
    if (groot) return; // tijdens vergroten niet bladeren
    if (huidige < 0) return;
    const i = huidige + stap;
    if (i >= 0 && i < volgorde.length) setOpen(volgorde[i]);
  };

  /* Vegen met je vinger. */
  const veeg = useRef(null);
  const grootVinger = useRef(null);
  const veegStart = (e) => {
    veeg.current = e.touches && e.touches[0] ? e.touches[0].clientX : null;
  };
  const veegEind = (e) => {
    if (veeg.current == null) return;
    const eind = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : null;
    if (eind != null) {
      const verschil = eind - veeg.current;
      if (Math.abs(verschil) > 45) blader(verschil < 0 ? 1 : -1);
    }
    veeg.current = null;
  };

  /* Zorgen dat de foto waar je naartoe bladert ook echt geladen is. */
  useEffect(() => {
    if (open && !images[open.id]) loadImages();
  }, [open]);

  /* Pijltjestoetsen, voor wie op een computer kijkt. */
  useEffect(() => {
    if (!open) return;
    const toets = (e) => {
      if (e.key === "Escape") {
        if (groot) setGroot(false);
        else setOpen(null);
        return;
      }
      if (groot) return;
      if (e.key === "ArrowRight") blader(1);
      if (e.key === "ArrowLeft") blader(-1);
    };
    window.addEventListener("keydown", toets);
    return () => window.removeEventListener("keydown", toets);
  }, [open, volgorde, groot]);

  /* De terugknop van de telefoon sluit de foto, niet de hele app. */
  const isOpen = !!open;
  useEffect(() => {
    if (!isOpen) return;
    let viaTerugknop = false;
    window.history.pushState({ reisboekFoto: true }, "");
    const terug = () => {
      viaTerugknop = true;
      setGroot(false);
      setOpen(null);
    };
    window.addEventListener("popstate", terug);
    return () => {
      window.removeEventListener("popstate", terug);
      if (!viaTerugknop) window.history.back();
    };
  }, [isOpen]);

  const remove = async (p) => {
    setIndex(index.filter((x) => x.id !== p.id));
    setOpen(null);
    try {
      await AppStore.delete(`photo:${p.id}`, true);
      if (p.type === "video" && p.inline) await AppStore.delete(`video:${p.id}`, true);
      if (p.type === "video" && p.url && window.AppFiles && window.AppFiles.beschikbaar)
        await window.AppFiles.verwijder(`video-${p.id}`);
    } catch (e) {
      /* index is bijgewerkt; losse afbeelding blijft onbereikbaar achter */
    }
  };

  return (
    <div className="space-y-4">
      <DayStrip days={days} selected={selected} onSelect={setSelected} counts={counts} />

      <RuimteMeter aantal={index.length} />

      <Card style={{ background: "#FFF6EC", border: `3px solid ${C.koraal}` }}>
        <Eyebrow color={C.ember}>Uit je fotoalbum, op datum</Eyebrow>
        <p className="text-sm mt-2 leading-relaxed">
          Kies hieronder de foto's van je vakantie. De app leest per foto uit wanneer hij genomen is
          en zet hem bij de juiste dag. Selecteer er gerust honderd tegelijk; er worden er maximaal
          tachtig per keer verwerkt.
        </p>
        <label
          className="relative overflow-hidden flex items-center justify-center w-full rounded-2xl mt-3 px-4 py-3 cursor-pointer focus-within:ring-2"
          style={{ background: C.koraal, color: "#FFFFFF", fontWeight: 800, boxShadow: SCHADUW.knop }}
        >
          <span>Kies foto's uit je album</span>
          <input
            ref={albumRef}
            type="file"
            accept="image/*,.jpg,.jpeg,.png,.webp,.heic,.heif"
            multiple
            onClick={(e) => { e.currentTarget.value = ""; }}
            onChange={handleAlbum}
            style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: 0, cursor: "pointer" }}
          />
        </label>

        <label
          className="relative overflow-hidden flex items-center justify-center w-full rounded-2xl mt-2 px-4 py-3 cursor-pointer focus-within:ring-2"
          style={{ background: "#FFFFFF", color: C.ink, fontWeight: 800, border: `2px solid ${C.line}` }}
        >
          <span>☁️ Kies via Bestanden / OneDrive</span>
          <input
            ref={oneDriveRef}
            type="file"
            multiple
            onClick={(e) => { e.currentTarget.value = ""; }}
            onChange={handleAlbum}
            style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: 0, cursor: "pointer" }}
          />
        </label>
        <p className="text-xs mt-2" style={{ color: C.muted, lineHeight: 1.45 }}>
          Android toont OneDrive niet altijd bij <strong>Cloudmedia</strong>. Gebruik daarom deze knop.
          Open in <strong>Bestanden</strong> het menu linksboven en kies <strong>OneDrive</strong>. Staat OneDrive daar niet,
          download de foto's dan eerst in de OneDrive-app naar dit apparaat.
        </p>
        {albumBusy && (
          <div
            role="status"
            aria-live="polite"
            className="text-sm mt-3 rounded-2xl px-3 py-3"
            style={{ background: C.boneSoft, color: C.ink, border: `2px solid ${C.line}`, lineHeight: 1.45 }}
          >
            {albumBusy}
          </div>
        )}
        <p className="text-xs mt-2" style={{ color: C.muted }}>
          De app gebruikt eerst de echte opnamedatum, daarna een datum in de bestandsnaam en pas
          daarna de bestandsdatum. Foto's buiten {days[0] || "de vertrekdatum"} t/m {days[days.length - 1] || "de terugreisdatum"} worden niet toegevoegd.
        </p>
      </Card>

      <Card>
        <Eyebrow>Zelf toevoegen bij {fmtLong(selected)}</Eyebrow>
        <div className="mt-2 space-y-2">
          <Field label="Omschrijving (optioneel)" placeholder="Ontbijt op het terras" value={caption} onChange={(e) => setCaption(e.target.value)} />
          <input
            ref={fileRef}
            type="file"
            accept="image/*,video/*"
            multiple
            onChange={handleFiles}
            className="block w-full text-sm"
            style={{ color: C.muted }}
          />
          {busy && (
            <p className="font-mono text-xs" style={{ color: C.muted }}>
              {busy}
            </p>
          )}
          <div className="flex gap-2 items-end">
            <div className="flex-1">
              <Field
                label="Of een videolink (YouTube, Google Foto's, Drive)"
                placeholder="https://youtu.be/..."
                value={link}
                onChange={(e) => setLink(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && voegLinkToe()}
              />
            </div>
            <Btn onClick={voegLinkToe} disabled={!link.trim()}>
              Erbij
            </Btn>
          </div>
          <p className="text-xs" style={{ color: C.muted }}>
            Korte video's worden in de app bewaard; langere kun je beter online zetten en als link
            toevoegen. Foto's worden verkleind opgeslagen en bij deze dag en bij {trip.name} gezet.
          </p>
        </div>
      </Card>

      {days
        .filter((d) => grouped[d]?.length)
        .map((d) => (
          <div key={d}>
            <Eyebrow color={dagKleur(days.indexOf(d)).rand}>
              Dag {String(days.indexOf(d) + 1).padStart(2, "0")} | {fmtShort(d)}
            </Eyebrow>
            <div className="grid grid-cols-3 gap-2 mt-2">
              {grouped[d].map((p) => (
                <button
                  key={p.id}
                  onClick={() => setOpen(p)}
                  className="relative rounded-2xl overflow-hidden focus:outline-none focus:ring-2 w-full"
                  style={{ background: C.boneSoft, paddingTop: "100%", border: `2px solid ${C.line}` }}
                >
                  <span className="absolute inset-0 block">
                    {images[p.id] ? (
                      <img
                        src={images[p.id]}
                        alt=""
                        className="w-full h-full object-cover"
                      />
                    ) : p.type === "link" ? (
                      <span
                        className="flex w-full h-full items-center justify-center font-mono text-xs"
                        style={{ background: C.boneSoft, color: C.muted }}
                      >
                        video
                      </span>
                    ) : (
                      <span
                        className="flex w-full h-full items-center justify-center font-mono text-xs"
                        style={{ color: C.muted }}
                      >
                        ...
                      </span>
                    )}
                    {p.type !== "foto" && p.type && (
                      <span
                        className="absolute flex items-center justify-center rounded-full"
                        style={{
                          width: 26,
                          height: 26,
                          right: 5,
                          bottom: 5,
                          background: "rgba(34,64,107,0.85)",
                          color: "#FFFFFF",
                          fontSize: 12,
                        }}
                      >
                        &gt;
                      </span>
                    )}
                  </span>
                </button>
              ))}
            </div>
          </div>
        ))}

      {index.length === 0 && <Empty>Nog geen foto's in dit reisboek.</Empty>}

      {open && (
        <div
          className="fixed inset-0 z-50 p-4 overflow-y-auto"
          style={{ background: "rgba(27,52,87,0.96)" }}
          role="dialog"
          onTouchStart={veegStart}
          onTouchEnd={veegEind}
        >
          <div className="flex items-center justify-between mb-2">
            <button
              onClick={() => blader(-1)}
              disabled={huidige <= 0}
              aria-label="Vorige"
              className="rounded-full flex items-center justify-center focus:outline-none focus:ring-2"
              style={{
                width: 44,
                height: 44,
                background: "rgba(255,255,255,0.15)",
                color: "#FFFFFF",
                opacity: huidige <= 0 ? 0.3 : 1,
                fontSize: 20,
              }}
            >
              &lt;
            </button>
            <span className="font-mono text-xs" style={{ color: C.boneSoft }}>
              {huidige + 1} van {volgorde.length}
            </span>
            <button
              onClick={() => blader(1)}
              disabled={huidige >= volgorde.length - 1}
              aria-label="Volgende"
              className="rounded-full flex items-center justify-center focus:outline-none focus:ring-2"
              style={{
                width: 44,
                height: 44,
                background: "rgba(255,255,255,0.15)",
                color: "#FFFFFF",
                opacity: huidige >= volgorde.length - 1 ? 0.3 : 1,
                fontSize: 20,
              }}
            >
              &gt;
            </button>
          </div>
          {open.type === "link" ? (
            youtubeId(open.url) ? (
              <iframe
                title={open.caption || "Video"}
                src={`https://www.youtube.com/embed/${youtubeId(open.url)}`}
                allow="accelerometer; autoplay; encrypted-media; picture-in-picture"
                allowFullScreen
                className="w-full rounded-2xl"
                style={{ height: 220, border: "none" }}
              />
            ) : (
              <a
                href={open.url}
                target="_blank"
                rel="noopener noreferrer"
                className="block rounded-2xl p-6 text-center"
                style={{ background: "rgba(255,255,255,0.12)", color: "#FFFFFF" }}
              >
                Video openen in een nieuw tabblad
              </a>
            )
          ) : open.type === "video" && open.url ? (
            <video
              src={open.url}
              controls
              playsInline
              className="max-h-96 w-full rounded-2xl"
              style={{ background: "#000" }}
            />
          ) : open.type === "video" && open.inline && videos[open.id] ? (
            <video
              src={videos[open.id]}
              controls
              playsInline
              className="max-h-96 w-full rounded-2xl"
              style={{ background: "#000" }}
            />
          ) : images[open.id] ? (
            <div
              role="button"
              tabIndex={0}
              aria-label="Tik voor volle grootte, houd ingedrukt voor emoji's"
              onTouchStart={startDruk}
              onTouchEnd={eindDruk}
              onTouchMove={annuleerDruk}
              onMouseDown={startDruk}
              onMouseUp={eindDruk}
              onMouseLeave={annuleerDruk}
              onContextMenu={(e) => e.preventDefault()}
              className="block w-full rounded-2xl"
              style={{ WebkitTouchCallout: "none", userSelect: "none" }}
            >
              <img
                src={images[open.id]}
                alt={open.caption || "Reisbeeld"}
                className="max-h-96 w-full object-contain rounded-2xl pointer-events-none"
              />
            </div>
          ) : null}
          {open.type === "video" && !open.inline && !open.url && (
            <p className="text-sm mt-3" style={{ color: "#FFFFFF" }}>
              Van deze video is alleen het beeldje bewaard; hij was te groot voor de opslag.
            </p>
          )}
          {open.plek && (
            <div className="mt-3">
              <PlaatsBeeld place={open.plek} hoogte={80} />
            </div>
          )}
          <div className="mt-4" style={{ color: C.bone }}>
            <Eyebrow color={C.marigold}>
              {fmtLong(open.date)} | {open.trip || ""}
            </Eyebrow>
            <p className="text-base mt-1">{open.caption || "Geen omschrijving"}</p>
            <p className="font-mono text-xs mt-1" style={{ color: C.boneSoft }}>
              toegevoegd door {open.by}
            </p>
          </div>
          {Object.keys(reacties[open.id] || {}).length > 0 && (
            <div className="flex flex-wrap gap-2 mt-3">
              {Object.entries(reacties[open.id] || {}).map(([emo, wie]) => (
                <span
                  key={emo}
                  title={wie.join(", ")}
                  className="flex items-center gap-1 rounded-full px-3 py-1"
                  style={{
                    background: wie.includes(me.name) ? C.koraal : "rgba(255,255,255,0.16)",
                    fontSize: 16,
                  }}
                >
                  <span>{emo}</span>
                  <span
                    className="font-mono text-xs"
                    style={{ color: wie.includes(me.name) ? C.ink : "#FFFFFF" }}
                  >
                    {wie.length}
                  </span>
                </span>
              ))}
            </div>
          )}

          <div className="mt-3">
            {(praat[open.id] || []).map((b) => {
              const vanMij = b.by === me.name;
              return (
                <div key={b.id} className={"flex mb-2 " + (vanMij ? "justify-end" : "justify-start")}>
                  <span
                    className="inline-block px-3 py-2"
                    style={{
                      maxWidth: "80%",
                      background: vanMij ? C.koraal : "rgba(255,255,255,0.92)",
                      color: C.ink,
                      borderRadius: 18,
                      borderBottomRightRadius: vanMij ? 4 : 18,
                      borderBottomLeftRadius: vanMij ? 18 : 4,
                    }}
                  >
                    {!vanMij && (
                      <span className="block font-mono text-xs" style={{ color: C.muted }}>
                        {b.by}
                      </span>
                    )}
                    <span className="block text-sm">{b.text}</span>
                  </span>
                </div>
              );
            })}
            <div className="flex gap-2 mt-2">
              <input
                value={praatTekst}
                onChange={(e) => setPraatTekst(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && stuurPraat()}
                placeholder="Iets erbij zeggen"
                className="flex-1 px-4 py-2 rounded-2xl text-base focus:outline-none focus:ring-2"
                style={{ background: "#FFFFFF", color: C.ink, border: `2px solid ${C.line}` }}
              />
              <Btn onClick={stuurPraat} disabled={!praatTekst.trim()}>
                Plaats
              </Btn>
            </div>
          </div>

          <p className="font-mono text-xs mt-3" style={{ color: "rgba(243,231,218,0.7)" }}>
            Veeg voor de volgende foto. Tik op de foto om hem groot te zien, of houd hem even
            ingedrukt voor een emoji.
          </p>
          {emojiPop && (
            <div
              className="fixed inset-0 flex items-center justify-center p-5"
              style={{ zIndex: 70, background: "rgba(27,52,87,0.75)" }}
              onClick={() => {
                setEmojiPop(false);
                setEmojiKies(false);
              }}
              onTouchStart={(e) => e.stopPropagation()}
              onTouchEnd={(e) => e.stopPropagation()}
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="rounded-3xl p-4"
                style={{
                  background: C.bone,
                  border: `3px solid ${C.line}`,
                  boxShadow: "0 14px 34px rgba(0,0,0,0.35)",

                          {emo}
                        </button>
                      ))}

                    <Btn tone="ghost" className="mt-3" onClick={() => setEmojiKies(false)}>
                      Terug
                    </Btn>
                  </>
                )}
              </div>
            </div>
          )}

          {groot && images[open.id] && (
            <div
              className="fixed inset-0 flex items-center justify-center overflow-hidden"
              style={{ zIndex: 60, background: "#000000", touchAction: "none" }}
              onClick={(e) => e.stopPropagation()}
              onTouchStart={(e) => {
                e.stopPropagation();
                if (e.touches.length === 2) {
                  const dx = e.touches[0].clientX - e.touches[1].clientX;
                  const dy = e.touches[0].clientY - e.touches[1].clientY;
                  gebaar.current = {
                    soort: "knijp",
                    afstand: Math.hypot(dx, dy),
                    beginZoom: zoom,
                  };
                } else if (e.touches.length === 1) {
                  gebaar.current = {
                    soort: "sleep",
                    x: e.touches[0].clientX,
                    y: e.touches[0].clientY,
                    beginSchuif: schuif,
                    bewogen: 0,
                  };
                }
              }}
              onTouchMove={(e) => {
                e.stopPropagation();
                const g = gebaar.current;
                if (!g) return;
                if (g.soort === "knijp" && e.touches.length === 2) {
                  const dx = e.touches[0].clientX - e.touches[1].clientX;
                  const dy = e.touches[0].clientY - e.touches[1].clientY;
                  const nieuweZoom = Math.min(
                    6,
                    Math.max(1, (g.beginZoom * Math.hypot(dx, dy)) / (g.afstand || 1))
                  );
                  setZoom(nieuweZoom);
                  if (nieuweZoom === 1) setSchuif({ x: 0, y: 0 });
                } else if (g.soort === "sleep" && e.touches.length === 1) {
                  const dx = e.touches[0].clientX - g.x;
                  const dy = e.touches[0].clientY - g.y;
                  g.bewogen = Math.max(g.bewogen, Math.hypot(dx, dy));
                  if (zoom > 1) {
                    setSchuif({ x: g.beginSchuif.x + dx / zoom, y: g.beginSchuif.y + dy / zoom });
                  }
                }
              }}
              onTouchEnd={(e) => {
                e.stopPropagation();
                const g = gebaar.current;
                gebaar.current = null;
                if (!g || g.soort !== "sleep" || g.bewogen > 12) return;
                const nu = Date.now();
                if (nu - laatsteTik.current < 300) {
                  /* twee keer tikken: heen en weer tussen normaal en ingezoomd */
                  laatsteTik.current = 0;
                  if (zoom > 1) {
                    setZoom(1);
                    setSchuif({ x: 0, y: 0 });
                  } else {
                    setZoom(2.5);
                  }
                  return;
                }
                laatsteTik.current = nu;
                setTimeout(() => {
                  if (laatsteTik.current === nu && zoom === 1) setGroot(false);
                }, 310);
              }}
            >
              <img
                src={images[open.id]}
                alt={open.caption || "Reisbeeld"}
                draggable={false}
                style={{
                  maxWidth: "100%",
                  maxHeight: "100%",
                  objectFit: "contain",
                  transform: `translate(${schuif.x}px, ${schuif.y}px) scale(${zoom})`,
                  transition: gebaar.current ? "none" : "transform 0.15s ease-out",
                  userSelect: "none",
                }}
              />
              <button
                onClick={(e) => {
                  e.stopPropagation();
                  setGroot(false);
                }}
                onTouchEnd={(e) => e.stopPropagation()}
                className="fixed rounded-full px-4 py-2 font-mono uppercase text-xs tracking-widest focus:outline-none focus:ring-2"
                style={{ right: 14, top: 14, background: "rgba(255,255,255,0.9)", color: C.ink }}
              >
                Sluiten
              </button>
              <span
                className="fixed font-mono text-xs"
                style={{ left: 0, right: 0, bottom: 16, textAlign: "center", color: "rgba(255,255,255,0.65)" }}
              >
                {zoom > 1
                  ? `${zoom.toFixed(1).replace(".", ",")}x | sleep om te schuiven`
                  : "Knijp met twee vingers om in te zoomen"}
              </span>
            </div>
          )}
          <div className="flex gap-2 mt-3">
            <Btn onClick={() => setOpen(null)}>Sluiten</Btn>
            <Btn tone="danger" onClick={() => remove(open)}>
              Verwijderen
            </Btn>
          </div>
        </div>
      )}
    </div>
  );
}

    if (!text.trim()) return;
    setTodos([...todos, { id: uid(), text: text.trim(), who, done: false, by: me.name }]);
    setText("");
