  #laden b { color: #C75B45; }
  #laden code { color: #173F6B; word-break: break-all; font-size: 0.8rem; }

<script>
/* Meldingen op het scherm, want op een telefoon is er geen console. */
window.__fouten = [];
function __toon(titel) {
  var el = document.getElementById("laden");
  if (!el) return;
  el.innerHTML =
    "<b>" + titel + "</b><br><br>" +
    "React: " + (window.React ? "ok" : "ONTBREEKT") + "<br>" +
    "ReactDOM: " + (window.ReactDOM ? "ok" : "ONTBREEKT") + "<br>" +
    "Babel: " + (window.Babel ? "ok" : "ONTBREEKT") + "<br>" +
    "Tailwind: " + (window.tailwind ? "ok" : "ONTBREEKT") + "<br>" +
    "Instellingen: " + (window.VAKANTIE_CONFIG ? "ok" : "ONTBREEKT") + "<br>" +
    "Opslag: " + (window.AppStore ? "ok" : "ONTBREEKT") + "<br>" +
    "Stand: " + (window.VAKANTIE_MODE || "nog niet bepaald") + "<br><br>" +
    (window.__fouten.length
      ? window.__fouten.map(function (t) { return "<code>" + t + "</code>"; }).join("<br><br>")
      : "Geen foutmelding opgevangen.") +
    "<br><br>Staat er ONTBREEKT bij React, ReactDOM of Babel? Zet dan de schilden van je browser uit voor deze site. In Brave: tik op het leeuwtje in de adresbalk en zet Shields uit.";
}
window.addEventListener("error", function (e) {
  window.__fouten.push((e.message || "fout") + (e.filename ? " | " + e.filename : "") + (e.lineno ? ":" + e.lineno : ""));
  __toon("Er ging iets mis bij het laden.");
});
window.addEventListener("unhandledrejection", function (e) {
  window.__fouten.push("promise: " + ((e.reason && e.reason.message) || e.reason));
});
/* Laat een echte fout ook zien wanneer React het laadblok al heeft vervangen. */
window.__toonRuntimeFout = function (tekst) {
  if (!tekst || /ResizeObserver loop/i.test(String(tekst))) return;
  var bestaand = document.getElementById("reisboek-runtime-fout");
  if (bestaand) return;
  var el = document.createElement("div");
  el.id = "reisboek-runtime-fout";
  el.style.cssText = "position:fixed;z-index:99999;left:14px;right:14px;top:82px;background:#FFFBF5;color:#22406B;border:2px solid #E98D7E;border-radius:18px;padding:14px;font:700 13px/1.45 system-ui;box-shadow:0 10px 30px rgba(34,64,107,.22);word-break:break-word";
  el.innerHTML = "<b>De app liep vast</b><br>" + String(tekst).replace(/[&<>]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]; }) + "<br><button onclick=\"location.reload()\" style=\"margin-top:10px;border:0;border-radius:12px;padding:9px 12px;background:#E98D7E;color:white;font-weight:800\">Opnieuw laden</button>";
  document.body.appendChild(el);
};
window.addEventListener("error", function (e) {
  if (!document.getElementById("laden") && e && e.message) window.__toonRuntimeFout(e.message);
});
window.addEventListener("unhandledrejection", function (e) {
  if (!document.getElementById("laden")) window.__toonRuntimeFout((e.reason && e.reason.message) || e.reason);
});
setTimeout(function () {
  if (document.getElementById("laden")) __toon("Het laden duurt te lang.");
}, 12000);
</script>
<script>
window.FIREBASE_STATUS = { fase: "config laden", ok: false, fout: "" };
</script>
<script src="config.js?v=62" onload="window.FIREBASE_STATUS.configBestand=true" onerror="window.FIREBASE_STATUS.configBestand=false; window.__fouten.push('config.js kon niet geladen worden')"></script>
<script>
/* Instellingen die in de app zelf zijn ingevuld gaan voor op config.js. */
(function () {
  try {
    var eigen = localStorage.getItem("reisboek-firebase");
    if (!eigen) return;
    var o = JSON.parse(eigen);
    window.VAKANTIE_CONFIG = window.VAKANTIE_CONFIG || {};
    if (o.firebase && o.firebase.projectId) window.VAKANTIE_CONFIG.firebase = o.firebase;
    if (o.tripId) window.VAKANTIE_CONFIG.tripId = o.tripId;
    if (typeof o.opslag === "boolean") window.VAKANTIE_CONFIG.opslag = o.opslag;
  } catch (e) {
    /* dan gewoon config.js gebruiken */
  }
})();
/* Vul authDomain automatisch in als alleen apiKey en projectId zijn opgeslagen. */
(function () {
  var c = window.VAKANTIE_CONFIG || {};
  var f = c.firebase || {};
  if (f.projectId && !f.authDomain) f.authDomain = f.projectId + ".firebaseapp.com";
  window.VAKANTIE_CONFIG = c;
})();
</script>
<script>
/* ------------------------------------------------------------------
   Opslag, inloggen en bestanden. Drie standen:
   - zonder Firebase-config: alles blijft op dit apparaat
   - met Firebase-config: gedeeld met de groep, plus inloggen met Google
   - met opslag: true erbij: video's gaan naar Firebase Storage
   ------------------------------------------------------------------ */
window.__initOpslag = function () {
  const cfg = window.VAKANTIE_CONFIG || {};
  const fb = { ...(cfg.firebase || {}) };
  if (fb.projectId && !fb.authDomain) fb.authDomain = fb.projectId + ".firebaseapp.com";
  const tripId = cfg.tripId || "onze-reis";
  const wilFirebase = !!(fb.projectId && fb.apiKey);
  let db = null;
  let auth = null;
  let opslag = null;

  window.FIREBASE_STATUS = window.FIREBASE_STATUS || {};
  window.FIREBASE_STATUS.projectId = fb.projectId || "";
  window.FIREBASE_STATUS.tripId = tripId;
  window.FIREBASE_STATUS.configAanwezig = wilFirebase;
  window.FIREBASE_STATUS.fase = "initialiseren";

  if (wilFirebase && window.firebase) {
    try {
      const app = firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(fb);
      db = app.firestore ? app.firestore() : firebase.firestore();
      if (firebase.auth) auth = app.auth ? app.auth() : firebase.auth();
      if (cfg.opslag && firebase.storage) opslag = app.storage ? app.storage() : firebase.storage();
      window.FIREBASE_STATUS.ok = true;
      window.FIREBASE_STATUS.fase = "verbonden";
      window.FIREBASE_STATUS.fout = "";
    } catch (e) {
      const bericht = (e && e.message) || String(e);
      window.FIREBASE_STATUS.ok = false;
      window.FIREBASE_STATUS.fase = "fout";
      window.FIREBASE_STATUS.fout = bericht;
      window.__fouten.push("Firebase start niet: " + bericht);
      db = null;
    }
  } else if (wilFirebase) {
    window.FIREBASE_STATUS.ok = false;
    window.FIREBASE_STATUS.fase = "bibliotheek ontbreekt";
    window.FIREBASE_STATUS.fout = "De Firebase-bibliotheek kon niet geladen worden.";
    window.__fouten.push("De Firebase-bibliotheek kon niet geladen worden; de app werkt nu alleen op dit apparaat.");
  } else {
    window.FIREBASE_STATUS.ok = false;
    window.FIREBASE_STATUS.fase = "geen configuratie";
    window.FIREBASE_STATUS.fout = "Geen projectId en apiKey gevonden in config.js of de lokale Firebase-instellingen.";
  }
  window.VAKANTIE_MODE = db ? "gedeeld" : "lokaal";

  const docId = (key) => key.replace(/[^a-zA-Z0-9_-]/g, "_");
  const lsKey = (key, shared) => "vakantie:" + (shared ? "g:" : "p:") + key;

  const local = {
    async get(key, shared) {
      const v = localStorage.getItem(lsKey(key, shared));
      if (v === null) throw new Error("niet gevonden");
      return { key, value: v, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem(lsKey(key, shared), value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem(lsKey(key, shared));
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const p = lsKey(prefix || "", shared);
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(p)) keys.push(k.slice(lsKey("", shared).length));
      }
      return { keys, prefix, shared: !!shared };
    },
  };

  /*
     Firebase Authentication herstelt een sessie asynchroon. Bij een nieuwe
     index-versie kan de app eerder om reisgegevens vragen dan Firebase weet
     wie er is ingelogd. Daarom wachten we kort en bewaren we altijd ook een
     lokale noodkopie. Zo opent een bestaande reis niet meer als een lege
     Reis-plannenpagina wanneer Firebase even traag of tijdelijk onbereikbaar is.
  */
  const authGereed = (() => {
    if (!auth) return Promise.resolve(null);
    if (auth.currentUser) return Promise.resolve(auth.currentUser);
    return new Promise((resolve) => {
      let klaar = false;
      let stop = null;
      const afronden = (u) => {
        if (klaar) return;
        klaar = true;
        try { if (stop) stop(); } catch (e) {}
        resolve(u || auth.currentUser || null);
      };
      try {
        stop = auth.onAuthStateChanged((u) => afronden(u), () => afronden(null));
      } catch (e) {
        afronden(null);
      }
      setTimeout(() => afronden(auth.currentUser || null), 5000);
    });
  })();

  async function zorgReislid() {
    if (!db || !auth) return null;
    const u = auth.currentUser || await authGereed;
    if (!u) return null;
    try {
      await db.collection("trips").doc(tripId).collection("members").doc(u.uid).set({
        uid: u.uid,
        email: u.email || "",
        name: u.displayName || u.email || "Reisgenoot",
        updatedAt: Date.now(),
      }, { merge: true });
    } catch (e) {
      /* Oude openbare regels hebben dit document mogelijk niet nodig. */
    }
    return u;
  }

  const gezamenlijkeDoc = (key) =>
    db.collection("trips").doc(tripId).collection("data").doc(docId(key));
  const persoonlijkeDoc = (uid, key) =>
    db.collection("users").doc(uid).collection("trips").doc(tripId).collection("data").doc(docId(key));

  window.AppStore = {
    async get(key, shared) {
      if (!shared) return local.get(key, false);
      if (!db) return local.get(key, true);
      let cloudFout = null;
      const u = await zorgReislid();

      /* Eerst de gezamenlijke reis lezen. */
      try {
        const snap = await gezamenlijkeDoc(key).get();
        if (snap.exists) {
          const waarde = snap.data().v;
          await local.set(key, waarde, true).catch(() => {});
          window.FIREBASE_STATUS.fase = "verbonden";
          window.FIREBASE_STATUS.fout = "";
          return { key, value: waarde, shared: true, bron: "gezamenlijk" };
        }
      } catch (e) {
        cloudFout = e;
      }

      /* Daarna de persoonlijke kopie van deze gebruiker. */
      if (u) {
        try {
          const snap = await persoonlijkeDoc(u.uid, key).get();
          if (snap.exists) {
            const waarde = snap.data().v;
            await local.set(key, waarde, true).catch(() => {});
            return { key, value: waarde, shared: true, bron: "persoonlijk" };
          }
        } catch (e) {
          cloudFout = cloudFout || e;
        }
      }

      /* Tot slot de lokale noodkopie. */
      try {
        const r = await local.get(key, true);
        if (cloudFout) {
          window.FIREBASE_STATUS.fout = (cloudFout && cloudFout.message) || String(cloudFout);
          window.FIREBASE_STATUS.fase = "lokale noodkopie";
        }
        return { ...r, bron: "lokaal" };
      } catch (e) {
        if (cloudFout) {
          window.FIREBASE_STATUS.fout = (cloudFout && cloudFout.message) || String(cloudFout);
          throw cloudFout;
        }
        throw e;
      }
    },

    async set(key, value, shared) {
      /* Altijd eerst lokaal opslaan. Dit is de vaste noodkopie tussen versies. */
      const lokaal = await local.set(key, value, !!shared);
      if (!db || !shared) return lokaal;

      const u = await zorgReislid();
      const document = { v: value, key, at: Date.now() };
      const fouten = [];
      try {
        await gezamenlijkeDoc(key).set(document);
      } catch (e) {
        fouten.push(e);
      }
      if (u) {
        try {
          await persoonlijkeDoc(u.uid, key).set(document);
        } catch (e) {
          fouten.push(e);
        }
      }
      if (fouten.length) {
        window.FIREBASE_STATUS.fout = fouten.map((e) => (e && e.message) || String(e)).join(" | ");
        window.FIREBASE_STATUS.fase = "lokaal opgeslagen; cloud wacht";
        return { ...lokaal, cloud: false };
      }
      window.FIREBASE_STATUS.fase = "verbonden";
      window.FIREBASE_STATUS.fout = "";
      return { key, value, shared: true, cloud: true };
    },

    async delete(key, shared) {
      await local.delete(key, !!shared).catch(() => {});
      if (!db || !shared) return { key, deleted: true, shared: !!shared };
      const u = await zorgReislid();
      const taken = [gezamenlijkeDoc(key).delete()];
      if (u) taken.push(persoonlijkeDoc(u.uid, key).delete());
      await Promise.allSettled(taken);
      return { key, deleted: true, shared: true };
    },

    async list(prefix, shared) {
      if (!shared || !db) return local.list(prefix, !!shared);
      const u = await zorgReislid();
      const keys = new Set();
      try {
        const snap = await db.collection("trips").doc(tripId).collection("data").get();
        snap.forEach((d) => {
          const k = d.data().key;
          if (k && (!prefix || k.startsWith(prefix))) keys.add(k);
        });
      } catch (e) {}
      if (u) {
        try {
          const snap = await db.collection("users").doc(u.uid).collection("trips").doc(tripId).collection("data").get();
          snap.forEach((d) => {
            const k = d.data().key;
            if (k && (!prefix || k.startsWith(prefix))) keys.add(k);
          });
        } catch (e) {}
      }
      try {
        const l = await local.list(prefix, true);
        (l.keys || []).forEach((k) => keys.add(k));
      } catch (e) {}
      return { keys: Array.from(keys), prefix, shared: true };
    },
  };

  /* Echt inloggen met je Google-account */
  window.AppAuth = {
    beschikbaar: !!auth,
    async inloggenMetGoogle() {
      if (!auth) throw new Error("Firebase Authentication is niet verbonden.");
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const res = await auth.signInWithPopup(provider);
        const u = res.user;
        return { email: u.email, name: u.displayName || u.email, foto: u.photoURL || "" };
      } catch (e) {
        const code = (e && e.code) || "";
        let bericht = (e && e.message) || "Inloggen met Google lukte niet.";
        if (/unauthorized-domain/i.test(code + " " + bericht)) {
          bericht = "Dit GitHub Pages-adres staat nog niet bij Firebase Authentication > Settings > Authorized domains. Voeg abraxas075.github.io toe.";
        }
        window.FIREBASE_STATUS.fout = bericht;
        throw new Error(bericht);
      }
    },
    async uitloggen() {
      if (auth) {
        try {
          await auth.signOut();
        } catch (e) {
          /* was al uitgelogd */
        }
      }
    },
    huidige() {
      const u = auth && auth.currentUser;
      return u ? { email: u.email, name: u.displayName || u.email, foto: u.photoURL || "" } : null;
    },
  };

  /* Grote bestanden, zoals video's */
  window.AppFiles = {
    beschikbaar: !!opslag,
    async upload(pad, file, bijWerken) {
      const verwijzing = opslag.ref().child(tripId + "/" + pad);
      const taak = verwijzing.put(file);
      if (bijWerken) {
        taak.on("state_changed", (stand) =>
          bijWerken(Math.round((stand.bytesTransferred / stand.totalBytes) * 100))
        );
      }
      await taak;
      return await verwijzing.getDownloadURL();
    },
    async verwijder(pad) {
      try {
        await opslag.ref().child(tripId + "/" + pad).delete();
      } catch (e) {
        /* stond er al niet */
      }
    },
  };
};

</script>
<script>
window.__firebaseNodig = function () {
  var c = window.VAKANTIE_CONFIG || {};
  var f = c.firebase || {};
  return !!(f.projectId && f.apiKey);
};
</script>

/* ---------- storage helpers ---------- */
async function loadKey(key, fallback, shared = true) {
  try {
    const r = await AppStore.get(key, shared);
    if (!r || !r.value) return fallback;
    try {
      return JSON.parse(r.value);
    } catch (e) {
      return r.value; // stond er nog als kale tekst in
    }
  } catch (e) {
    return fallback;
  }
}
const OPSLAG = { laatsteFout: "", vol: false };

async function saveKey(key, value, shared = true) {
  OPSLAG.laatsteFout = "";
  OPSLAG.vol = false;
  for (let poging = 0; poging < 3; poging++) {
    try {
      const r = await AppStore.set(key, JSON.stringify(value), shared);
      if (r) return true;
    } catch (e) {
      const tekst = `${e && e.name} ${e && e.message}`;
      OPSLAG.laatsteFout = tekst;
      if (/quota|exceeded|full|storage/i.test(tekst)) {
        OPSLAG.vol = true;
        return false; // opnieuw proberen heeft geen zin
      }
    }
    await new Promise((r) => setTimeout(r, 350 * (poging + 1)));
  }
  return false;
}

/* Hoeveel ruimte gebruikt dit reisboek op dit apparaat? */
function opslagGebruik() {
  try {
    let bytes = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("vakantie:")) bytes += k.length + (localStorage.getItem(k) || "").length;
    }
    return bytes * 2; // tekens worden als 2 bytes bewaard
  } catch (e) {
    return 0;
  }
}
const mbTekst = (bytes) => `${(bytes / 1048576).toFixed(1).replace(".", ",")} MB`;

/* Google Places (New) - welke plek ligt op dit punt? */
async function plaatsnaamBijPunt(key, punt, straal = 80) {
  const [lat, lng] = punt.split(",").map(Number);
  try {
    const res = await fetch("https://places.googleapis.com/v1/places:searchNearby", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Goog-Api-Key": key,
        "X-Goog-FieldMask":
          "places.displayName,places.formattedAddress,places.primaryTypeDisplayName,places.rating,places.userRatingCount",
      },
      body: JSON.stringify({
        languageCode: "nl",
        maxResultCount: 1,
        rankPreference: "DISTANCE",
        locationRestriction: { circle: { center: { latitude: lat, longitude: lng }, radius: straal } },
      }),
    });
    if (!res.ok) return null;
    const data = await res.json();
    const p = (data.places || [])[0];
    if (!p) return null;
    return {
      naam: p.displayName?.text || "",
      adres: p.formattedAddress || "",
      soort: p.primaryTypeDisplayName?.text || "",
      score: p.rating || null,
      aantal: p.userRatingCount || null,
    };
  } catch (e) {
    return null;
  }
}

/* Eerst dichtbij zoeken, daarna in een ruimere cirkel. */
async function zoekNaam(key, punt) {
  return (
    (await plaatsnaamBijPunt(key, punt, 80)) ||
    (await plaatsnaamBijPunt(key, punt, 400)) ||
    (await plaatsnaamBijPunt(key, punt, 1200))
  );
}

/* Afstand tussen twee punten in meters (formule van Haversine). */
const afstandMeter = (a, b) => {
  const R = 6371000;
  const rad = (g) => (g * Math.PI) / 180;
  const dLat = rad(b.lat - a.lat);
  const dLng = rad(b.lng - a.lng);
  const x =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
};

/* De route inpakken zoals Google dat doet, zodat hij in een kaart-adres past. */
const codeerGetal = (getal) => {
  let g = getal < 0 ? ~(getal << 1) : getal << 1;
  let uit = "";
  while (g >= 0x20) {
    uit += String.fromCharCode((0x20 | (g & 0x1f)) + 63);
    g >>= 5;
  }
  return uit + String.fromCharCode(g + 63);
};
const codeerPad = (punten) => {
  let vLat = 0;
  let vLng = 0;
  let uit = "";
  for (const p of punten) {
    const lat = Math.round(p.lat * 1e5);
    const lng = Math.round(p.lng * 1e5);
    uit += codeerGetal(lat - vLat) + codeerGetal(lng - vLng);
    vLat = lat;
    vLng = lng;
  }
  return uit;
};

/* Punten die te dicht op elkaar liggen weglaten, scheelt ruimte. */
const dunUit = (punten, minMeter = 12) => {
  const uit = [];
  for (const p of punten) {
    if (!uit.length || afstandMeter(uit[uit.length - 1], p) >= minMeter) uit.push(p);
  }
  if (punten.length && uit[uit.length - 1] !== punten[punten.length - 1]) {
    uit.push(punten[punten.length - 1]);
  }
  return uit;
};

const duurTekst = (seconden) => {
  const u = Math.floor(seconden / 3600);
  const m = Math.round((seconden % 3600) / 60);
  if (u > 0) return `${u} uur ${m} min`;
  return `${m} min`;
};
const afstandTekst = (meters) =>
  meters >= 1000 ? `${(meters / 1000).toFixed(1).replace(".", ",")} km` : `${Math.round(meters)} m`;

/* Herkent "52.09,5.12" of "geo:52.09,5.12" - dat willen we niet als tekst tonen. */
const alsCoordinaat = (tekst) => {
  if (!tekst) return null;
  const t = String(tekst)
    .replace(/^geo:/i, "")
    .replace(/\u00b0/g, "")
    .replace(/\s+/g, "")
    .trim();
  const m = t.match(/^(-?\d{1,3}(?:\.\d+)?),(-?\d{1,3}(?:\.\d+)?)$/);
  if (!m) return null;
  const lat = Number(m[1]);
  const lng = Number(m[2]);
  if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  return `${lat},${lng}`;
};

/* Kan de omgeving uberhaupt een kaartafbeelding van Google laden? */
function testImage(key) {
  return new Promise((resolve) => {
    const img = new Image();
    const timer = setTimeout(() => resolve(false), 7000);
    img.onload = () => {
      clearTimeout(timer);
      resolve(img.naturalWidth > 10);
    };
    img.onerror = () => {
      clearTimeout(timer);
      resolve(false);
    };
    img.src = mapsStatic("Amsterdam", key);
  });
}

function leesTijdlijn(json) {
  const uit = [];
  const voegToe = (naam, adres, start, extra = {}) => {
    if (!naam || !start) return;
    const d = new Date(start);
    if (isNaN(d.getTime())) return;
    uit.push({
      date: kortDatum(d),
      time: `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`,
      title: naam,
      place: adres || "",
      ...extra,
    });
  };
  const uitE7 = (l) =>
    l && l.latitudeE7 != null ? `${l.latitudeE7 / 1e7},${l.longitudeE7 / 1e7}` : "";
  const uitGeo = (v) => {
    if (!v) return "";
    if (typeof v === "string") return alsCoordinaat(v) || "";
    if (v.latLng) return alsCoordinaat(v.latLng) || "";
    return "";
  };

  // oude uitvoer: Semantic Location History
  const objecten = json?.timelineObjects || [];
  objecten.forEach((o) => {
    if (o.placeVisit) {
      const loc = o.placeVisit.location || {};
      voegToe(loc.name || loc.address || "Bezoek", loc.address, o.placeVisit.duration?.startTimestamp);
    } else if (o.activitySegment) {
      const a = o.activitySegment;
      voegToe(`Onderweg ${vervoerNaam(a.activityType)}`, "", a.duration?.startTimestamp, {
        soort: "onderweg",
        vanPunt: uitE7(a.startLocation),
        naarPunt: uitE7(a.endLocation),
      });
    }
  });

  // nieuwe uitvoer: timeline uit de telefoon
  const segmenten = json?.semanticSegments || (Array.isArray(json) ? json : []);
  segmenten.forEach((s) => {
    const start = s.startTime || s.startTimestamp;
    if (s.visit) {
      const kand = s.visit.topCandidate || {};
      const ll = kand.placeLocation?.latLng;
      const plek =
        typeof ll === "string"
          ? ll
          : ll && ll.latitude != null
          ? `${ll.latitude},${ll.longitude}`
          : kand.placeId || "";
      voegToe(kand.semanticType && kand.semanticType !== "UNKNOWN" ? kand.semanticType : "Bezoek", String(plek), start);
    } else if (s.activity) {
      voegToe(`Onderweg ${vervoerNaam(s.activity.topCandidate?.type)}`, "", start, {
        soort: "onderweg",
        vanPunt: uitGeo(s.activity.start),
        naarPunt: uitGeo(s.activity.end),
      });
    }
  });

  return uit;
}

const localToday = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};
const asDate = (iso) => new Date(iso + "T12:00:00");
const dayList = (start, end) => {
  const out = [];
  if (!start || !end) return out;
  let d = asDate(start);
  const e = asDate(end);
  let guard = 0;
  while (d <= e && guard < 400) {
    out.push(
      `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`
    );
    d = new Date(d.getTime() + 86400000);
    guard++;
  }
  return out;
};

/* Google Places (New) - Text Search, rechtstreeks vanuit de browser */
async function searchPlacesApi({ key, area, category, extra }) {
  const res = await fetch("https://places.googleapis.com/v1/places:searchText", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Goog-Api-Key": key,
      "X-Goog-FieldMask":
        "places.id,places.displayName,places.formattedAddress,places.rating,places.userRatingCount,places.priceLevel,places.primaryTypeDisplayName,places.currentOpeningHours.openNow",
    },
    body: JSON.stringify({
      textQuery: `${category} in ${area}${extra ? " " + extra : ""}`,
      languageCode: "nl",
      maxResultCount: 10,
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(
      data?.error?.message ||
        "Google weigerde de zoekopdracht. Controleer de key, de Places API (New) en de websitebeperking."
    );
  }
  const places = data.places || [];
  if (!places.length) throw new Error("Google vond hier niets. Probeer een andere plaats of categorie.");
  return places.map((p) => {
    const name = p.displayName?.text || "Naamloos";
    const bits = [];
    if (p.rating) bits.push(`${String(p.rating).replace(".", ",")} ster${p.rating === 1 ? "" : "ren"}`);
    if (p.userRatingCount) bits.push(`${p.userRatingCount} beoordelingen`);
    if (PRICE[p.priceLevel]) bits.push(PRICE[p.priceLevel]);
    if (p.currentOpeningHours?.openNow === true) bits.push("nu open");
    if (p.currentOpeningHours?.openNow === false) bits.push("nu gesloten");
    return {
      name,
      category: p.primaryTypeDisplayName?.text || category,
      area: p.formattedAddress || area,
      description: bits.join(" | "),
      maps_query: p.id ? `place_id:${p.id}` : `${name} ${area}`,
      mapsSearch: `${name} ${p.formattedAddress || area}`,
      source: "google",
    };
  });
}

async function geocodeerTekst(key, tekst) {
  const punt = alsCoordinaat(tekst);
  if (punt) return punt;
  if (!key || !tekst) return null;
  try {
    const res = await fetch("https://places.googleapis.com/v1/places:searchText", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Goog-Api-Key": key,
        "X-Goog-FieldMask": "places.location",
      },
      body: JSON.stringify({ textQuery: tekst, languageCode: "nl" }),
    });
    const data = await res.json();
    const loc = data?.places?.[0]?.location;
    if (!loc) return null;
    return `${loc.latitude.toFixed(6)},${loc.longitude.toFixed(6)}`;
  } catch (e) {
    return null;
  }
}

/* Open-Meteo: gratis, geen sleutel nodig, geeft dagcijfers per dag terug. */
async function haalWeerbericht(punt, vanISO, totISO) {
  if (!punt) return { perDag: {}, fout: "" };
  const [lat, lng] = punt.split(",").map(Number);
  try {
    const url =
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}` +
      `&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto` +
      `&start_date=${vanISO}&end_date=${totISO}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data || !data.daily || !data.daily.time) {
      return { perDag: {}, fout: "Voor deze reisdata is nog geen voorspelling beschikbaar." };
    }
    const perDag = {};
    data.daily.time.forEach((iso, i) => {
      perDag[iso] = {
        max: Math.round(data.daily.temperature_2m_max[i]),
        min: Math.round(data.daily.temperature_2m_min[i]),
        code: data.daily.weathercode[i],
      };
    });
    return { perDag, fout: "" };
  } catch (e) {
    return { perDag: {}, fout: "Het weerbericht kon niet opgehaald worden." };
  }
}

async function berekenReis(key, van, naar, stops, vertrekISO, vervoer) {
  const wijze = REISWIJZE[String(vervoer || "auto").toLowerCase()];
  if (!wijze) return { fout: "Voor een vlucht kan Google geen reistijd berekenen." };

  const body = {
    origin: alsWaypoint(van),
    destination: alsWaypoint(naar),
    travelMode: wijze,
    languageCode: "nl-NL",
    units: "METRIC",
  };
  const tussen = (stops || []).filter((x) => x && String(x).trim());
  if (tussen.length) body.intermediates = tussen.map(alsWaypoint);
  if (vertrekISO) body.departureTime = vertrekISO;
  if (wijze === "DRIVE") body.routingPreference = "TRAFFIC_AWARE";

  try {
    const res = await fetch("https://routes.googleapis.com/directions/v2:computeRoutes", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Goog-Api-Key": key,
        "X-Goog-FieldMask":
          "routes.duration,routes.distanceMeters,routes.legs.duration,routes.legs.distanceMeters",
      },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) {
      const bericht = data?.error?.message || "";
      if (/api|enabled|permission|blocked/i.test(bericht)) {
        return {
          fout:
            "Google weigert dit: zet 'Routes API' aan in Google Cloud en voeg hem toe aan de beperkingen van je key.",
        };
      }
      return { fout: bericht || "Google gaf een fout terug." };
    }
    const route = data?.routes?.[0];
    if (!route) return { fout: "Google vond geen route tussen deze plaatsen." };
    const sec = parseInt(String(route.duration || "0").replace("s", ""), 10) || 0;
    return {
      seconden: sec,
      meters: route.distanceMeters || 0,
      delen: (route.legs || []).map((l) => ({
        seconden: parseInt(String(l.duration || "0").replace("s", ""), 10) || 0,
        meters: l.distanceMeters || 0,
      })),
    };
  } catch (e) {
    return { fout: "Geen verbinding met Google." };
  }
}

/* Uit een geplakte Google Maps-link halen wat bruikbaar is. */
const uitMapsLink = (tekst) => {
  const t = String(tekst || "").trim();
  if (
    !/^https?:\/\//i.test(t) ||
    !/(maps\.google\.[a-z.]+|google\.[a-z.]+\/maps|goo\.gl\/maps|maps\.app\.goo\.gl)/i.test(t)
  ) {
    return null;
  }
  if (/maps\.app\.goo\.gl|goo\.gl\/maps/i.test(t)) return { kort: true };

  const paar = (a, b) => `${Number(a).toFixed(6)},${Number(b).toFixed(6)}`;

  const naamUitPad = () => {
    const n = t.match(/\/place\/([^/@?]+)/);
    return n ? decodeURIComponent(n[1]).replace(/\+/g, " ") : "";
  };

  let m = t.match(/[?&]q=(?:loc:)?(-?\d+\.\d+),\s*(-?\d+\.\d+)/i);
  if (m) return { punt: paar(m[1], m[2]), naam: naamUitPad() };

  m = t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if (m) return { punt: paar(m[1], m[2]), naam: naamUitPad() };

  m = t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) {
    const naam = t.match(/\/place\/([^/@]+)/);
    return {
      punt: paar(m[1], m[2]),
      naam: naam ? decodeURIComponent(naam[1]).replace(/\+/g, " ") : "",
    };
  }

  m = t.match(/\/place\/([^/@?]+)/);
  if (m) return { naam: decodeURIComponent(m[1]).replace(/\+/g, " ") };

  return { onbekend: true };
};

      setSuggestions([]);
      return;
    }
    let cancelled = false;
    const t = setTimeout(async () => {
      const found = await autocompletePlaces(key, value);

/* ---------- de opnamegegevens uit een foto lezen (Exif) ---------- */
const TYPE_GROOTTE = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8 };

function leesIFD(dv, tiff, ifd, le) {
  const uit = {};
  const aantal = dv.getUint16(tiff + ifd, le);
  for (let i = 0; i < aantal; i++) {
    const e = tiff + ifd + 2 + i * 12;
    if (e + 12 > dv.byteLength) break;
    const tag = dv.getUint16(e, le);
    const type = dv.getUint16(e + 2, le);
    const n = dv.getUint32(e + 4, le);
    const bytes = (TYPE_GROOTTE[type] || 1) * n;
    const waar = bytes <= 4 ? e + 8 : tiff + dv.getUint32(e + 8, le);
    uit[tag] = { type, n, waar };
  }
  return uit;
}
const leesTekst = (dv, v) => {
  let t = "";
  for (let i = 0; i < v.n && v.waar + i < dv.byteLength; i++) {
    const c = dv.getUint8(v.waar + i);
    if (!c) break;
    t += String.fromCharCode(c);
  }
  return t;
};
const leesBreuk = (dv, waar, le) => {
  const teller = dv.getUint32(waar, le);
  const noemer = dv.getUint32(waar + 4, le);
  return noemer ? teller / noemer : 0;
};

async function leesExif(file) {
  try {
    const buf = await file.slice(0, 512 * 1024).arrayBuffer();
    const dv = new DataView(buf);
    if (dv.byteLength < 8 || dv.getUint16(0) !== 0xffd8) return null;
    let pos = 2;
    while (pos + 4 < dv.byteLength) {
      const merk = dv.getUint16(pos);
      if ((merk & 0xff00) !== 0xff00) break;
      const lengte = dv.getUint16(pos + 2);
      if (merk === 0xffe1 && dv.getUint32(pos + 4) === 0x45786966) {
        const tiff = pos + 10;
        const le = dv.getUint16(tiff) === 0x4949;
        const ifd0 = leesIFD(dv, tiff, dv.getUint32(tiff + 4, le), le);
        let datum = null;
        let punt = null;
        if (ifd0[0x8769]) {
          const exif = leesIFD(dv, tiff, dv.getUint32(ifd0[0x8769].waar, le), le);
          const v = exif[0x9003] || exif[0x9004];
          if (v) {
            const t = leesTekst(dv, v); // "2026:08:09 14:22:31"
            const m = t.match(/^(\d{4}):(\d{2}):(\d{2})/);
            if (m) datum = `${m[1]}-${m[2]}-${m[3]}`;
          }
        }
        if (ifd0[0x8825]) {
          const gps = leesIFD(dv, tiff, dv.getUint32(ifd0[0x8825].waar, le), le);
          const graden = (v) =>
            v && v.n >= 3
              ? leesBreuk(dv, v.waar, le) +
                leesBreuk(dv, v.waar + 8, le) / 60 +
                leesBreuk(dv, v.waar + 16, le) / 3600
              : null;
          const lat = graden(gps[0x0002]);
          const lng = graden(gps[0x0004]);
          if (lat != null && lng != null) {
            const nz = leesTekst(dv, gps[0x0001] || { n: 0, waar: 0 }) || "N";
            const ow = leesTekst(dv, gps[0x0003] || { n: 0, waar: 0 }) || "E";
            punt = `${(nz === "S" ? -lat : lat).toFixed(6)},${(ow === "W" ? -lng : lng).toFixed(6)}`;
          }
        }
        return { datum, punt };
      }
      pos += 2 + lengte;
    }
    return null;
  } catch (e) {
    return null;
  }
}

/* ---------- video: hoeveel past er in de opslag, en wat is het beeldje ---------- */
const VIDEO_MAX = 2.5 * 1024 * 1024; // ruwe bestandsgrootte

const youtubeId = (u) => {
  const m = String(u || "").match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
};

/* Pakt een stilstaand beeldje uit een videobestand, als voorvertoning. */
function videoBeeldje(file, max = 800) {
  return new Promise((klaar, mis) => {
    const bron = URL.createObjectURL(file);
    const v = document.createElement("video");
    v.preload = "metadata";
    v.muted = true;
    v.playsInline = true;
    let gedaan = false;
    const opruimen = () => URL.revokeObjectURL(bron);
    v.onloadeddata = () => {
      try {
        v.currentTime = Math.min(1, (v.duration || 2) / 3);
      } catch (e) {
        /* sommige browsers springen niet */
      }
    };
    v.onseeked = () => {
      if (gedaan) return;
      gedaan = true;
      try {
        const schaal = Math.min(1, max / Math.max(v.videoWidth || max, v.videoHeight || max));
        const c = document.createElement("canvas");
        c.width = Math.round((v.videoWidth || max) * schaal);
        c.height = Math.round((v.videoHeight || max) * schaal);
        c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
        opruimen();
        klaar(c.toDataURL("image/jpeg", 0.7));
      } catch (e) {
        opruimen();
        mis(new Error("Van deze video lukte geen voorvertoning."));
      }
    };
    v.onerror = () => {
      opruimen();
      mis(new Error("Dit videobestand kon niet gelezen worden."));
    };
    v.src = bron;
  });
}

function bestandNaarTekst(file) {
  return new Promise((klaar, mis) => {
    const r = new FileReader();
    r.onload = () => klaar(r.result);
    r.onerror = () => mis(new Error("Het bestand kon niet gelezen worden."));
    r.readAsDataURL(file);
  });
}

/* ---------- image resize ---------- */
const DOC_GRENS = 900000; // Firestore staat 1 MiB per document toe

/* Verklein tot de foto zeker in een document past. */
async function maakPassend(file) {
  const stappen = [
    [1200, 0.72],
    [1000, 0.65],
    [800, 0.6],
    [640, 0.55],
  ];
  let laatste = "";
  for (const [max, kwaliteit] of stappen) {
    laatste = await resizeImage(file, max, kwaliteit);
    if (laatste.length <= DOC_GRENS) return laatste;
  }
  return laatste;
}

function resizeImage(file, max = 1200, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Bestand kon niet gelezen worden"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Dit bestand is geen afbeelding"));
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- trip setup ---------- */
function SetupView({ me, initial, onSave, onCancel, apiKey, setApiKey, onImportTimeline }) {
  const [trip, setTrip] = useState(initial || { name: "", destination: "", base: "", start: localToday(), end: localToday(), summary: "" });
  const [error, setError] = useState("");
  const [rekenBezig, setRekenBezig] = useState(false);
  const [rekenUitslag, setRekenUitslag] = useState("");
  const set = (k) => (e) => setTrip({ ...trip, [k]: e.target.value });
  const setStops = (lijst) => setTrip({ ...trip, stops: lijst });
  const voegStopToe = () => setStops([...(trip.stops || []), { id: uid(), place: "", date: "", time: "", note: "" }]);
  const wijzigStop = (id, veld, waarde) => setStops((trip.stops || []).map((s) => s.id === id ? { ...s, [veld]: waarde } : s));
  const klokUit = (d) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  const berekenAankomst = async () => {
    if (!apiKey) return setRekenUitslag("Vul onder Geavanceerde instellingen eerst een Google Maps-key in.");
    const van = trip.travelFrom, naar = trip.base || trip.destination;
    if (!van || !naar) return setRekenUitslag("Vul eerst het vertrekpunt en de bestemming in.");
    setRekenBezig(true); setRekenUitslag("");
    const vertrek = new Date(`${trip.start || localToday()}T${trip.travelDepart || "08:00"}:00`);
    const nu = new Date(); const vertrekISO = (vertrek > nu ? vertrek : new Date(nu.getTime() + 120000)).toISOString();
    const r = await berekenReis(apiKey, van, naar, (trip.stops || []).map((x) => x.place), vertrekISO, trip.travelMode);
    setRekenBezig(false); if (r.fout) return setRekenUitslag(r.fout);
    const basis = new Date(`${trip.start || "2000-01-01"}T${trip.travelDepart || "08:00"}:00`);
    const aankomst = new Date(basis.getTime() + r.seconden * 1000);
    setTrip({ ...trip, travelArrive: klokUit(aankomst), travelDistanceM: r.meters, travelDurationS: r.seconden });
    setRekenUitslag(`${afstandTekst(r.meters)} · ${duurTekst(r.seconden)} rijden`);
  };
  const submit = () => {
    if (!trip.name.trim() || !trip.destination.trim()) return setError("Geef de reis een naam en een bestemming.");
    if (daysBetween(trip.start, trip.end) < 0) return setError("De einddatum ligt voor de startdatum.");
    onSave({ ...trip, name: trip.name.trim(), destination: trip.destination.trim() });
  };
  return (
    <div className="min-h-screen" style={{ background: C.bg }}>
      <SchermKop onBack={onCancel || (() => {})} compact />
      <main className="mx-auto" style={{ maxWidth: 430, padding: "14px 16px 34px", minHeight: "calc(100vh - 70px)", background: C.bone }}>
        <h2 className="font-serif" style={{ color: C.ink, fontSize: 25, lineHeight: 1.15 }}>Reis plannen</h2>
        <p className="text-sm mt-1" style={{ color: C.muted }}>Waar gaan we naartoe?</p>
        <section className="space-y-3 mt-4">
          <Field label="Reisnaam" placeholder="Vakantie Corsica" value={trip.name} onChange={set("name")} />
          <AddressField label="Bestemming" placeholder="Ghisonaccia, Corsica" value={trip.destination} onChange={set("destination")} />
          <AddressField label="Verblijfsadres" placeholder="Rue des Platanes 20240" value={trip.base || ""} onChange={set("base")} />
          {(trip.base || trip.destination) && <div className="grid grid-cols-2 gap-2"><a href={mapsLink(trip.base || trip.destination)} target="_blank" rel="noopener noreferrer" className="rounded-2xl flex items-center justify-center" style={{ height: 42, background: "#FFFFFF", color: C.ink, border: `2px solid ${C.line}`, fontWeight: 800, fontSize: 13 }}>📍 Open in Google Maps</a><button type="button" onClick={() => navigator.clipboard?.writeText(mapsLink(trip.base || trip.destination))} className="rounded-2xl" style={{ height: 42, background: "#FFFFFF", color: C.ink, border: `2px solid ${C.line}`, fontWeight: 800, fontSize: 13 }}>🔗 Kopieer Maps-link</button></div>}
        </section>
        <section className="rounded-[24px] mt-4" style={{ padding: 14, background: "#FFFFFF", border: `2px solid ${C.line}`, boxShadow: SCHADUW.kaart }}>
          <div className="flex items-center gap-2 mb-3"><Icoon naam="reis" kleur={C.koraal} maat={20} /><Eyebrow color={C.marigold}>Heenreis</Eyebrow></div>
          <div className="grid grid-cols-2 gap-2">
            <AddressField label="Vertrekpunt" placeholder="Zaandam" value={trip.travelFrom || ""} onChange={set("travelFrom")} />
            <label className="block"><Eyebrow>Vervoermiddel</Eyebrow><select value={trip.travelMode || "auto"} onChange={set("travelMode")} className="w-full mt-1 rounded-2xl" style={{ height: 46, padding: "0 14px", background: "#FFFFFF", color: C.ink, border: `2px solid ${C.line}` }}>{["auto","vliegtuig","trein","bus","camper","anders"].map((x) => <option key={x}>{x}</option>)}</select></label>
            <Field label="Vertrektijd" type="time" value={trip.travelDepart || ""} onChange={set("travelDepart")} />
            <Field label="Aankomsttijd" type="time" value={trip.travelArrive || ""} onChange={set("travelArrive")} />
            <Field label="Tussenstops" placeholder="1 tussenstop" value={String((trip.stops || []).length || "")} readOnly />
            <Field label="Activiteit onderweg" placeholder="Pauzes bovenop reistijd" value={trip.travelNotes || ""} onChange={set("travelNotes")} />
          </div>
          <button type="button" onClick={berekenAankomst} disabled={rekenBezig} className="w-full rounded-2xl mt-3" style={{ height: 44, background: C.koraal, color: "#FFFFFF", border: 0, fontWeight: 900, fontSize: 12, letterSpacing: ".5px" }}>{rekenBezig ? "GOOGLE REKENT…" : "AANKOMST BEREKENEN VIA GOOGLE MAPS"}</button>
          {rekenUitslag && <p className="text-sm mt-2" style={{ color: C.marigold }}>{rekenUitslag}</p>}
        </section>
        <details className="rounded-2xl mt-4" style={{ background: "#FFFFFF", border: `2px solid ${C.line}`, padding: 12 }}>
          <summary style={{ color: C.ink, fontWeight: 900, cursor: "pointer" }}>Geavanceerde reisinstellingen</summary>
          <div className="space-y-3 mt-4">
            <div className="grid grid-cols-2 gap-2"><Field label="Van" type="date" value={trip.start} onChange={set("start")} /><Field label="Tot en met" type="date" value={trip.end} onChange={set("end")} /></div>
            <label className="block"><Eyebrow>Korte omschrijving</Eyebrow><textarea rows={2} value={trip.summary || ""} onChange={set("summary")} className="w-full mt-1 rounded-2xl" style={{ padding: 12, background: "#FFFFFF", color: C.ink, border: `2px solid ${C.line}` }} /></label>
            <div><Eyebrow>Tussenstops</Eyebrow>{(trip.stops || []).map((s,i) => <div key={s.id} className="mt-2 rounded-2xl" style={{ padding: 10, border: `1px solid ${C.line}` }}><AddressField label={`Stop ${i+1}`} placeholder="Plaats of adres" value={s.place || ""} onChange={(e) => wijzigStop(s.id,"place",e.target.value)} /><button type="button" onClick={() => setStops((trip.stops || []).filter((x) => x.id !== s.id))} className="text-xs mt-2" style={{ color: C.marigold }}>Verwijderen</button></div>)}<Btn tone="ghost" className="mt-2" onClick={voegStopToe}>Tussenstop toevoegen</Btn></div>
            <KeyCard apiKey={apiKey} setApiKey={setApiKey} />
            <TijdlijnImport days={dayList(trip.start, trip.end)} onImport={onImportTimeline} />
          </div>
        </details>
        {error && <p className="text-sm mt-3" style={{ color: C.marigold }}>{error}</p>}
        <button type="button" onClick={submit} className="w-full rounded-2xl mt-4" style={{ height: 48, background: C.ink, color: "#FFFFFF", border: 0, fontWeight: 900, letterSpacing: "1.2px", boxShadow: "0 6px 16px rgba(34,64,107,.22)" }}>REIS OPSLAAN</button>
      </main>
    </div>
  );
}

  const [result, setResult] = useState(null);
  return (
    <Card>
      <div className="flex items-center justify-between gap-2">
        <Eyebrow color={apiKey ? C.mint : C.muted}>

        </Eyebrow>
        <button
          onClick={() => setOpen(!open)}
          className="font-mono uppercase text-xs tracking-widest focus:outline-none focus:ring-2"
          style={{ color: C.ink }}
        >
          {open ? "Verbergen" : "Instellen"}
        </button>
      </div>
      {open && (
        <div className="mt-3 space-y-2">
          <Field
            label="Key"
            type="password"
            placeholder="AIza..."
            value={value}
            onChange={(e) => setValue(e.target.value)}
          />
          <div className="flex gap-2">
            <Btn onClick={() => setApiKey(value.trim())} disabled={!value.trim()}>
              Key opslaan
            </Btn>
            <Btn
              tone="ghost"
              disabled={!value.trim() || testing}
              onClick={async () => {
                setTesting(true);
                setResult(null);
                setResult(await testKey(value.trim()));
                setTesting(false);
              }}
            >
              {testing ? "Testen..." : "Key testen"}
            </Btn>
            {apiKey && (
              <Btn
                tone="danger"
                onClick={() => {
                  setValue("");
                  setApiKey("");
                }}
              >
                Wissen
              </Btn>
            )}
          </div>
          {result && (
            <p className="text-sm" style={{ color: result.ok ? C.ink : C.ember }}>
              {result.message}
            </p>
          )}
          <div className="text-xs leading-relaxed" style={{ color: C.muted }}>
            <p>
              Nodig in Google Cloud: Maps Static API, Maps Embed API en Places API (New), met
              facturering aan.
            </p>
            <p className="mt-1">
              Beperk de key tot die drie API's en tot de websites waar de app draait. Een key in een
              app als deze staat in de code van de pagina en is dus zichtbaar voor iedereen die de
              app opent - zonder beperking kan iemand anders hem gebruiken op jouw rekening.
            </p>
          </div>
        </div>
      )}
      {!open && apiKey && (
        <p className="text-sm mt-2">Kaarten en zoekresultaten komen rechtstreeks van Google.</p>
      )}
    </Card>
  );
}

/* ---------- tijdlijn importeren ---------- */
function TijdlijnImport({ days, onImport }) {
  const [gevonden, setGevonden] = useState(null);
  const [selectie, setSelectie] = useState([]);
  const [handmatigOpen, setHandmatigOpen] = useState(false);
  const [melding, setMelding] = useState("");

  const lees = (e) => {
    const file = (e.target.files || [])[0];
    if (!file) return;
    setMelding("Bestand wordt gelezen...");
    const reader = new FileReader();
    reader.onerror = () => setMelding("Het bestand kon niet gelezen worden.");
    reader.onload = () => {
      try {
        const json = JSON.parse(reader.result);
        const alles = leesTijdlijn(json);
        const binnen = days.length ? alles.filter((i) => days.includes(i.date)) : alles;
        if (!binnen.length) {
          setGevonden(null);
          setSelectie([]);
          setHandmatigOpen(false);
          setMelding(
            alles.length
              ? `Er staan ${alles.length} momenten in het bestand, maar geen enkele valt binnen je reisdata.`
              : "Geen herkenbare tijdlijn in dit bestand. Kies het JSON-bestand uit Takeout, niet de KML- of HTML-versie."
          );
          return;
        }
        setGevonden(binnen);
        setSelectie(binnen.map((_, i) => i));
        setHandmatigOpen(false);
        setMelding(`${binnen.length} momenten gevonden binnen je reis.`);
      } catch (err) {
        setGevonden(null);
        setSelectie([]);
        setHandmatigOpen(false);
        setMelding("Dit is geen geldig JSON-bestand.");
      }
    };
    reader.readAsText(file);
  };

  const wisselMoment = (index) => {
    setSelectie((huidig) =>
      huidig.includes(index)
        ? huidig.filter((n) => n !== index)
        : [...huidig, index].sort((a, b) => a - b)
    );
  };

  const geselecteerdeMomenten = gevonden
    ? gevonden.filter((_, index) => selectie.includes(index))
    : [];

  return (
    <Card>
      <Eyebrow color={C.ember}>Google-tijdlijn overnemen</Eyebrow>
      <p className="text-sm mt-2 leading-relaxed">
        Google biedt geen koppeling meer aan waarmee een app rechtstreeks je tijdlijn kan uitlezen -
        die staat sinds kort alleen nog op je telefoon. Exporteren kan wel: open in de Google
        Maps-app je profielfoto &gt; <span className="font-mono text-xs">Je tijdlijn</span> &gt; de drie
        puntjes &gt; <span className="font-mono text-xs">Tijdlijn exporteren</span>. Kies het
        JSON-bestand hieronder.
      </p>
      <input
        type="file"
        accept=".json,application/json"
        onChange={lees}
        className="block w-full text-sm mt-3"
        style={{ color: C.muted }}
      />
      {melding && (
        <p className="text-sm mt-2" style={{ color: gevonden ? C.ink : C.ember }}>
          {melding}
        </p>
      )}
      {gevonden && (
        <div className="mt-3">
          {!handmatigOpen && (
            <ul className="text-sm space-y-1">
              {gevonden.slice(0, 4).map((i, n) => (
                <li key={n} style={{ color: C.muted }}>
                  <span className="font-mono text-xs">
                    {fmtShort(i.date)} {i.time}
                  </span>{" "}
                  {i.title}
                </li>
              ))}
              {gevonden.length > 4 && (
                <li style={{ color: C.muted }}>...en nog {gevonden.length - 4}</li>
              )}
            </ul>
          )}

          <Btn
            tone="ghost"
            className="mt-3 w-full"
            onClick={() => setHandmatigOpen((open) => !open)}
          >
            {handmatigOpen ? "Selectielijst sluiten" : "Handmatig momenten selecteren"}
          </Btn>

          {handmatigOpen && (
            <div
              className="mt-3 rounded-2xl p-3"
              style={{ background: C.boneSoft, border: `2px solid ${C.line}` }}
            >
              <div className="flex items-center justify-between gap-2 flex-wrap">
                <p className="text-sm font-mono" style={{ color: C.ink }}>
                  {selectie.length} van {gevonden.length} geselecteerd
                </p>
                <div className="flex gap-2">
                  <button
                    type="button"
                    className="text-xs font-mono underline"
                    style={{ color: C.marigold }}
                    onClick={() => setSelectie(gevonden.map((_, i) => i))}
                  >
                    Alles
                  </button>
                  <button
                    type="button"
                    className="text-xs font-mono underline"
                    style={{ color: C.ember }}
                    onClick={() => setSelectie([])}
                  >
                    Niets
                  </button>
                </div>
              </div>

              <div className="mt-3 max-h-96 overflow-y-auto space-y-2 ft-scrollbar">
                {gevonden.map((i, index) => {
                  const gekozen = selectie.includes(index);
                  return (
                    <label
                      key={`${i.date}-${i.time}-${index}`}
                      className="flex items-start gap-3 rounded-xl p-3 cursor-pointer"
                      style={{
                        background: gekozen ? C.mint : C.bone,
                        border: `1px solid ${gekozen ? C.munt : C.line}`,
                      }}
                    >
                      <input
                        type="checkbox"
                        checked={gekozen}
                        onChange={() => wisselMoment(index)}
                        style={{ width: 20, height: 20, marginTop: 2, accentColor: C.koraal, flexShrink: 0 }}
                      />
                      <span className="min-w-0 flex-1">
                        <span className="block font-mono text-xs" style={{ color: C.marigold }}>
                          {fmtShort(i.date)} · {i.time}
                        </span>
                        <span className="block text-sm" style={{ color: C.ink }}>
                          {i.title}
                        </span>
                        {i.place && !alsCoordinaat(i.place) && (
                          <span className="block text-xs mt-0.5" style={{ color: C.muted }}>
                            {i.place}
                          </span>
                        )}
                      </span>
                    </label>
                  );
                })}
              </div>
            </div>
          )}

          <Btn
            className="mt-3 w-full"
            disabled={!geselecteerdeMomenten.length}
            onClick={async () => {
              if (!geselecteerdeMomenten.length) return;
              await onImport(geselecteerdeMomenten);
              const aantal = geselecteerdeMomenten.length;
              setGevonden(null);
              setSelectie([]);
              setHandmatigOpen(false);
              setMelding(`${aantal} ${aantal === 1 ? "moment" : "momenten"} toegevoegd aan de agenda.`);
            }}
          >
            {geselecteerdeMomenten.length
              ? `${geselecteerdeMomenten.length} ${geselecteerdeMomenten.length === 1 ? "moment" : "momenten"} aan agenda toevoegen`
              : "Selecteer minstens één moment"}
          </Btn>
        </div>
      )}
    </Card>
  );
}

const isOnderweg = (item) =>
  item.soort === "onderweg" || /^onderweg/i.test(item.title || "");

/* Engelse vervoerssoorten die al in de agenda staan alsnog vertalen. */
const ENGELS = {
  "in passenger vehicle": "met de auto",
  driving: "met de auto",
  walking: "lopend",
  "on foot": "lopend",
  cycling: "op de fiets",
  running: "hardlopend",
  "in bus": "met de bus",
  "in train": "met de trein",
  "in subway": "met de metro",
  "in tram": "met de tram",
  "in ferry": "met de veerboot",
  flying: "met het vliegtuig",
  motorcycling: "op de motor",
};
const nlOnderweg = (titel) => {
  const m = String(titel || "").match(/^onderweg\s*\(?([^)]*)\)?$/i);
  if (!m) return titel;
  const soort = m[1].trim().toLowerCase().replace(/_/g, " ");
  return `Onderweg ${ENGELS[soort] || soort || ""}`.trim();
};

const geledenTekst = (iso) => {
  const t = new Date(iso).getTime();
  if (!t || isNaN(t)) return "";
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "zojuist";
  if (m < 60) return `${m} min geleden`;
  const u = Math.round(m / 60);
  if (u < 24) return `${u} uur geleden`;
  const d = Math.round(u / 24);
  return `${d} ${d === 1 ? "dag" : "dagen"} geleden`;
};

/* ---------- een wandeling opnemen ---------- */
function Wandeling({ onKlaar }) {
  const [bezig, setBezig] = useState(false);
  const [punten, setPunten] = useState([]);
  const [begonnen, setBegonnen] = useState(null);
  const [nu, setNu] = useState(Date.now());
  const [fout, setFout] = useState("");
  const wacht = useRef(null);
  const slot = useRef(null);

  const meters = useMemo(() => {
    let t = 0;
    for (let i = 1; i < punten.length; i++) t += afstandMeter(punten[i - 1], punten[i]);
    return t;
  }, [punten]);
  const seconden = begonnen ? Math.round((nu - begonnen) / 1000) : 0;

  useEffect(() => {
    if (!bezig) return;
    const t = setInterval(() => setNu(Date.now()), 1000);
    return () => clearInterval(t);
  }, [bezig]);

  const start = async () => {
    if (!navigator.geolocation) {
      setFout("Dit apparaat geeft geen locatie door.");
      return;
    }
    setFout("");
    setPunten([]);
    setBegonnen(Date.now());
    setNu(Date.now());
    setBezig(true);
    try {
      if (navigator.wakeLock) slot.current = await navigator.wakeLock.request("screen");
    } catch (e) {
      /* schermslot is een extraatje */
    }
    wacht.current = navigator.geolocation.watchPosition(
      (pos) => {
        if (pos.coords.accuracy && pos.coords.accuracy > 60) return; // te onnauwkeurig
        setPunten((v) => [...v, { lat: pos.coords.latitude, lng: pos.coords.longitude }]);
      },
      (err) => {
        setFout(
          err && err.code === 1
            ? "Je browser mag je locatie niet gebruiken."
            : "Je locatie kon niet bepaald worden."
        );
      },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
    );
  };

  const stop = async () => {
    setBezig(false);
    if (wacht.current != null) navigator.geolocation.clearWatch(wacht.current);
    wacht.current = null;
    try {
      if (slot.current) await slot.current.release();
    } catch (e) {
      /* was al vrijgegeven */
    }
    slot.current = null;

    const netjes = dunUit(punten);
    if (netjes.length < 2) {
      setFout("Te weinig punten om een wandeling te bewaren.");
      setPunten([]);
      setBegonnen(null);
      return;
    }
    const d = new Date(begonnen);
    onKlaar({
      id: uid(),
      date: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(
        d.getDate()
      ).padStart(2, "0")}`,
      time: `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`,
      afstandM: Math.round(meters),
      duurS: seconden,
      pad: codeerPad(netjes),
      start: `${netjes[0].lat.toFixed(6)},${netjes[0].lng.toFixed(6)}`,
    });
    setPunten([]);
    setBegonnen(null);
  };

  return (
    <div
      className="rounded-2xl p-3 mt-2"
      style={{ background: "rgba(255,255,255,0.85)", border: `2px solid ${C.munt}` }}
    >
      <Eyebrow color={C.ink}>Wandeling opnemen</Eyebrow>
      {bezig ? (
        <>
          <div className="flex gap-4 mt-2 items-baseline">
            <span className="font-serif text-2xl" style={{ color: C.ink }}>
              {afstandTekst(meters)}
            </span>
            <span className="font-serif text-xl" style={{ color: C.muted }}>
              {duurTekst(seconden)}
            </span>
          </div>
          <p className="font-mono text-xs mt-1" style={{ color: C.muted }}>
            {punten.length} punten gemeten. Houd je scherm aan, anders stopt de meting.
          </p>
          <Btn className="mt-2 w-full" onClick={stop}>
            Wandeling afronden
          </Btn>
        </>
      ) : (
        <>
          <p className="text-sm mt-1" style={{ color: C.muted }}>
            Ga je alleen op pad? Dan tekent de app je route, afstand en tijd op.
          </p>
          <Btn tone="ghost" className="mt-2 w-full" onClick={start}>
            Wandeling starten
          </Btn>
        </>
      )}
      {fout && (
        <p className="text-sm mt-2" style={{ color: C.ember }}>
          {fout}
        </p>
      )}
    </div>
  );
}

/* Firebase instellen vanaf je telefoon, zonder bestanden te bewerken. */
function leesFirebaseTekst(tekst) {
  const t = String(tekst || "").trim();
  if (!t) return { fout: "Plak eerst de gegevens uit Firebase." };
  const velden = {};
  const paren = t.matchAll(/["']?(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId)["']?\s*:\s*["']([^"']+)["']/g);
  for (const m of paren) velden[m[1]] = m[2];
  if (!velden.projectId || !velden.apiKey) {
    return { fout: "Hierin staan geen projectId en apiKey. Kopieer het hele blok uit Firebase." };
  }
  return { firebase: velden };
}

function FirebaseKaart() {
  const [tekst, setTekst] = useState("");
  const [reisnaam, setReisnaam] = useState("");
  const [melding, setMelding] = useState("");
  const gedeeld = typeof window !== "undefined" && window.VAKANTIE_MODE === "gedeeld";
  const beschikbaar = typeof window !== "undefined" && "VAKANTIE_MODE" in window;
  const status = (typeof window !== "undefined" && window.FIREBASE_STATUS) || {};

  if (!beschikbaar) return null;

  const bewaar = () => {
    const r = leesFirebaseTekst(tekst);
    if (r.fout) {
      setMelding(r.fout);
      return;
    }
    const huidig = (() => {
      try {
        return JSON.parse(localStorage.getItem("reisboek-firebase") || "{}");
      } catch (e) {
        return {};
      }
    })();
    const naam =
      reisnaam.trim().toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-|-$/g, "") ||
      huidig.tripId ||
      (window.VAKANTIE_CONFIG && window.VAKANTIE_CONFIG.tripId) ||
      "onze-reis";
    localStorage.setItem(
      "reisboek-firebase",
      JSON.stringify({ ...huidig, firebase: r.firebase, tripId: naam })
    );
    setMelding("Bewaard. De app wordt opnieuw geladen\u2026");
    setTimeout(() => window.location.reload(), 900);
  };

  const uitzetten = () => {
    localStorage.removeItem("reisboek-firebase");
    setMelding("Uitgezet. De app wordt opnieuw geladen\u2026");
    setTimeout(() => window.location.reload(), 900);
  };

  return (
    <Card style={{ border: `3px solid ${gedeeld ? C.munt : C.ember}` }}>
      <div className="flex items-baseline justify-between">
        <Eyebrow color={gedeeld ? C.munt : C.ember}>
          Gedeelde opslag {gedeeld ? "staat aan" : "staat uit"}
        </Eyebrow>
        {gedeeld && (
          <button
            onClick={uitzetten}
            className="font-mono text-xs underline"
            style={{ color: C.muted }}
          >
            uitzetten
          </button>
        )}
      </div>

      {gedeeld ? (
        <p className="text-sm mt-2" style={{ color: C.ink }}>
          Alles staat op de server: iedereen ziet dezelfde foto's en lijstjes, en de ruimte op je
          telefoon raakt niet meer vol.
        </p>
      ) : (
        <>
          <p className="text-sm mt-2" style={{ color: C.ink }}>
            Nu bewaart je browser alles op dit apparaat, met ongeveer 5 MB als grens. Met een gratis
            Firebase-project krijg je 1 GB en zien je reisgenoten alles.
          </p>
          <div className="mt-3 rounded-2xl p-3 text-sm" style={{ background: "#FFF6EC", border: `2px solid ${C.koraal}`, color: C.ink }}>
            <strong>Firebase-status:</strong> {status.fase || "onbekend"}
            {status.projectId ? <span className="block">Project: {status.projectId}</span> : null}
            {status.tripId ? <span className="block">Reiscode: {status.tripId}</span> : null}
            {status.fout ? <span className="block mt-1" style={{ color: C.marigold }}>{status.fout}</span> : null}
          </div>
          <ol className="text-sm mt-2 space-y-1" style={{ color: C.muted }}>
            <li>1. Maak op console.firebase.google.com een project.</li>
            <li>2. Zet Firestore Database aan (productiemodus, locatie in Europa).</li>
            <li>3. Bij Regels: allow read, write: if true; en publiceren.</li>
            <li>4. Projectinstellingen, onderaan bij Jouw apps, kies het web-icoon.</li>
            <li>5. Kopieer het blok met apiKey en projectId en plak het hieronder.</li>
          </ol>
          <p
            className="text-sm mt-2 p-2 rounded-2xl"
            style={{ background: "#FFF6EC", color: C.ink, border: `2px solid ${C.koraal}` }}
          >
            Kom je bij <strong>Storage</strong> een knop "Upgrade project" tegen? Sla dat onderdeel
            over. Storage is alleen voor grote videobestanden en kost geld. Je foto's gaan in

          </p>
          <textarea

            style={{ background: "#FFFFFF", color: C.ink, border: `2px solid ${C.line}` }}

function RuimteMeter({ aantal }) {
  const [bytes, setBytes] = useState(0);
  const gedeeld = typeof window !== "undefined" && window.VAKANTIE_MODE === "gedeeld";

  useEffect(() => {
    setBytes(opslagGebruik());
  }, [aantal]);

  if (gedeeld || bytes === 0) return null;
  const grens = 5 * 1048576; // wat een browser doorgaans toestaat
  const deel = Math.min(100, Math.round((bytes / grens) * 100));
  const krap = deel >= 70;

  return (
    <Card style={{ border: `3px solid ${krap ? C.ember : C.line}` }}>
      <div className="flex items-baseline justify-between">
        <Eyebrow color={krap ? C.ember : C.muted}>Ruimte op dit apparaat</Eyebrow>
        <span className="font-mono text-xs" style={{ color: C.muted }}>
          {mbTekst(bytes)} van ongeveer 5 MB
        </span>
      </div>
      <div
        className="mt-2 rounded-full overflow-hidden"
        style={{ height: 10, background: C.boneSoft }}
      >
        <div
          style={{
            width: `${deel}%`,
            height: "100%",
            background: krap ? C.ember : C.munt,
          }}
        />
      </div>
      {krap && (
        <p className="text-sm mt-2" style={{ color: C.ink }}>
          Bijna vol. Zonder Firebase bewaart de browser alles op deze telefoon, en dat houdt op bij
          ongeveer 5 MB. Zet Firebase aan voor 1 GB gedeelde opslag, of verwijder een paar foto's.
        </p>
      )}
    </Card>
  );
}

/* ---------- nearby search ---------- */
async function findPlaces({ area, category, extra }) {
  throw new Error(
    "Zoeken zonder Google-key kan alleen in de Claude-app. Vul bij Reis een Google Maps API-key in."
  );
  const prompt = `Je bent een lokale gids in en rond ${area}. Zoek met web search actuele, bestaande plekken in de categorie "${category}".${
    extra ? ` Extra wens van de reiziger: ${extra}.` : ""
  }
Geef zes plekken die er nu echt zijn en die door bezoekers goed beoordeeld worden.
Antwoord UITSLUITEND met geldige JSON, zonder uitleg en zonder markdown:
[{"name":"","category":"","area":"","description":"","maps_query":""}]
Regels:
- description: Nederlands, maximaal 18 woorden, concreet (specialiteit, prijsniveau of waarom bijzonder).
- area: buurt, straat of plaats.
- maps_query: naam plus plaats, geschikt om in Google Maps te zoeken.`;

  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }],
      tools: [{ type: "web_search_20250305", name: "web_search" }],
    }),
  });
  if (!res.ok) throw new Error("Zoeken lukte niet. Probeer het opnieuw.");
  const data = await res.json();
  const text = (data.content || [])
    .map((b) => (b.type === "text" ? b.text : ""))
    .filter(Boolean)
    .join("\n");
  const clean = text.replace(/```json|```/g, "").trim();
  const start = clean.indexOf("[");
  const end = clean.lastIndexOf("]");
  if (start === -1 || end === -1) throw new Error("Geen plekken gevonden. Probeer een andere zoekopdracht.");
  const parsed = JSON.parse(clean.slice(start, end + 1));
  if (!Array.isArray(parsed) || !parsed.length) throw new Error("Geen plekken gevonden. Probeer een andere zoekopdracht.");
  return parsed.filter((p) => p && p.name);
}

function NearbyView({ trip, days, selected, setSelected, saved, setSaved, onAddToAgenda, me }) {
  const [category, setCategory] = useState("Bezienswaardigheden");
  const [extra, setExtra] = useState("");
  const [area, setArea] = useState(trip.base || trip.destination);
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [mapFor, setMapFor] = useState(null);
  const [added, setAdded] = useState({});
  const [source, setSource] = useState("");
  const apiKey = React.useContext(MapsKeyContext);

  const search = async (cat) => {
    const useCat = cat || category;
    setCategory(useCat);
    setLoading(true);
    setError("");
    setResults([]);
    setSource("");
    const where = area || trip.destination;
    if (apiKey) {
      try {
        const found = await searchPlacesApi({ key: apiKey, area: where, category: useCat, extra: extra.trim() });
        setResults(found);
        setSource("google");
        setLoading(false);
        return;
      } catch (e) {
        setError(`${e.message} Hieronder staan tips van de reisgids in plaats van Google.`);
      }
    }
    try {
      const found = await findPlaces({ area: where, category: useCat, extra: extra.trim() });
      setResults(found);
      setSource("gids");
    } catch (e) {
      setError(e.message || "Zoeken lukte niet.");
    }
    setLoading(false);
  };

  const save = (p) => {
    if (saved.some((s) => s.name === p.name)) return;
    setSaved([...saved, { ...p, id: uid(), by: me.name }]);
  };

  const toAgenda = (p) => {
    onAddToAgenda({
      id: uid(),
      date: selected,
      time: "",
      title: p.name,
      place: p.maps_query || p.area || "",
      by: me.name,
    });
    setAdded({ ...added, [p.name]: true });
  };

  const PlaceCard = ({ p, isSaved }) => (
    <Card className="mt-2">
      <Eyebrow color={C.marigold}>{p.category || category}</Eyebrow>
      <h3 className="font-serif text-xl mt-1">{p.name}</h3>

        <p className="font-mono text-xs mt-1" style={{ color: C.muted }}>
          {p.area}

      {p.description && <p className="text-sm mt-2 leading-relaxed">{p.description}</p>}
      {mapFor === p.name && <div className="mt-3">
        <MapFrame query={p.maps_query || `${p.name} ${p.area || trip.destination}`} height={180} />
      </div>}
      <div className="flex flex-wrap gap-2 mt-3">
        <Btn tone="ghost" onClick={() => setMapFor(mapFor === p.name ? null : p.name)}>
          {mapFor === p.name ? "Kaart sluiten" : "Kaart"}
        </Btn>
        <a
          href={mapsRoute(p.mapsSearch || p.maps_query || `${p.name} ${p.area || trip.destination}`)}
          target="_blank"
          rel="noopener noreferrer"
        >
          <Btn tone="ghost">Route</Btn>
        </a>
        <Btn onClick={() => toAgenda(p)}>
          {added[p.name] ? "Staat op agenda" : `Op dag ${days.indexOf(selected) + 1}`}
        </Btn>
        {isSaved ? (
          <Btn tone="danger" onClick={() => setSaved(saved.filter((s) => s.id !== p.id))}>
            Verwijderen
          </Btn>
        ) : (
          <Btn tone="ghost" onClick={() => save(p)} disabled={saved.some((s) => s.name === p.name)}>
            {saved.some((s) => s.name === p.name) ? "Bewaard" : "Bewaren"}
          </Btn>
        )}
      </div>
    </Card>
  );

  return (
    <div className="space-y-4">
      <DayStrip days={days} selected={selected} onSelect={setSelected} />

        <div className="mt-2 space-y-2">
          <Field label="Plaats of adres" value={area} onChange={(e) => setArea(e.target.value)} />
          <Field
            label="Extra wens (optioneel)"
            placeholder="Vegetarisch, kindvriendelijk, niet te duur"
            value={extra}
            onChange={(e) => setExtra(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && search()}
          />
        </div>
        <div className="flex gap-2 overflow-x-auto mt-3 -mx-4 px-4 pb-1">

            <button

        <p className="text-xs mt-3" style={{ color: C.muted }}>

          <p className="text-sm" style={{ color: C.ember }}>

        </div>
      )}

      {saved.length > 0 && (
        <div className="pt-2">
          <Eyebrow color={C.mint}>Bewaard door de groep ({saved.length})</Eyebrow>

          ))}
        </div>
      )}

      {!loading && !error && results.length === 0 && saved.length === 0 && (
        <Empty>Nog niets gezocht. Kies hierboven een categorie.</Empty>
      )}
    </div>
  );
}

/* Zoekt bij items met alleen coordinaten op welke plek daar zit. */
/* Onthouden wat het automatisch invullen al geprobeerd heeft. */
const AUTO_GEPROBEERD = new Set();
let AUTO_SLOT = false;

function NamenOphalen({ agenda, setAgenda, dagIso, auto }) {
  const key = React.useContext(MapsKeyContext);
  const [bezig, setBezig] = useState("");
  const [melding, setMelding] = useState("");

  const sleutel = (a) => (a.heleDag ? "00" : a.time || "99");
  const opTijd = agenda
    .filter((a) => a.date === dagIso)
    .sort((a, b) => sleutel(a).localeCompare(sleutel(b)));

  /* Bij een rit zonder punten: kijk naar het bezoek ervoor en erna. */
  const buren = (item) => {
    const i = opTijd.findIndex((x) => x.id === item.id);
    const heeftPlek = (x) => x && (alsCoordinaat(x.place) || (x.title && !/^bezoek$/i.test(x.title) && !isOnderweg(x)));
    const vorige = [...opTijd.slice(0, i)].reverse().find(heeftPlek);
    const volgende = opTijd.slice(i + 1).find(heeftPlek);
    return { vorige, volgende };
  };
  const naamVan = async (x) => {
    if (!x) return "";
    if (x.title && !/^bezoek$/i.test(x.title) && !isOnderweg(x)) return x.title;
    const punt = alsCoordinaat(x.place);
    if (!punt) return "";
    const r = await zoekNaam(key, punt);
    return (r && r.naam) || "";
  };
  const infoVan = async (x) => {
    if (!x) return null;
    const punt = alsCoordinaat(x.place);
    if (x.title && !/^bezoek$/i.test(x.title) && !isOnderweg(x)) return { naam: x.title, punt: punt || "" };
    if (!punt) return null;
    const r = await zoekNaam(key, punt);
    return r ? { ...r, punt } : null;
  };

  /* Wat is er nog echt te doen? Een oud vinkje telt niet. */
  const generiek = (a) => !a.title || /^bezoek$/i.test(String(a.title).trim());
  const teDoen = opTijd.filter((a) => {
    if (isOnderweg(a)) return !a.van || !a.naar;
    return generiek(a) && !!alsCoordinaat(a.place);
  });
  const start = async (werk = teDoen) => {
    setMelding("");
    let lijst = [...agenda];
    let gevonden = 0;
    for (let i = 0; i < werk.length; i++) {
      const item = werk[i];
      setBezig(`${i + 1} van ${werk.length}`);
      const punt = alsCoordinaat(item.place);
      const vanPunt = alsCoordinaat(item.vanPunt);
      const naarPunt = alsCoordinaat(item.naarPunt);
      const rit = isOnderweg(item);
      const hier = punt && !rit ? await zoekNaam(key, punt) : null;
      let van = item.van || "";
      let naar = item.naar || "";
      let naarInfo = item.naarInfo || null;
      if (rit) {
        if (!van && vanPunt) {
          const r = await zoekNaam(key, vanPunt);
          van = (r && r.naam) || "";
        }
        if (!naar && naarPunt) {
          const r = await zoekNaam(key, naarPunt);
          if (r) {
            naar = r.naam;
            naarInfo = { soort: r.soort, adres: r.adres, score: r.score, aantal: r.aantal, punt: naarPunt };
          }
        }
        if (!van || !naar) {
          const { vorige, volgende } = buren(item);
          if (!van) van = await naamVan(vorige);
          if (!naar) {
            const v = await infoVan(volgende);
            if (v) {
              naar = v.naam || "";
              naarInfo = { soort: v.soort || "", adres: v.adres || "", score: v.score || null, aantal: v.aantal || null, punt: v.punt || "" };
            }
          }
        }
      }
      const ietsGevonden = !!((hier && hier.naam) || (rit && (van || naar)));
      lijst = lijst.map((x) =>
        x.id === item.id
          ? {
              ...x,
              naamOpgehaald: ietsGevonden ? true : x.naamOpgehaald,
              soort: rit ? "onderweg" : x.soort,
              title: hier && hier.naam ? hier.naam : rit ? nlOnderweg(x.title) : x.title,
              place: hier && hier.adres ? hier.adres : x.place,
              van: van || x.van,
              naar: naar || x.naar,
              naarInfo: naarInfo || x.naarInfo,
            }
          : x
      );
      if (ietsGevonden) gevonden++;
    }
    setAgenda(lijst);
    setBezig("");
    setMelding(
      gevonden
        ? `${gevonden} regel${gevonden > 1 ? "s" : ""} ingevuld.`
        : "Google vond hier geen plaatsnamen. Vul ze in door op een regel te tikken."
    );
  };

  /* Vanzelf invullen zodra deze dag in beeld staat. */
  useEffect(() => {
    if (!auto || !key || AUTO_SLOT) return;
    const vers = teDoen.filter((a) => !AUTO_GEPROBEERD.has(a.id));
    if (!vers.length) return;
    AUTO_SLOT = true;
    vers.forEach((a) => AUTO_GEPROBEERD.add(a.id));
    start(vers).finally(() => {
      AUTO_SLOT = false;
    });
  }, [auto, key, dagIso, teDoen.length]);

  if (!key || (teDoen.length === 0 && !bezig && !melding)) return null;

  return (
    <div className="mt-2 mb-1">
      {bezig ? (
        <p className="font-mono text-xs" style={{ color: C.ember }}>
          Google Maps vult in: {bezig}
        </p>
      ) : teDoen.length > 0 ? (
        <Btn onClick={() => start()} className="w-full">
          Namen en routes invullen ({teDoen.length})
        </Btn>
      ) : null}
      {melding && !bezig && (
        <p className="text-xs mt-1" style={{ color: C.muted }}>
          {melding}
        </p>
      )}
    </div>
  );
}
