/* ---------- shopping per day ---------- */
function ShoppingView({ list, setList, days, selected, setSelected, me }) {
  const [text, setText] = useState("");
  const dayList_ = list.filter((i) => i.date === selected);
  const openCount = dayList_.filter((i) => !i.done).length;

  const add = () => {
    if (!text.trim()) return;
    setList([...list, { id: uid(), date: selected, text: text.trim(), done: false, by: me.name }]);
    setText("");
  };
  const toggle = (id) => setList(list.map((i) => (i.id === id ? { ...i, done: !i.done } : i)));

  const counts = useMemo(() => {
    const c = {};
    list.filter((i) => !i.done).forEach((i) => (c[i.date] = (c[i.date] || 0) + 1));
    return c;
  }, [list]);

  return (
    <div className="space-y-4">
      <DayStrip days={days} selected={selected} onSelect={setSelected} counts={counts} />
      <Card
        style={{
          background: dagKleur(days.indexOf(selected)).tint,
          border: `3px solid ${dagKleur(days.indexOf(selected)).rand}`,
          boxShadow: `0 10px 26px ${dagKleur(days.indexOf(selected)).schaduw}`,
        }}
      >
        <div className="flex items-baseline justify-between">
          <Eyebrow color={C.ink}>{fmtLong(selected)}</Eyebrow>
          <span className="font-mono text-xs" style={{ color: C.muted }}>
            {openCount} te halen
          </span>
        </div>
        {dayList_.length === 0 ? (
          <Empty>Nog geen boodschappen voor deze dag.</Empty>
        ) : (
          <ul className="divide-y mt-2" style={{ borderColor: C.line }}>
            {dayList_.map((i) => (
              <li key={i.id} className="flex items-center gap-3 py-3">
                <input type="checkbox" checked={i.done} onChange={() => toggle(i.id)} className="w-5 h-5 shrink-0" aria-label={i.text} />
                <span className="flex-1 text-base" style={{ textDecoration: i.done ? "line-through" : "none", color: i.done ? C.muted : C.ink }}>
                  {i.text}
                </span>
                <button
                  onClick={() => setList(list.filter((x) => x.id !== i.id))}
                  aria-label={`Verwijder ${i.text}`}
                  className="font-mono px-2 rounded focus:outline-none focus:ring-2"
                  style={{ color: C.ember }}
                >
                  x
                </button>
              </li>
            ))}
          </ul>
        )}
        <div className="mt-3 space-y-2">
          <Field label="Toevoegen" placeholder="Brood, tomaten, ijs" value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} />
          <div className="flex gap-2">
            <Btn onClick={add} disabled={!text.trim()}>
              Op de lijst
            </Btn>
            {dayList_.some((i) => i.done) && (
              <Btn tone="ghost" onClick={() => setList(list.filter((i) => !(i.date === selected && i.done)))}>
                Afgevinkte wissen
              </Btn>
            )}
          </div>
        </div>
      </Card>
    </div>
  );
}


/* ---------- gedeelde familiekalender voor toekomstige trips ---------- */
const KALENDER_KLEUREN = ["#E98D7E", "#F2A9A5", "#E0B978", "#8CC9A8", "#C9B7DE", "#8FBCDF"];
const isoVanDatum = (d) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const maandStartIso = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-01`;
const tripDatumTekst = (start, end) => {
  if (!start) return "Datum nog niet ingevuld";
  const opties = { day: "numeric", month: "short", year: "numeric" };
  const begin = asDate(start).toLocaleDateString("nl-NL", opties);
  if (!end || end === start) return begin;
  return `${begin} – ${asDate(end).toLocaleDateString("nl-NL", opties)}`;
};

function FamilieKalenderView({ trips, setTrips, members, me, currentTrip }) {
  const vandaag = localToday();
  const aankomend = useMemo(
    () => [...(trips || [])].filter((t) => (t.end || t.start || "") >= vandaag).sort((a, b) => (a.start || "").localeCompare(b.start || "")),
    [trips, vandaag]
  );
  const eersteMaand = aankomend[0]?.start ? maandStartIso(asDate(aankomend[0].start)) : maandStartIso();
  const [maand, setMaand] = useState(eersteMaand);
  const [formulierOpen, setFormulierOpen] = useState(false);
  const [fout, setFout] = useState("");
  const leegFormulier = () => ({
    id: "",
    title: "",
    destination: "",
    start: vandaag,
    end: vandaag,
    participants: me?.email ? [me.email] : [],
    extraPeople: "",
    note: "",
    color: 0,
  });
  const [form, setForm] = useState(leegFormulier);

  const maandDatum = asDate(maand);
  const jaar = maandDatum.getFullYear();
  const maandNr = maandDatum.getMonth();
  const maandTitel = maandDatum.toLocaleDateString("nl-NL", { month: "long", year: "numeric" });
  const eersteDag = new Date(jaar, maandNr, 1, 12, 0, 0);
  const maandagOffset = (eersteDag.getDay() + 6) % 7;
  const rasterStart = new Date(jaar, maandNr, 1 - maandagOffset, 12, 0, 0);
  const kalenderDagen = Array.from({ length: 42 }, (_, i) => {
    const d = new Date(rasterStart);
    d.setDate(rasterStart.getDate() + i);
    return { iso: isoVanDatum(d), dag: d.getDate(), inMaand: d.getMonth() === maandNr };
  });

  const verschuifMaand = (stap) => {
    const d = new Date(jaar, maandNr + stap, 1, 12, 0, 0);
    setMaand(maandStartIso(d));
  };

  const nieuw = () => {
    setForm(leegFormulier());
    setFout("");
    setFormulierOpen(true);
  };

  const neemHuidigeReisOver = () => {
    if (!currentTrip) return;
    setForm((v) => ({
      ...v,
      title: currentTrip.name || currentTrip.destination || "Familietrip",
      destination: currentTrip.destination || currentTrip.base || "",
      start: currentTrip.start || vandaag,
      end: currentTrip.end || currentTrip.start || vandaag,
      note: currentTrip.summary || "",
    }));
  };

  const bewerk = (trip) => {
    setForm({
      id: trip.id,
      title: trip.title || "",
      destination: trip.destination || "",
      start: trip.start || vandaag,
      end: trip.end || trip.start || vandaag,
      participants: Array.isArray(trip.participants) ? trip.participants : [],
      extraPeople: trip.extraPeople || "",
      note: trip.note || "",
      color: Number.isInteger(trip.color) ? trip.color : 0,
    });
    setMaand(maandStartIso(asDate(trip.start || vandaag)));
    setFout("");
    setFormulierOpen(true);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const wisselPersoon = (email) => {
    setForm((v) => ({
      ...v,
      participants: v.participants.includes(email)
        ? v.participants.filter((x) => x !== email)
        : [...v.participants, email],
    }));
  };

  const bewaar = () => {
    const bestemming = form.destination.trim();
    const titel = form.title.trim() || bestemming;
    if (!bestemming) return setFout("Vul een bestemming in.");
    if (!form.start || !form.end) return setFout("Vul een vertrek- en terugdatum in.");
    if (form.end < form.start) return setFout("De terugdatum ligt voor de vertrekdatum.");
    if (!form.participants.length && !form.extraPeople.trim()) return setFout("Kies minimaal één deelnemer.");
    const item = {
      ...form,
      id: form.id || uid(),
      title: titel,
      destination: bestemming,
      extraPeople: form.extraPeople.trim(),
      color: Number(form.color) || 0,
      by: me?.name || me?.email || "Familielid",
      updatedAt: new Date().toISOString(),
      createdAt: form.id ? (trips.find((t) => t.id === form.id)?.createdAt || new Date().toISOString()) : new Date().toISOString(),
    };
    const volgende = form.id ? trips.map((t) => (t.id === form.id ? item : t)) : [...trips, item];
    setTrips(volgende);
    setMaand(maandStartIso(asDate(item.start)));
    setFormulierOpen(false);
    setFout("");
  };

  const verwijder = (trip) => {
    const naam = trip.title || trip.destination || "deze trip";
    if (!window.confirm(`Weet je zeker dat je ${naam} uit de familiekalender wilt verwijderen?`)) return;
    setTrips(trips.filter((t) => t.id !== trip.id));
  };

  const persoonBijEmail = (email) => members.find((m) => m.email === email) || { email, name: email };
  const namenVoor = (trip) => {
    const namen = (trip.participants || []).map((email) => persoonBijEmail(email).name || email);
    const extra = String(trip.extraPeople || "").split(",").map((x) => x.trim()).filter(Boolean);
    return [...namen, ...extra];
  };

  return (
    <div className="space-y-4">
      <Card style={{ background: `linear-gradient(145deg, ${C.bone}, ${C.perzik}66)` }}>
        <div className="flex items-start justify-between gap-3">
          <div>
            <Eyebrow color={C.marigold}>Samen vooruitkijken</Eyebrow>
            <h2 className="font-serif mt-1" style={{ color: C.ink, fontSize: 27, lineHeight: 1.1 }}>
              Familiekalender
            </h2>
            <p className="text-sm mt-2" style={{ color: C.muted, lineHeight: 1.5 }}>
              Alle toekomstige vakanties, weekendjes weg en familie-uitjes op één gedeelde plek.
            </p>
          </div>
          <Tegel naam="kalender" kleur={C.koraal} maat={48} />
        </div>
        <Btn className="w-full mt-3" onClick={nieuw}>+ Nieuwe trip toevoegen</Btn>
      </Card>

      {formulierOpen && (
        <Card style={{ borderColor: C.koraal }}>
          <div className="flex items-center justify-between gap-3 mb-3">
            <div>
              <Eyebrow color={C.ember}>{form.id ? "Trip aanpassen" : "Nieuwe gezamenlijke trip"}</Eyebrow>
              <h3 className="font-serif text-xl mt-1">Tripgegevens</h3>
            </div>
            <button type="button" onClick={() => setFormulierOpen(false)} aria-label="Sluiten" className="rounded-full" style={{ width: 38, height: 38, background: C.bg, color: C.ink, fontSize: 22 }}>×</button>
          </div>
          <div className="space-y-3">
            <Field label="Naam van de trip" placeholder="Zomerweek in Italië" value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} />
            <Field label="Bestemming" placeholder="Comacchio, Italië" value={form.destination} onChange={(e) => setForm({ ...form, destination: e.target.value })} />
            <div className="grid grid-cols-2 gap-2">
              <Field label="Vertrek" type="date" value={form.start} onChange={(e) => setForm({ ...form, start: e.target.value, end: form.end < e.target.value ? e.target.value : form.end })} />
              <Field label="Terug" type="date" value={form.end} min={form.start} onChange={(e) => setForm({ ...form, end: e.target.value })} />
            </div>

            <div>
              <Eyebrow>Wie gaan er mee?</Eyebrow>
              <div className="grid grid-cols-2 gap-2 mt-2">
                {members.map((member) => {
                  const gekozen = form.participants.includes(member.email);
                  return (
                    <button key={member.email} type="button" onClick={() => wisselPersoon(member.email)} className="flex items-center gap-2 rounded-2xl p-2 text-left" style={{ background: gekozen ? C.mint : "#FFFFFF", border: `2px solid ${gekozen ? C.munt : C.line}`, minHeight: 50 }}>
                      <Avatar member={member} size={30} />
                      <span className="text-sm" style={{ color: C.ink, fontWeight: 800, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis" }}>{member.name || member.email}</span>
                    </button>
                  );
                })}
              </div>
              <Field label="Andere deelnemers" placeholder="Opa, oma, vrienden (gescheiden door komma's)" value={form.extraPeople} onChange={(e) => setForm({ ...form, extraPeople: e.target.value })} />
            </div>

            <div>
              <Eyebrow>Warme kleur</Eyebrow>
              <div className="flex gap-2 mt-2">
                {KALENDER_KLEUREN.map((kleur, i) => (
                  <button key={kleur} type="button" onClick={() => setForm({ ...form, color: i })} aria-label={`Kleur ${i + 1}`} className="rounded-full" style={{ width: 36, height: 36, background: kleur, border: form.color === i ? `4px solid ${C.ink}` : "4px solid #FFFFFF", boxShadow: "0 2px 7px rgba(34,64,107,.15)" }} />
                ))}
              </div>
            </div>

            <label className="block">
              <Eyebrow>Extra details</Eyebrow>
              <textarea value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} placeholder="Verblijf, plannen of iets om niet te vergeten" className="w-full mt-1 px-4 py-3 rounded-2xl text-base focus:outline-none focus:ring-2" style={{ minHeight: 92, background: "#FFFFFF", color: C.ink, border: `2px solid ${C.line}` }} />
            </label>

            {currentTrip && !form.id && (
              <Btn tone="ghost" className="w-full" onClick={neemHuidigeReisOver}>Huidige reisgegevens overnemen</Btn>
            )}
            {fout && <p className="text-sm" style={{ color: C.marigold, fontWeight: 800 }}>{fout}</p>}
            <div className="grid grid-cols-2 gap-2">
              <Btn tone="ghost" onClick={() => setFormulierOpen(false)}>Annuleren</Btn>
              <Btn onClick={bewaar}>Delen met familie</Btn>
            </div>
          </div>
        </Card>
      )}

      <Card>
        <div className="flex items-center justify-between gap-2 mb-3">
          <button type="button" onClick={() => verschuifMaand(-1)} aria-label="Vorige maand" className="rounded-full flex items-center justify-center" style={{ width: 40, height: 40, background: C.bg, color: C.ink, fontSize: 24 }}>‹</button>
          <div className="text-center">
            <Eyebrow>Maandoverzicht</Eyebrow>
            <h3 className="font-serif text-xl capitalize">{maandTitel}</h3>
          </div>
          <button type="button" onClick={() => verschuifMaand(1)} aria-label="Volgende maand" className="rounded-full flex items-center justify-center" style={{ width: 40, height: 40, background: C.bg, color: C.ink, fontSize: 24 }}>›</button>
        </div>

        <div className="grid" style={{ gridTemplateColumns: "repeat(7,minmax(0,1fr))", gap: 4 }}>
          {["ma", "di", "wo", "do", "vr", "za", "zo"].map((dag) => (
            <div key={dag} className="text-center font-mono uppercase" style={{ color: C.muted, fontSize: 10, padding: "4px 0" }}>{dag}</div>
          ))}
          {kalenderDagen.map((dag) => {
            const dagTrips = (trips || []).filter((t) => t.start && t.end && dag.iso >= t.start && dag.iso <= t.end);
            const isVandaag = dag.iso === vandaag;
            return (
              <div key={dag.iso} title={dagTrips.map((t) => t.title || t.destination).join(", ")} style={{ minHeight: 54, padding: "5px 3px", borderRadius: 12, background: dagTrips.length ? `${KALENDER_KLEUREN[dagTrips[0].color || 0]}22` : dag.inMaand ? "#FFFFFF" : `${C.bg}66`, border: isVandaag ? `2px solid ${C.koraal}` : `1px solid ${C.line}`, opacity: dag.inMaand ? 1 : 0.5, overflow: "hidden" }}>
                <span className="block text-center" style={{ color: isVandaag ? C.marigold : C.ink, fontSize: 11, fontWeight: isVandaag ? 900 : 700 }}>{dag.dag}</span>
                <div className="space-y-1 mt-1">
                  {dagTrips.slice(0, 2).map((t) => (
                    <span key={t.id} className="block rounded-full" style={{ height: 5, background: KALENDER_KLEUREN[t.color || 0] }} />
                  ))}
                  {dagTrips.length > 2 && <span className="block text-center" style={{ color: C.muted, fontSize: 8, lineHeight: 1 }}>+{dagTrips.length - 2}</span>}
                </div>
              </div>
            );
          })}
        </div>
        <button type="button" onClick={() => setMaand(maandStartIso())} className="w-full mt-3 rounded-2xl" style={{ height: 40, background: "#FFFFFF", color: C.ink, border: `2px solid ${C.line}`, fontWeight: 800 }}>Naar deze maand</button>
      </Card>

      <div>
        <div className="flex items-end justify-between mb-2 px-1">
          <div>
            <Eyebrow color={C.marigold}>Wat komt eraan?</Eyebrow>
            <h3 className="font-serif text-xl mt-1">Aankomende uitjes</h3>
          </div>
          <span className="font-mono text-xs" style={{ color: C.muted }}>{aankomend.length} gepland</span>
        </div>

        {aankomend.length === 0 ? (
          <Card>
            <Empty>Nog geen toekomstige trips toegevoegd. Plan samen iets leuks!</Empty>
            <Btn className="w-full" onClick={nieuw}>Eerste trip toevoegen</Btn>
          </Card>
        ) : (
          <div className="space-y-3">
            {aankomend.map((trip) => {
              const kleur = KALENDER_KLEUREN[trip.color || 0];
              const namen = namenVoor(trip);
              return (
                <Card key={trip.id} style={{ borderLeft: `8px solid ${kleur}`, background: `linear-gradient(135deg, ${C.bone}, ${kleur}18)` }}>
                  <div className="flex items-start justify-between gap-3">
                    <div style={{ minWidth: 0 }}>
                      <Eyebrow color={kleur}>{tripDatumTekst(trip.start, trip.end)}</Eyebrow>
                      <h4 className="font-serif text-xl mt-1" style={{ overflowWrap: "anywhere" }}>{trip.title || trip.destination}</h4>
                      <p className="text-sm mt-1" style={{ color: C.ink, fontWeight: 800 }}>📍 {trip.destination}</p>
                    </div>
                    <span className="rounded-full shrink-0" style={{ width: 18, height: 18, background: kleur, boxShadow: `0 3px 9px ${kleur}88` }} />
                  </div>

                  <div className="mt-3 rounded-2xl p-3" style={{ background: "rgba(255,255,255,.72)", border: `1px solid ${C.line}` }}>
                    <Eyebrow>Wie gaan er mee?</Eyebrow>
                    <div className="flex flex-wrap items-center gap-2 mt-2">
                      {(trip.participants || []).map((email) => {
                        const member = persoonBijEmail(email);
                        return <span key={email} className="inline-flex items-center gap-1 rounded-full" style={{ background: C.bone, padding: "4px 8px 4px 4px", border: `1px solid ${C.line}` }}><Avatar member={member} size={25} /><span style={{ color: C.ink, fontSize: 11, fontWeight: 800 }}>{member.name || email}</span></span>;
                      })}
                      {String(trip.extraPeople || "").split(",").map((naam) => naam.trim()).filter(Boolean).map((naam, i) => <span key={`${naam}-${i}`} className="rounded-full" style={{ background: C.bg, color: C.ink, padding: "6px 9px", fontSize: 11, fontWeight: 800 }}>{naam}</span>)}
                    </div>
                    {!namen.length && <p className="text-sm mt-2" style={{ color: C.muted }}>Deelnemers nog niet gekozen.</p>}
                  </div>

                  {trip.note && <p className="text-sm mt-3 whitespace-pre-wrap" style={{ color: C.muted, lineHeight: 1.55 }}>{trip.note}</p>}
                  <div className="grid grid-cols-2 gap-2 mt-3">
                    <Btn tone="ghost" onClick={() => bewerk(trip)}>Aanpassen</Btn>
                    <Btn tone="danger" onClick={() => verwijder(trip)}>Verwijderen</Btn>
                  </div>
                </Card>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- app ---------- */
function VakantieApp() {
  const [phase, setPhase] = useState("loading"); // loading | login | setup | app
  const [me, setMe] = useState(null);
  const [trip, setTrip] = useState(null);
  const [members, setMembers] = useState([]);
  const [agenda, setAgenda] = useState([]);
  const [photoIndex, setPhotoIndex] = useState([]);
  const [images, setImages] = useState({});
  const [notes, setNotes] = useState([]);
  const [todos, setTodos] = useState([]);
  const [shopping, setShopping] = useState([]);
  const [places, setPlaces] = useState([]);
  const [familyTrips, setFamilyTrips] = useState([]);
  const [apiKey, setApiKeyState] = useState("");
  const [tab, setTab] = useState("dagen");
  const gaNaarTab = (volgendeTab) => {
    setTab(volgendeTab);
    window.requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: "smooth" }));
  };
  const [menuOpen, setMenuOpen] = useState(false);
  const [editingProfile, setEditingProfile] = useState(false);
  const [avatars, setAvatars] = useState({});
  const [selected, setSelected] = useState(localToday());
  const [editingTrip, setEditingTrip] = useState(false);
  const [locaties, setLocaties] = useState({});
  const [deelLocatie, setDeelLocatie] = useState(false);
  const [locatieFout, setLocatieFout] = useState("");
  const [syncing, setSyncing] = useState(false);
  const [notice, setNotice] = useState("");
  const [weer, setWeer] = useState({});
  const [weerFout, setWeerFout] = useState("");
  const [themeId, setThemeId] = useState(() => {
    try { return localStorage.getItem("familytrip-theme") || "warm"; } catch (e) { return "warm"; }
  });
  zetThema(themeId);
  useEffect(() => {
    if (!me?.email) return;
    try {
      const persoonlijk = localStorage.getItem(`familytrip-theme:${me.email}`);
      if (persoonlijk && THEMA_TYPES[persoonlijk] && persoonlijk !== themeId) setThemeId(persoonlijk);
    } catch (e) {}
  }, [me?.email]);

  useEffect(() => {
    try {
      localStorage.setItem("familytrip-theme", themeId);
      if (me?.email) localStorage.setItem(`familytrip-theme:${me.email}`, themeId);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', C.bg);
      document.body.style.background = C.bg;
    } catch (e) {}
  }, [themeId, me?.email]);

  const days = useMemo(() => (trip ? dayList(trip.start, trip.end) : []), [trip]);

  /* Het weerbericht voor de bestemming, eenmaal per bezoek opgehaald. */
  useEffect(() => {
    if (!trip || !days.length) return;
    let gestopt = false;
    (async () => {
      const punt = await geocodeerTekst(apiKey, trip.base || trip.destination);
      if (gestopt) return;
      if (!punt) {
        setWeerFout(
          apiKey
            ? "Kon de bestemming niet vinden voor het weerbericht."
            : "Vul een Google Maps-key in om het weerbericht te zien."
        );
        return;
      }
      const r = await haalWeerbericht(punt, days[0], days[days.length - 1]);
      if (gestopt) return;
      setWeer(r.perDag);
      setWeerFout(r.fout);
    })();
    return () => {
      gestopt = true;
    };
  }, [trip?.base, trip?.destination, apiKey, days.length]);

  const pullAll = async () => {
    setSyncing(true);
    let core = await loadKey("trip-core", null);
    /* Extra vaste herstelkopie, los van de versie van index.html. */
    if (!core) {
      try {
        const herstel = JSON.parse(localStorage.getItem("reisboek-laatste-reis") || "null");
        if (herstel && herstel.trip) {
          core = herstel;
          await saveKey("trip-core", herstel);
        }
      } catch (e) {}
    }
    const [a, n, t, s, pi, pl, mk, ft] = await Promise.all([
      loadKey("agenda", []),
      loadKey("notes", []),
      loadKey("todos", []),
      loadKey("shopping", []),
      loadKey("photos-index", []),
      loadKey("places", []),
      loadKey("maps-key", ""),
      loadKey("family-calendar", []),
    ]);
    if (core && core.trip) {
      setTrip(core.trip);
      setMembers(core.members || []);
      try { localStorage.setItem("reisboek-laatste-reis", JSON.stringify(core)); } catch (e) {}
    }
    setAgenda(a);
    setNotes(n);
    setTodos(t);
    setShopping(s);
    setPhotoIndex(pi);
    setPlaces(pl);
    setFamilyTrips(Array.isArray(ft) ? ft : []);
    setApiKeyState(typeof mk === "string" ? mk : "");
    await haalLocaties();
    setSyncing(false);
    return core;
  };

  /* Zelf locatie doorgeven, zolang de app openstaat. */
  const laatsteZet = useRef(0);
  useEffect(() => {
    if (!deelLocatie || !me || !navigator.geolocation) return;
    setLocatieFout("");
    let stop = false;
    const wacht = navigator.geolocation.watchPosition(
      async (pos) => {
        if (stop) return;
        const nu = Date.now();
        if (nu - laatsteZet.current < 60000) return; // hooguit eens per minuut
        laatsteZet.current = nu;
        const gegeven = {
          punt: `${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`,
          nauwkeurig: Math.round(pos.coords.accuracy || 0),
          naam: me.name,
          at: new Date().toISOString(),
        };
        await saveKey(`locatie:${me.email}`, gegeven);
        setLocaties((v) => ({ ...v, [me.email]: gegeven }));
      },
      (err) => {
        if (stop) return;
        setLocatieFout(
          err && err.code === 1
            ? "Je browser mag je locatie niet gebruiken. Zet dat aan bij de site-instellingen."
            : "Je locatie kon niet bepaald worden."
        );
      },
      { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 }
    );
    return () => {
      stop = true;
      navigator.geolocation.clearWatch(wacht);
    };
  }, [deelLocatie, me]);

  /* De eigen keuze onthouden, per apparaat. */
  useEffect(() => {
    (async () => {
      const aan = await loadKey("locatie-delen", false, false);
      if (aan === true) setDeelLocatie(true);
    })();
  }, []);

  const wisselLocatieDelen = async (aan) => {
    setDeelLocatie(aan);
    await saveKey("locatie-delen", aan, false);
    if (!aan && me) {
      await AppStore.delete(`locatie:${me.email}`, true).catch(() => {});
      setLocaties((v) => {
        const kopie = { ...v };
        delete kopie[me.email];
        return kopie;
      });
    }
  };

  /* Waar is iedereen? Elke persoon heeft een eigen sleutel. */
  const haalLocaties = async () => {
    try {
      const r = await AppStore.list("locatie:", true);
      const uit = {};
      for (const sleutel of r?.keys || []) {
        const w = await loadKey(sleutel, null);
        if (w && w.punt) uit[sleutel.slice("locatie:".length)] = w;
      }
      setLocaties(uit);
    } catch (e) {
      /* nog niemand deelt iets */
    }
  };

  /* first load */
  useEffect(() => {
    (async () => {
      const stored = await loadKey("me", null, false);
      const core = await pullAll();
      if (!stored) {
        setPhase("login");
        return;
      }
      setMe(stored);
      if (core && core.trip) {
        setTab("dagen");
        setPhase("app");
      } else {
        /* Alleen bij een werkelijk nieuwe reis komt Reis plannen in beeld. */
        setPhase("setup");
      }
    })();
  }, []);

  /* keep the selected day inside the trip */
  useEffect(() => {
    if (days.length && !days.includes(selected)) {
      const today = localToday();
      setSelected(days.includes(today) ? today : days[0]);
    }
  }, [days]);

  const login = async (person, blijfIngelogd, googleFoto) => {
    setMe(person);
    if (blijfIngelogd) await saveKey("me", person, false);
    const core = await pullAll();
    const existing = core?.members || [];
    const bestaand = existing.find((m) => m.email === person.email);
    const samen = bestaand ? { ...bestaand, ...person } : person;
    const nextMembers = bestaand
      ? existing.map((m) => (m.email === person.email ? samen : m))
      : [...existing, samen];
    setMembers(nextMembers);
    if (core) {
      await saveKey("trip-core", { ...core, members: nextMembers });
      setTrip(core.trip);
    }
    if (googleFoto && !avatars[person.email]) {
      setAvatars((prev) => ({ ...prev, [person.email]: googleFoto }));
      await saveKey(`avatar:${person.email}`, googleFoto);
    }
    setMe(samen);
    if (!bestaand?.profileDone) {
      setPhase("profiel");
    } else {
      if (core && core.trip) setTab("dagen");
      setPhase(core && core.trip ? "app" : "setup");
    }
  };

  const saveProfile = async (person, foto) => {
    const compleet = { ...person, profileDone: true };
    setMe(compleet);
    const stored = await loadKey("me", null, false);
    if (stored) await saveKey("me", compleet, false);
    if (foto) {
      await saveKey(`avatar:${compleet.email}`, foto);
      setAvatars((prev) => ({ ...prev, [compleet.email]: foto }));
    }
    const core = await loadKey("trip-core", null);
    const lijst = core?.members || members;
    const nextMembers = lijst.some((m) => m.email === compleet.email)
      ? lijst.map((m) => (m.email === compleet.email ? compleet : m))
      : [...lijst, compleet];
    setMembers(nextMembers);
    if (core) await saveKey("trip-core", { ...core, members: nextMembers });
    setEditingProfile(false);
    setPhase(core ? "app" : "setup");
  };

  const logout = async () => {
    try {
      if (window.AppAuth && window.AppAuth.beschikbaar) await window.AppAuth.uitloggen();
    } catch (e) {
      /* was al afgemeld */
    }
    try {
      await AppStore.delete("me", false);
    } catch (e) {
      /* stond er al niet */
    }
    setMe(null);
    setMenuOpen(false);
    setPhase("login");
  };

  /* Met het menu open sluit de terugknop het menu, niet de app. */
  useEffect(() => {
    if (!menuOpen) return;
    let viaTerugknop = false;
    window.history.pushState({ reisboekMenu: true }, "");
    const terug = () => {
      viaTerugknop = true;
      setMenuOpen(false);
    };
    window.addEventListener("popstate", terug);
    return () => {
      window.removeEventListener("popstate", terug);
      if (!viaTerugknop) window.history.back();
    };
  }, [menuOpen]);

  const laadAvatars = async (lijst) => {
    for (const m of lijst) {
      if (avatars[m.email]) continue;
      const foto = await loadKey(`avatar:${m.email}`, null);
      if (foto) setAvatars((prev) => ({ ...prev, [m.email]: foto }));
    }
  };

  useEffect(() => {
    if (members.length) laadAvatars(members);
  }, [members.length]);

  const saveTrip = async (t) => {
    const nextMembers = members.some((m) => m.email === me.email) ? members : [...members, me];
    const kern = { trip: t, members: nextMembers };
    setTrip(t);
    setMembers(nextMembers);
    try { localStorage.setItem("reisboek-laatste-reis", JSON.stringify(kern)); } catch (e) {}
    const ok = await saveKey("trip-core", kern);
    setNotice(ok ? "" : "Opslaan lukte niet. Probeer het opnieuw.");
    setEditingTrip(false);
    setPhase("app");
  };

  /* write-through setters */
  const persist = (key, setter) => async (value) => {
    setter(value);
    const ok = await saveKey(key, value);
    if (!ok) setNotice("Opslaan lukte niet. Tik op Vernieuwen en probeer het opnieuw.");
  };

  const setApiKey = async (k) => {
    setApiKeyState(k);
    const ok = await saveKey("maps-key", k);
    setNotice(ok ? "" : "De key kon niet opgeslagen worden. Probeer het opnieuw.");
  };

  const addAgendaItem = (item) => persist("agenda", setAgenda)([...agenda, item]);

  const loadImages = async () => {
    const missing = photoIndex.filter((p) => !images[p.id]).slice(0, 24);
    for (const p of missing) {
      try {
        const beeld = await loadKey(`photo:${p.id}`, null);
        if (beeld) setImages((prev) => ({ ...prev, [p.id]: beeld }));
      } catch (e) {
        /* foto niet meer aanwezig */
      }
    }
  };

  if (phase === "loading") {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: C.bg }}>
        <Eyebrow color={C.marigold}>Reisboek wordt geopend...</Eyebrow>
      </div>
    );
  }

  if (phase === "login") return <LoginView onLogin={login} />;

  if (phase === "profiel" || editingProfile) {
    return (
      <AvatarsContext.Provider value={avatars}>
        <div className="min-h-screen" style={{ background: C.bg }}>
          <Letters />
          <ProfileView
            me={me}
            photo={avatars[me.email]}
            onSave={saveProfile}
            onSkip={
              editingProfile
                ? () => setEditingProfile(false)
                : () => setPhase(trip ? "app" : "setup")
            }
            onWandelingen={
              trip
                ? () => {
                    setEditingProfile(false);
                    setPhase("app");
                    setTab("wandeling");
                  }
                : null
            }
            themeId={themeId}
            setThemeId={setThemeId}
          />
        </div>
      </AvatarsContext.Provider>
    );
  }

  if (phase === "setup" || editingTrip) {
    return (
      <MapsKeyContext.Provider value={apiKey}>
        <div className="min-h-screen" style={{ background: C.bg }}>
          <Letters />
          <SetupView
            me={me}
            initial={trip || null}
            onSave={saveTrip}
            onCancel={editingTrip ? () => setEditingTrip(false) : null}
            apiKey={apiKey}
            setApiKey={setApiKey}
            onImportTimeline={(items) =>
              persist("agenda", setAgenda)([
                ...agenda,
                ...items.map((i) => ({ ...i, id: uid(), by: `${me.name} | tijdlijn` })),
              ])
            }
          />
        </div>
      </MapsKeyContext.Provider>
    );
  }

  const stats = {
    agenda: agenda.length,
    photos: photoIndex.length,
    notes: notes.length,
    todosOpen: todos.filter((t) => !t.done).length,
    shopOpen: shopping.filter((s) => !s.done).length,
    plekken: places.length,
  };

  return (
    <MapsKeyContext.Provider value={apiKey}>
    <AvatarsContext.Provider value={avatars}>
    <div className="min-h-screen" style={{ background: C.bg }}>
      <Letters />
      <header
        className="sticky top-0 z-40"
        style={{ background: C.head, borderBottom: `1px solid ${C.line}` }}
      >
        <div className="max-w-lg mx-auto px-4 flex items-center justify-between" style={{ height: 78, maxWidth: 430 }}>
          <div className="relative">
            <button type="button" onClick={() => setMenuOpen(!menuOpen)} aria-label="Menu" className="rounded-full flex items-center justify-center focus:outline-none focus:ring-2" style={{ width: 42, height: 42 }}>
              <Icoon naam="menu" kleur={C.marigold} maat={25} dikte={2.2} />
            </button>
            {menuOpen && (
              <div className="absolute left-0 top-full mt-3 rounded-[24px] overflow-hidden z-50" style={{ background: C.bone, width: 320, maxWidth: "calc(100vw - 32px)", border: `2px solid ${C.line}`, boxShadow: "0 14px 30px rgba(34,64,107,.18)" }}>
                <div className="flex justify-center px-4 py-4" style={{ background: C.head }}><Logo size={130} /></div>
                {TABS.map((t) => (
                  <button key={t.id} type="button" onClick={() => { setTab(t.id); setMenuOpen(false); }} className="flex items-center gap-3 w-full text-left px-4 py-3 focus:outline-none focus:ring-2" style={{ background: tab === t.id ? t.kleur + "18" : "transparent", borderBottom: `1px solid ${C.line}` }}>
                    <Tegel naam={t.id} kleur={t.kleur} maat={34} />
                    <span style={{ color: C.ink, fontWeight: 700 }}>{t.label}</span>
                    <span className="ml-auto" style={{ color: C.muted }}>›</span>
                  </button>
                ))}
                <button type="button" onClick={() => { setMenuOpen(false); setEditingProfile(true); }} className="flex items-center gap-3 w-full text-left px-4 py-3" style={{ borderBottom: `1px solid ${C.line}` }}>
                  <Tegel naam="profiel" kleur={C.ink} maat={34} /><span style={{ color: C.ink, fontWeight: 700 }}>Mijn profiel</span><span className="ml-auto" style={{ color: C.muted }}>›</span>
                </button>
                <button type="button" onClick={logout} className="flex items-center gap-3 w-full text-left px-4 py-3">
                  <Tegel naam="uit" kleur={C.koraal} maat={34} /><span style={{ color: C.marigold, fontWeight: 700 }}>Uitloggen</span>
                </button>
              </div>
            )}
          </div>
          <Logo size={132} />
          <button type="button" onClick={pullAll} disabled={syncing} aria-label="Vernieuwen" className="rounded-full flex items-center justify-center focus:outline-none focus:ring-2 disabled:opacity-50" style={{ width: 42, height: 42 }}>
            <Icoon naam="vernieuw" kleur={C.marigold} maat={25} dikte={2.2} />
          </button>
        </div>
      </header>

      <main
        className="max-w-lg mx-auto"
        style={{ maxWidth: 430, padding: "12px 14px calc(105px + env(safe-area-inset-bottom, 0px))" }}
      >
        {notice && (
          <p className="text-sm mb-3" style={{ color: C.marigold }}>
            {notice}
          </p>
        )}
        {tab === "dagen" && (
          <DayBoardView
            trip={trip}
            days={days}
            agenda={agenda}
            setAgenda={persist("agenda", setAgenda)}
            shopping={shopping}
            setShopping={persist("shopping", setShopping)}
            todos={todos}
            photoIndex={photoIndex}
            images={images}
            loadImages={loadImages}
            selected={selected}
            setSelected={setSelected}
            me={me}
            onGoTo={gaNaarTab}
            weer={weer}
          />
        )}
        {tab === "reis" && (
          <TripView
            trip={trip}
            members={members}
            days={days}
            stats={stats}
            onEdit={() => setEditingTrip(true)}
            apiKey={apiKey}
            setApiKey={setApiKey}
            onGaNaar={setTab}
            locaties={locaties}
            deelLocatie={deelLocatie}
            onDeelLocatie={wisselLocatieDelen}
            locatieFout={locatieFout}
          />
        )}
        {tab === "agenda" && (
          <AgendaView items={agenda} setItems={persist("agenda", setAgenda)} days={days} selected={selected} setSelected={setSelected} me={me} />
        )}
        {tab === "kalender" && (
          <FamilieKalenderView
            trips={familyTrips}
            setTrips={persist("family-calendar", setFamilyTrips)}
            members={members}
            me={me}
            currentTrip={trip}
          />
        )}
        {tab === "buurt" && (
          <NearbyView
            trip={trip}
            days={days}
            selected={selected}
            setSelected={setSelected}
            saved={places}
            setSaved={persist("places", setPlaces)}
            onAddToAgenda={addAgendaItem}
            me={me}
          />
        )}
        {tab === "fotos" && (
          <PhotosView
            index={photoIndex}
            setIndex={persist("photos-index", setPhotoIndex)}
            images={images}
            loadImages={loadImages}
            days={days}
            selected={selected}
            setSelected={setSelected}
            me={me}
            trip={trip}
          />
        )}
        {tab === "wandeling" && (
          <WandelView
            me={me}
            agenda={agenda}
            setAgenda={persist("agenda", setAgenda)}
            days={days}
          />
        )}
        {tab === "notities" && <NotesView notes={notes} setNotes={persist("notes", setNotes)} me={me} />}
        {tab === "todo" && <TodoView todos={todos} setTodos={persist("todos", setTodos)} members={members} me={me} />}
        {tab === "lijst" && (
          <ShoppingView list={shopping} setList={persist("shopping", setShopping)} days={days} selected={selected} setSelected={setSelected} me={me} />
        )}

      </main>
      <ZwevendeBalk tab={tab} onGaNaar={gaNaarTab} />
    </div>
    </AvatarsContext.Provider>
    </MapsKeyContext.Provider>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<VakantieApp />);

</script>

<script>
/* Bibliotheken laden, met een tweede bron als de eerste niet werkt. */
(function () {
  function laadEen(url) {
    return new Promise(function (klaar, mis) {
      var s = document.createElement("script");
      s.src = url;
      s.onload = klaar;
      s.onerror = function () { mis(new Error("niet geladen: " + url)); };
      document.head.appendChild(s);
    });
  }
  function laad(urls, naam) {
    return urls
      .reduce(function (p, url) {
        return p.catch(function () { return laadEen(url); });
      }, Promise.reject(new Error("start")))
      .catch(function () {
        window.__fouten.push(naam + " kon van geen enkele bron geladen worden");
        throw new Error(naam);
      });
  }

  var FB1 = "https://www.gstatic.com/firebasejs/10.12.2/";
  var FB2 = "https://cdn.jsdelivr.net/npm/firebase@10.12.2/";
  function laadFirebaseBestand(naam) {
    return laadEen(FB1 + naam).catch(function () { return laadEen(FB2 + naam); });
  }
  function firebaseLaden() {
    if (!window.__firebaseNodig()) return Promise.resolve();
    var c = window.VAKANTIE_CONFIG || {};
    var lijst = ["firebase-app-compat.js", "firebase-firestore-compat.js", "firebase-auth-compat.js"];
    if (c.opslag) lijst.push("firebase-storage-compat.js");
    window.FIREBASE_STATUS.fase = "bibliotheken laden";
    return lijst
      .reduce(function (p, naam) {
        return p.then(function () { return laadFirebaseBestand(naam); });
      }, Promise.resolve())
      .catch(function (e) {
        window.FIREBASE_STATUS.fase = "bibliotheekfout";
        window.FIREBASE_STATUS.fout = (e && e.message) || "Firebase kon niet geladen worden.";
        window.__fouten.push("Firebase kon niet geladen worden; de app werkt nu alleen op dit apparaat.");
      });
  }

  firebaseLaden()
    .then(function () {
      window.__initOpslag();
    })
    .then(function () {
      return laad(
        ["https://unpkg.com/react@18/umd/react.production.min.js",
         "https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"], "React");
    })
    .then(function () {
      return laad(
        ["https://unpkg.com/react-dom@18/umd/react-dom.production.min.js",
         "https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"], "ReactDOM");
    })
    .then(function () {
      return laad(
        ["https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js",
         "https://unpkg.com/@babel/standalone/babel.min.js"], "Babel");
    })
    .then(function () {
      window.tailwind = window.tailwind || { ingebouwd: true };
      return Promise.resolve();
    })
    .then(function () {
      try {
        /* Alleen starten als Babel het niet al zelf gedaan heeft. */
        if (document.getElementById("laden")) Babel.transformScriptTags();
      } catch (e) {
        window.__fouten.push("Babel: " + e.message);
        __toon("De app kon niet gestart worden.");
      }
    })
    .catch(function () {
      __toon("Een onderdeel kon niet geladen worden.");
    });
})();
</script>
</body>
</html>
