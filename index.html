/* ---------- hoofdscherm: dagen naast elkaar ---------- */
function DayBoardView({ trip, days, agenda, setAgenda, shopping, setShopping, todos, photoIndex, images, loadImages, selected, setSelected, me, onGoTo }) {
  const scroller = useRef(null);

  useEffect(() => {
    loadImages();
  }, [photoIndex.length]);

  useEffect(() => {
    const houder = scroller.current;
    const el = houder?.querySelector('[data-dag="true"]');
    if (!el || !houder) return;
    const a = el.getBoundingClientRect();
    const b = houder.getBoundingClientRect();
    if (Math.abs(a.left - b.left) > 40 && el.scrollIntoView) {
      el.scrollIntoView({ block: "nearest", inline: "start", behavior: "smooth" });
    }
  }, [selected]);

  /* Welke dagkaart staat er vooraan? Die wordt de gekozen dag. */
  const scrollTimer = useRef(null);
  const opScroll = () => {
    clearTimeout(scrollTimer.current);
    scrollTimer.current = setTimeout(() => {
      const houder = scroller.current;
      if (!houder) return;
      const kaarten = Array.from(houder.querySelectorAll("section[data-iso]"));
      const links = houder.getBoundingClientRect().left;
      let beste = null;
      let kleinste = Infinity;
      kaarten.forEach((k) => {
        const afstand = Math.abs(k.getBoundingClientRect().left - links);
        if (afstand < kleinste) {
          kleinste = afstand;
          beste = k.getAttribute("data-iso");
        }
      });
      if (beste && beste !== selected) setSelected(beste);
    }, 140);
  };

  const index = days.indexOf(selected);
  const today = localToday();

  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <Eyebrow color={C.marigold}>
          {days.length} dagen | veeg naar links voor later
        </Eyebrow>
        <div className="flex gap-1">
          <button
            onClick={() => index > 0 && setSelected(days[index - 1])}
            disabled={index <= 0}
            aria-label="Vorige dag"
            className="font-mono px-2 py-1 rounded focus:outline-none focus:ring-2"
            style={{ color: C.ink, opacity: index <= 0 ? 0.3 : 1 }}
          >
            &lt;
          </button>
          <button
            onClick={() => index < days.length - 1 && setSelected(days[index + 1])}
            disabled={index >= days.length - 1}
            aria-label="Volgende dag"
            className="font-mono px-2 py-1 rounded focus:outline-none focus:ring-2"
            style={{ color: C.ink, opacity: index >= days.length - 1 ? 0.3 : 1 }}
          >
            &gt;
          </button>
        </div>
      </div>

      <div
        ref={scroller}
        onScroll={opScroll}
        className="flex gap-3 overflow-x-auto snap-x snap-mandatory -mx-4 px-4 pb-2"
        style={{ alignItems: "flex-start" }}
      >
        {days.map((iso, n) => {
          const plannen = agenda
            .filter((a) => a.date === iso)
            .sort((a, b) =>
              (a.heleDag ? "00" : a.time || "99").localeCompare(b.heleDag ? "00" : b.time || "99")
            );
          const lijst = shopping.filter((s) => s.date === iso);
          const kiekjes = photoIndex.filter((p) => p.date === iso);
          const actief = iso === selected;
          return (
            <section
              key={iso}
              data-iso={iso}
              data-dag={actief}
              className="snap-start shrink-0 rounded-3xl p-4"
              style={{
                width: "88%",
                maxWidth: 420,
                maxHeight: "calc(100vh - 330px)",
                overflowY: "auto",
                background: dagKleur(n).tint,
                color: C.ink,
                opacity: actief ? 1 : 0.8,
                border: `3px solid ${iso === today ? C.ember : dagKleur(n).rand}`,
                boxShadow: actief ? `0 10px 26px ${dagKleur(n).schaduw}` : "none",
              }}
            >
              <Eyebrow color={C.ink}>Dag {String(n + 1).padStart(2, "0")}</Eyebrow>
              <h2 className="font-serif text-2xl capitalize leading-tight">{fmtLong(iso)}</h2>

              <div className="mt-3">
                <Eyebrow color={C.ember}>Gebeurtenissen</Eyebrow>
                <NamenOphalen agenda={agenda} setAgenda={setAgenda} dagIso={iso} auto={actief} />
                {plannen.length === 0 ? (
                  <p className="text-sm py-2" style={{ color: C.muted }}>
                    Nog niets gepland.
                  </p>
                ) : (
                  <ul className="space-y-2">
                    {plannen.map((a) => (
                      <AgendaRegel key={a.id} item={a} items={agenda} setItems={setAgenda} compact />
                    ))}
                  </ul>
                )}
                <DagToevoegen iso={iso} agenda={agenda} setAgenda={setAgenda} me={me} />
              </div>

              {kiekjes.length > 0 && (
                <div className="mt-4">
                  <Eyebrow>Foto's ({kiekjes.length})</Eyebrow>
                  <div className="flex gap-2 overflow-x-auto mt-2">
                    {kiekjes.slice(0, 6).map((p) => (
                      <button
                        key={p.id}
                        onClick={() => onGoTo("fotos")}
                        className="shrink-0 rounded-lg overflow-hidden focus:outline-none focus:ring-2"
                        style={{ width: 64, height: 64, background: C.boneSoft }}
                      >
                        {images[p.id] && (
                          <img src={images[p.id]} alt={p.caption || "Foto"} className="w-full h-full object-cover" />
                        )}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {lijst.length > 0 && (
                <div className="mt-4">
                  <Eyebrow>Boodschappen</Eyebrow>
                  <ul className="mt-1">
                    {lijst.map((i) => (
                      <li key={i.id} className="flex items-center gap-2 py-1">
                        <input
                          type="checkbox"
                          checked={i.done}
                          onChange={() =>
                            setShopping(shopping.map((x) => (x.id === i.id ? { ...x, done: !x.done } : x)))
                          }
                          className="w-4 h-4"
                          aria-label={i.text}
                        />
                        <span
                          className="text-sm"
                          style={{ textDecoration: i.done ? "line-through" : "none", color: i.done ? C.muted : C.ink }}
                        >
                          {i.text}
                        </span>
                      </li>
                    ))}
                  </ul>
                </div>
              )}

              {n === 0 && trip.travelFrom && (
                <div className="mt-4 pt-3" style={{ borderTop: `1px solid ${C.line}` }}>
                  <Eyebrow color={C.mint}>Heenreis</Eyebrow>
                  <p className="text-sm mt-1">
                    Vanaf {trip.travelFrom} met de {trip.travelMode || "auto"}
                    {trip.travelDepart ? `, vertrek ${trip.travelDepart}` : ""}
                    {trip.travelArrive ? `, aankomst ${trip.travelArrive}` : ""}.
                  </p>
                  {trip.travelNotes && (
                    <p className="text-sm" style={{ color: C.muted }}>
                      {trip.travelNotes}
                    </p>
                  )}
                  {(trip.stops || []).filter((s) => s.place).length > 0 && (
                    <ol className="mt-2 space-y-1">
                      {(trip.stops || [])
                        .filter((s) => s.place)
                        .map((s, i) => (
                          <li key={s.id} className="flex gap-2 text-sm">
                            <span className="font-mono text-xs" style={{ color: C.muted, minWidth: 44 }}>
                              {s.time || `${i + 1}.`}
                            </span>
                            <span className="flex-1">
                              {(s.date || s.note) && (
                                <span className="block text-sm">
                                  {s.note}
                                  {s.date && (
                                    <span className="font-mono text-xs ml-2" style={{ color: C.muted }}>
                                      {fmtLong(s.date)}
                                    </span>
                                  )}
                                </span>
                              )}
                              <PlaatsBeeld place={s.place} hoogte={80} />
                            </span>
                          </li>
                        ))}
                    </ol>
                  )}
                  <a
                    href={mapsRouteVia(
                      trip.travelFrom,
                      trip.base || trip.destination,
                      (trip.stops || []).map((s) => s.place),
                      trip.travelMode
                    )}
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    <Btn tone="ghost" className="mt-2">
                      Route starten
                    </Btn>
                  </a>
                </div>
              )}
            </section>
          );
        })}
      </div>

      <div className="flex gap-3 mt-3">
        <Btn tone="ghost" onClick={() => onGoTo("lijst")}>
          Boodschappen
        </Btn>
        <Btn tone="ghost" onClick={() => onGoTo("agenda")}>
          Hele agenda
        </Btn>
      </div>
      {todos.filter((t) => !t.done).length > 0 && (
        <p className="font-mono text-xs mt-3" style={{ color: C.ink }}>
          Nog {todos.filter((t) => !t.done).length} open taken op de to-do lijst.
        </p>
      )}
    </div>
  );
}

/* ---------- photos ---------- */
function PhotosView({ index, setIndex, images, loadImages, days, selected, setSelected, me, trip }) {
  const [caption, setCaption] = useState("");
  const [link, setLink] = useState("");
  const [busy, setBusy] = useState("");
  const [open, setOpen] = useState(null);
  const fileRef = useRef(null);
  const albumRef = useRef(null);

  const [videos, setVideos] = useState({});

  useEffect(() => {
    loadImages();
  }, [index.length]);

  useEffect(() => {
    if (!open || open.type !== "video" || !open.inline || videos[open.id]) return;
    let stop = false;
    (async () => {
      try {
        const film = await loadKey(`video:${open.id}`, null);
        if (!stop && film) setVideos((v) => ({ ...v, [open.id]: film }));
      } catch (e) {
        /* video staat er niet meer */
      }
    })();
    return () => {
      stop = true;
    };
  }, [open]);

  const handleFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    let added = [];
    let klachten = [];
    for (let n = 0; n < files.length; n++) {
      const file = files[n];
      const isVideo = (file.type || "").startsWith("video/");
      setBusy(`${isVideo ? "Video" : "Foto"} ${n + 1} van ${files.length} wordt klaargezet...`);
      try {
        const id = uid();
        if (isVideo) {
          const beeldje = await videoBeeldje(file);
          const past = file.size <= VIDEO_MAX;
          const okBeeld = await saveKey(`photo:${id}`, beeldje);
          if (!okBeeld) {
            klachten.push(
              OPSLAG.vol
                ? `De opslag van deze browser zit vol (${mbTekst(opslagGebruik())} in gebruik).`
                : "Het beeldje van deze video kon niet bewaard worden."
            );
          }
          const naarWolk = !past && window.AppFiles && window.AppFiles.beschikbaar;
          let url = "";
          if (naarWolk) {
            try {
              url = await window.AppFiles.upload(`video-${id}`, file, (pct) =>
                setBusy(`Video wordt geupload: ${pct}%`)
              );
            } catch (e) {
              klachten.push("De video kon niet geupload worden: " + (e.message || ""));
            }
          }
          const okVideo = past ? await saveKey(`video:${id}`, await bestandNaarTekst(file)) : false;
          if (okBeeld) {
            added.push({
              id,
              date: selected,
              caption: caption.trim(),
              trip: trip.name,
              by: me.name,
              at: new Date().toISOString(),
              type: "video",
              inline: okVideo,
              url: url || undefined,
            });
            if (!okVideo && !url)
              klachten.push(
                "Die video is te groot om hier te bewaren. Het beeldje staat er wel; zet de video ergens online en plak de link erbij."
              );
          }
        } else {
          let dataUrl = await maakPassend(file);
          let ok = await saveKey(`photo:${id}`, dataUrl);
          if (!ok && OPSLAG.vol) {
            /* Ruimte tekort: nog een keer, een stuk kleiner. */
            setBusy("De opslag is bijna vol, ik probeer een kleinere versie\u2026");
            dataUrl = await resizeImage(file, 800, 0.6);
            ok = await saveKey(`photo:${id}`, dataUrl);
          }
          if (ok) {
            added.push({
              id,
              date: selected,
              caption: caption.trim(),
              trip: trip.name,
              by: me.name,
              at: new Date().toISOString(),
              type: "foto",
            });
          } else {
            klachten.push(
              OPSLAG.vol
                ? `De opslag van deze browser zit vol (${mbTekst(
                    opslagGebruik()
                  )} in gebruik). Verwijder wat foto's, of zet Firebase aan zodat alles op de server komt.`
                : "Deze foto kon niet bewaard worden."
            );
          }
        }
      } catch (err) {
        klachten.push(err.message || "Dit bestand kon niet toegevoegd worden.");
      }
    }
    if (added.length) {
      setIndex([...index, ...added]);
      setCaption("");
    }
    setBusy(klachten.join(" "));
    if (fileRef.current) fileRef.current.value = "";
  };

  const opnameDatum = (file, exif) => {
    if (exif && exif.datum) return { datum: exif.datum, bron: "exif" };
    if (file.lastModified) {
      const d = new Date(file.lastModified);
      return {
        datum: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`,
        bron: "bestand",
      };
    }
    return { datum: null, bron: null };
  };

  const handleAlbum = async (e) => {
    const files = Array.from(e.target.files || []).slice(0, 80);
    if (!files.length) return;
    const nieuw = [];
    let buiten = 0;
    let zonderDatum = 0;
    let mislukt = 0;
    const perDag = {};
    for (let n = 0; n < files.length; n++) {
      const file = files[n];
      setBusy(`Foto ${n + 1} van ${files.length} wordt bekeken\u2026`);
      try {
        const exif = await leesExif(file);
        const { datum, bron } = opnameDatum(file, exif);
        if (!datum) {
          zonderDatum++;
          continue;
        }
        if (!days.includes(datum)) {
          buiten++;
          continue;
        }
        let beeld = await maakPassend(file);
        const id = uid();
        let ok = await saveKey(`photo:${id}`, beeld);
        if (!ok && OPSLAG.vol) {
          beeld = await resizeImage(file, 800, 0.6);
          ok = await saveKey(`photo:${id}`, beeld);
        }
        if (!ok) {
          mislukt++;
          if (OPSLAG.vol) break; // verder proberen heeft geen zin
          continue;
        }
        nieuw.push({
          id,
          date: datum,
          caption: "",
          trip: trip.name,
          by: me.name,
          at: new Date().toISOString(),
          type: "foto",
          plek: exif && exif.punt ? exif.punt : undefined,
          bron,
        });
        perDag[datum] = (perDag[datum] || 0) + 1;
      } catch (err) {
        /* deze foto slaan we over */
      }
    }
    if (nieuw.length) setIndex([...index, ...nieuw]);
    const dagen = Object.keys(perDag).length;
    setBusy(
      (nieuw.length
        ? `${nieuw.length} foto's verdeeld over ${dagen} ${dagen === 1 ? "dag" : "dagen"}.` +
          (buiten ? ` ${buiten} vielen buiten je reisdata.` : "") +
          (zonderDatum ? ` ${zonderDatum} hadden geen datum.` : "")
        : "Geen foto's toegevoegd.") +
        (mislukt
          ? ` ${mislukt} pasten er niet meer bij: de opslag zit vol (${mbTekst(
              opslagGebruik()
            )} in gebruik).`
          : "")
    );
    if (albumRef.current) albumRef.current.value = "";
  };

  const voegLinkToe = () => {
    const url = link.trim();
    if (!url) return;
    setIndex([
      ...index,
      {
        id: uid(),
        date: selected,
        caption: caption.trim(),
        trip: trip.name,
        by: me.name,
        at: new Date().toISOString(),
        type: "link",
        url,
      },
    ]);
    setCaption("");
    setLink("");
  };

  const grouped = useMemo(() => {
    const map = {};
    index.forEach((p) => {
      (map[p.date] = map[p.date] || []).push(p);
    });
    return map;
  }, [index]);

  const counts = useMemo(() => {
    const c = {};
    index.forEach((p) => (c[p.date] = (c[p.date] || 0) + 1));
    return c;
  }, [index]);

  const [reacties, setReacties] = useState({});
  const [praat, setPraat] = useState({});
  const [praatTekst, setPraatTekst] = useState("");
  const [groot, setGroot] = useState(false);
  const [zoom, setZoom] = useState(1);
  const [schuif, setSchuif] = useState({ x: 0, y: 0 });
  const gebaar = useRef(null);
  const laatsteTik = useRef(0);

  const [snelEmojis, setSnelEmojis] = useState(STANDAARD_EMOJIS);
  const [emojiPop, setEmojiPop] = useState(false);
  const [emojiKies, setEmojiKies] = useState(false);
  const drukTimer = useRef(null);
  const langIngedrukt = useRef(false);

  /* De vijf van deze persoon onthouden. */
  useEffect(() => {
    (async () => {
      const eigen = await loadKey("emoji-set", null, false);
      if (Array.isArray(eigen) && eigen.length === 5) setSnelEmojis(eigen);
    })();
  }, []);

  const startDruk = () => {
    langIngedrukt.current = false;
    clearTimeout(drukTimer.current);
    drukTimer.current = setTimeout(() => {
      langIngedrukt.current = true;
      setEmojiKies(false);
      setEmojiPop(true);
    }, 450);
  };
  const eindDruk = () => {
    clearTimeout(drukTimer.current);
    if (!langIngedrukt.current) setGroot(true);
    langIngedrukt.current = false;
  };
  const annuleerDruk = () => {
    clearTimeout(drukTimer.current);
    langIngedrukt.current = false;
  };

  const kiesEmoji = async (emo) => {
    await wisselEmoji(emo);
    if (!snelEmojis.includes(emo)) {
      const nieuw = [emo, ...snelEmojis].slice(0, 5);
      setSnelEmojis(nieuw);
      await saveKey("emoji-set", nieuw, false);
    }
    setEmojiKies(false);
    setEmojiPop(false);
  };

  /* Reacties en opmerkingen bij deze foto ophalen. */
  useEffect(() => {
    setGroot(false);
    setZoom(1);
    setSchuif({ x: 0, y: 0 });
    if (!open) return;
    let stop = false;
    (async () => {
      const r = await loadKey(`reacties:${open.id}`, {});
      const pr = await loadKey(`praat:${open.id}`, []);
      if (stop) return;
      setReacties((v) => ({ ...v, [open.id]: r || {} }));
      setPraat((v) => ({ ...v, [open.id]: Array.isArray(pr) ? pr : [] }));
    })();
    return () => {
      stop = true;
    };
  }, [open]);

  const wisselEmoji = async (emo) => {
    const nu = { ...(reacties[open.id] || {}) };
    const wie = Array.isArray(nu[emo]) ? [...nu[emo]] : [];
    const i = wie.indexOf(me.name);
    if (i >= 0) wie.splice(i, 1);
    else wie.push(me.name);
    if (wie.length) nu[emo] = wie;
    else delete nu[emo];
    setReacties((v) => ({ ...v, [open.id]: nu }));
    await saveKey(`reacties:${open.id}`, nu);
  };

  const stuurPraat = async () => {
    const tekst = praatTekst.trim();
    if (!tekst) return;
    const lijst = [
      ...(praat[open.id] || []),
      { id: uid(), by: me.name, text: tekst, at: new Date().toISOString() },
    ];
    setPraat((v) => ({ ...v, [open.id]: lijst }));
    setPraatTekst("");
    const ok = await saveKey(`praat:${open.id}`, lijst);
    if (!ok) setBusy("De opmerking kon niet opgeslagen worden.");
  };

  /* Alle beelden op volgorde, zoals ze op het scherm staan. */
  const volgorde = useMemo(
    () => days.filter((d) => grouped[d] && grouped[d].length).flatMap((d) => grouped[d]),
    [grouped, days]
  );
  const huidige = open ? volgorde.findIndex((p) => p.id === open.id) : -1;
  const blader = (stap) => {
    if (groot) return; // tijdens vergroten niet bladeren
    if (huidige < 0) return;
    const i = huidige + stap;
    if (i >= 0 && i < volgorde.length) setOpen(volgorde[i]);
  };

  /* Vegen met je vinger. */
  const veeg = useRef(null);
  const grootVinger = useRef(null);
  const veegStart = (e) => {
    veeg.current = e.touches && e.touches[0] ? e.touches[0].clientX : null;
  };
  const veegEind = (e) => {
    if (veeg.current == null) return;
    const eind = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : null;
    if (eind != null) {
      const verschil = eind - veeg.current;
      if (Math.abs(verschil) > 45) blader(verschil < 0 ? 1 : -1);
    }
    veeg.current = null;
  };

  /* Zorgen dat de foto waar je naartoe bladert ook echt geladen is. */
  useEffect(() => {
    if (open && !images[open.id]) loadImages();
  }, [open]);

  /* Pijltjestoetsen, voor wie op een computer kijkt. */
  useEffect(() => {
    if (!open) return;
    const toets = (e) => {
      if (e.key === "Escape") {
        if (groot) setGroot(false);
        else setOpen(null);
        return;
      }
      if (groot) return;
      if (e.key === "ArrowRight") blader(1);
      if (e.key === "ArrowLeft") blader(-1);
    };
    window.addEventListener("keydown", toets);
    return () => window.removeEventListener("keydown", toets);
  }, [open, volgorde, groot]);

  /* De terugknop van de telefoon sluit de foto, niet de hele app. */
  const isOpen = !!open;
  useEffect(() => {
    if (!isOpen) return;
    let viaTerugknop = false;
    window.history.pushState({ reisboekFoto: true }, "");
    const terug = () => {
      viaTerugknop = true;
      setGroot(false);
      setOpen(null);
    };
    window.addEventListener("popstate", terug);
    return () => {
      window.removeEventListener("popstate", terug);
      if (!viaTerugknop) window.history.back();
    };
  }, [isOpen]);

  const remove = async (p) => {
    setIndex(index.filter((x) => x.id !== p.id));
    setOpen(null);
    try {
      await AppStore.delete(`photo:${p.id}`, true);
      if (p.type === "video" && p.inline) await AppStore.delete(`video:${p.id}`, true);
      if (p.type === "video" && p.url && window.AppFiles && window.AppFiles.beschikbaar)
        await window.AppFiles.verwijder(`video-${p.id}`);
    } catch (e) {
      /* index is bijgewerkt; losse afbeelding blijft onbereikbaar achter */
    }
  };

  return (
    <div className="space-y-4">
      <DayStrip days={days} selected={selected} onSelect={setSelected} counts={counts} />

      <RuimteMeter aantal={index.length} />

      <Card style={{ background: "#FFF6EC", border: `3px solid ${C.koraal}` }}>
        <Eyebrow color={C.ember}>Uit je fotoalbum, op datum</Eyebrow>
        <p className="text-sm mt-2 leading-relaxed">
          Kies hieronder de foto's van je vakantie. De app leest per foto uit wanneer hij genomen is
          en zet hem bij de juiste dag. Selecteer er gerust honderd tegelijk; er worden er maximaal
          tachtig per keer verwerkt.
        </p>
        <input
          ref={albumRef}
          type="file"
          accept="image/*"
          multiple
          onChange={handleAlbum}
          className="block w-full text-sm mt-3"
          style={{ color: C.muted }}
        />
        <p className="text-xs mt-2" style={{ color: C.muted }}>
          Foto's van buiten je reisdata worden overgeslagen. Staat er een locatie in de foto, dan
          komt die er als kaartje bij.
        </p>
      </Card>

      <Card>
        <Eyebrow>Zelf toevoegen bij {fmtLong(selected)}</Eyebrow>
        <div className="mt-2 space-y-2">
          <Field label="Omschrijving (optioneel)" placeholder="Ontbijt op het terras" value={caption} onChange={(e) => setCaption(e.target.value)} />
          <input
            ref={fileRef}
            type="file"
            accept="image/*,video/*"
            multiple
            onChange={handleFiles}
            className="block w-full text-sm"
            style={{ color: C.muted }}
          />
          {busy && (
            <p className="font-mono text-xs" style={{ color: C.muted }}>
              {busy}
            </p>
          )}
          <div className="flex gap-2 items-end">
            <div className="flex-1">
              <Field
                label="Of een videolink (YouTube, Google Foto's, Drive)"
                placeholder="https://youtu.be/..."
                value={link}
                onChange={(e) => setLink(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && voegLinkToe()}
              />
            </div>
            <Btn onClick={voegLinkToe} disabled={!link.trim()}>
              Erbij
            </Btn>
          </div>
          <p className="text-xs" style={{ color: C.muted }}>
            Korte video's worden in de app bewaard; langere kun je beter online zetten en als link
            toevoegen. Foto's worden verkleind opgeslagen en bij deze dag en bij {trip.name} gezet.
          </p>
        </div>
      </Card>

      {days
        .filter((d) => grouped[d]?.length)
        .map((d) => (
          <div key={d}>
            <Eyebrow color={dagKleur(days.indexOf(d)).rand}>
              Dag {String(days.indexOf(d) + 1).padStart(2, "0")} | {fmtShort(d)}
            </Eyebrow>
            <div className="grid grid-cols-3 gap-2 mt-2">
              {grouped[d].map((p) => (
                <button
                  key={p.id}
                  onClick={() => setOpen(p)}
                  className="relative rounded-2xl overflow-hidden focus:outline-none focus:ring-2 w-full"
                  style={{ background: C.boneSoft, paddingTop: "100%", border: `2px solid ${C.line}` }}
                >
                  <span className="absolute inset-0 block">
                    {images[p.id] ? (
                      <img
                        src={images[p.id]}
                        alt=""
                        className="w-full h-full object-cover"
                      />
                    ) : p.type === "link" ? (
                      <span
                        className="flex w-full h-full items-center justify-center font-mono text-xs"
                        style={{ background: C.boneSoft, color: C.muted }}
                      >
                        video
                      </span>
                    ) : (
                      <span
                        className="flex w-full h-full items-center justify-center font-mono text-xs"
                        style={{ color: C.muted }}
                      >
                        ...
                      </span>
                    )}
                    {p.type !== "foto" && p.type && (
                      <span
                        className="absolute flex items-center justify-center rounded-full"
                        style={{
                          width: 26,
                          height: 26,
                          right: 5,
                          bottom: 5,
                          background: "rgba(34,64,107,0.85)",
                          color: "#FFFFFF",
                          fontSize: 12,
                        }}
                      >
                        &gt;
                      </span>
                    )}
                  </span>
                </button>
              ))}
            </div>
          </div>
        ))}

      {index.length === 0 && <Empty>Nog geen foto's in dit reisboek.</Empty>}

      {open && (
        <div
          className="fixed inset-0 z-50 p-4 overflow-y-auto"
          style={{ background: "rgba(27,52,87,0.96)" }}
          role="dialog"
          onTouchStart={veegStart}
          onTouchEnd={veegEind}
        >
          <div className="flex items-center justify-between mb-2">
            <button
              onClick={() => blader(-1)}
              disabled={huidige <= 0}
              aria-label="Vorige"
              className="rounded-full flex items-center justify-center focus:outline-none focus:ring-2"
              style={{
                width: 44,
                height: 44,
                background: "rgba(255,255,255,0.15)",
                color: "#FFFFFF",
                opacity: huidige <= 0 ? 0.3 : 1,
                fontSize: 20,
              }}
            >
              &lt;
            </button>
            <span className="font-mono text-xs" style={{ color: C.boneSoft }}>
              {huidige + 1} van {volgorde.length}
            </span>
            <button
              onClick={() => blader(1)}
              disabled={huidige >= volgorde.length - 1}
              aria-label="Volgende"
              className="rounded-full flex items-center justify-center focus:outline-none focus:ring-2"
              style={{
                width: 44,
                height: 44,
                background: "rgba(255,255,255,0.15)",
                color: "#FFFFFF",
                opacity: huidige >= volgorde.length - 1 ? 0.3 : 1,
                fontSize: 20,
              }}
            >
              &gt;
            </button>
          </div>
          {open.type === "link" ? (
            youtubeId(open.url) ? (
              <iframe
                title={open.caption || "Video"}
                src={`https://www.youtube.com/embed/${youtubeId(open.url)}`}
                allow="accelerometer; autoplay; encrypted-media; picture-in-picture"
                allowFullScreen
                className="w-full rounded-2xl"
                style={{ height: 220, border: "none" }}
              />
            ) : (
              <a
                href={open.url}
                target="_blank"
                rel="noopener noreferrer"
                className="block rounded-2xl p-6 text-center"
                style={{ background: "rgba(255,255,255,0.12)", color: "#FFFFFF" }}
              >
                Video openen in een nieuw tabblad
              </a>
            )
          ) : open.type === "video" && open.url ? (
            <video
              src={open.url}
              controls
              playsInline
              className="max-h-96 w-full rounded-2xl"
              style={{ background: "#000" }}
            />
          ) : open.type === "video" && open.inline && videos[open.id] ? (
            <video
              src={videos[open.id]}
              controls
              playsInline
              className="max-h-96 w-full rounded-2xl"
              style={{ background: "#000" }}
            />
          ) : images[open.id] ? (
            <div
              role="button"
              tabIndex={0}
              aria-label="Tik voor volle grootte, houd ingedrukt voor emoji's"
              onTouchStart={startDruk}
              onTouchEnd={eindDruk}
              onTouchMove={annuleerDruk}
              onMouseDown={startDruk}
              onMouseUp={eindDruk}
              onMouseLeave={annuleerDruk}
              onContextMenu={(e) => e.preventDefault()}
              className="block w-full rounded-2xl"
              style={{ WebkitTouchCallout: "none", userSelect: "none" }}
            >
              <img
                src={images[open.id]}
                alt={open.caption || "Reisbeeld"}
                className="max-h-96 w-full object-contain rounded-2xl pointer-events-none"
              />
            </div>
          ) : null}
          {open.type === "video" && !open.inline && !open.url && (
            <p className="text-sm mt-3" style={{ color: "#FFFFFF" }}>
              Van deze video is alleen het beeldje bewaard; hij was te groot voor de opslag.
            </p>
          )}
          {open.plek && (
            <div className="mt-3">
              <PlaatsBeeld place={open.plek} hoogte={80} />
            </div>
          )}
          <div className="mt-4" style={{ color: C.bone }}>
            <Eyebrow color={C.marigold}>
              {fmtLong(open.date)} | {open.trip || ""}
            </Eyebrow>
            <p className="text-base mt-1">{open.caption || "Geen omschrijving"}</p>
            <p className="font-mono text-xs mt-1" style={{ color: C.boneSoft }}>
              toegevoegd door {open.by}
            </p>
          </div>
          {Object.keys(reacties[open.id] || {}).length > 0 && (
            <div className="flex flex-wrap gap-2 mt-3">
              {Object.entries(reacties[open.id] || {}).map(([emo, wie]) => (
                <span
                  key={emo}
                  title={wie.join(", ")}
                  className="flex items-center gap-1 rounded-full px-3 py-1"
                  style={{
                    background: wie.includes(me.name) ? C.koraal : "rgba(255,255,255,0.16)",
                    fontSize: 16,
                  }}
                >
                  <span>{emo}</span>
                  <span
                    className="font-mono text-xs"
                    style={{ color: wie.includes(me.name) ? C.ink : "#FFFFFF" }}
                  >
                    {wie.length}
                  </span>
                </span>
              ))}
            </div>
          )}

          <div className="mt-3">
            {(praat[open.id] || []).map((b) => {
              const vanMij = b.by === me.name;
              return (
                <div key={b.id} className={"flex mb-2 " + (vanMij ? "justify-end" : "justify-start")}>
                  <span
                    className="inline-block px-3 py-2"
                    style={{
                      maxWidth: "80%",
                      background: vanMij ? C.koraal : "rgba(255,255,255,0.92)",
                      color: C.ink,
                      borderRadius: 18,
                      borderBottomRightRadius: vanMij ? 4 : 18,
                      borderBottomLeftRadius: vanMij ? 18 : 4,
                    }}
                  >
                    {!vanMij && (
                      <span className="block font-mono text-xs" style={{ color: C.muted }}>
                        {b.by}
                      </span>
                    )}
                    <span className="block text-sm">{b.text}</span>
                  </span>
                </div>
              );
            })}
            <div className="flex gap-2 mt-2">
              <input
                value={praatTekst}
                onChange={(e) => setPraatTekst(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && stuurPraat()}
                placeholder="Iets erbij zeggen"
                className="flex-1 px-4 py-2 rounded-2xl text-base focus:outline-none focus:ring-2"
                style={{ background: "#FFFFFF", color: C.ink, border: `2px solid ${C.line}` }}
              />
              <Btn onClick={stuurPraat} disabled={!praatTekst.trim()}>
                Plaats
              </Btn>
            </div>
          </div>

          <p className="font-mono text-xs mt-3" style={{ color: "rgba(243,231,218,0.7)" }}>
            Veeg voor de volgende foto. Tik op de foto om hem groot te zien, of houd hem even
            ingedrukt voor een emoji.
          </p>
          {emojiPop && (
            <div
              className="fixed inset-0 flex items-center justify-center p-5"
              style={{ zIndex: 70, background: "rgba(27,52,87,0.75)" }}
              onClick={() => {
                setEmojiPop(false);
                setEmojiKies(false);
              }}
              onTouchStart={(e) => e.stopPropagation()}
              onTouchEnd={(e) => e.stopPropagation()}
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="rounded-3xl p-4"
                style={{
                  background: C.bone,
                  border: `3px solid ${C.line}`,
                  boxShadow: "0 14px 34px rgba(0,0,0,0.35)",
                  maxWidth: 340,
                  width: "100%",
                }}
              >
                {!emojiKies ? (
                  <>
                    <Eyebrow>Jouw reactie</Eyebrow>
                    <div className="flex items-center gap-2 mt-3">
                      {snelEmojis.map((emo) => {
                        const wie = (reacties[open.id] || {})[emo] || [];
                        const vanMij = wie.includes(me.name);
                        return (
                          <button
                            key={emo}
                            onClick={() => {
                              wisselEmoji(emo);
                              setEmojiPop(false);
                            }}
                            className="rounded-full flex items-center justify-center focus:outline-none focus:ring-2"
                            style={{
                              width: 48,
                              height: 48,
                              fontSize: 26,
                              background: vanMij ? C.koraal : "#FFFFFF",
                              border: `2px solid ${vanMij ? C.koraal : C.line}`,
                            }}
                          >
                            {emo}
                          </button>
                        );
                      })}
                      <button
                        onClick={() => setEmojiKies(true)}
                        aria-label="Andere emoji kiezen"
                        className="rounded-full flex items-center justify-center focus:outline-none focus:ring-2"
                        style={{
                          width: 48,
                          height: 48,
                          fontSize: 24,
                          background: C.ink,
                          color: "#FFFFFF",
                        }}
                      >
                        +
                      </button>
                    </div>
                    <p className="text-xs mt-3" style={{ color: C.muted }}>
                      Tik op het plusje om er een te kiezen die hier niet bij staat. Die komt daarna
                      in jouw rijtje van vijf.
                    </p>
                  </>
                ) : (
                  <>
                    <Eyebrow>Kies een emoji</Eyebrow>
                    <div className="grid grid-cols-6 gap-2 mt-3">
                      {ALLE_EMOJIS.map((emo) => (
                        <button
                          key={emo}
                          onClick={() => kiesEmoji(emo)}
                          className="rounded-2xl flex items-center justify-center focus:outline-none focus:ring-2"
                          style={{
                            height: 44,
                            fontSize: 22,
                            background: snelEmojis.includes(emo) ? C.boneSoft : "#FFFFFF",
                            border: `2px solid ${C.line}`,
                          }}
                        >
                          {emo}
                        </button>
                      ))}
                    </div>
                    <Btn tone="ghost" className="mt-3" onClick={() => setEmojiKies(false)}>
                      Terug
                    </Btn>
                  </>
                )}
              </div>
            </div>
          )}

          {groot && images[open.id] && (
            <div
              className="fixed inset-0 flex items-center justify-center overflow-hidden"
              style={{ zIndex: 60, background: "#000000", touchAction: "none" }}
              onClick={(e) => e.stopPropagation()}
              onTouchStart={(e) => {
                e.stopPropagation();
                if (e.touches.length === 2) {
                  const dx = e.touches[0].clientX - e.touches[1].clientX;
                  const dy = e.touches[0].clientY - e.touches[1].clientY;
                  gebaar.current = {
                    soort: "knijp",
                    afstand: Math.hypot(dx, dy),
                    beginZoom: zoom,
                  };
                } else if (e.touches.length === 1) {
                  gebaar.current = {
                    soort: "sleep",
                    x: e.touches[0].clientX,
                    y: e.touches[0].clientY,
                    beginSchuif: schuif,
                    bewogen: 0,
                  };
                }
              }}
              onTouchMove={(e) => {
                e.stopPropagation();
                const g = gebaar.current;
                if (!g) return;
                if (g.soort === "knijp" && e.touches.length === 2) {
                  const dx = e.touches[0].clientX - e.touches[1].clientX;
                  const dy = e.touches[0].clientY - e.touches[1].clientY;
                  const nieuweZoom = Math.min(
                    6,
                    Math.max(1, (g.beginZoom * Math.hypot(dx, dy)) / (g.afstand || 1))
                  );
                  setZoom(nieuweZoom);
                  if (nieuweZoom === 1) setSchuif({ x: 0, y: 0 });
                } else if (g.soort === "sleep" && e.touches.length === 1) {
                  const dx = e.touches[0].clientX - g.x;
                  const dy = e.touches[0].clientY - g.y;
                  g.bewogen = Math.max(g.bewogen, Math.hypot(dx, dy));
                  if (zoom > 1) {
                    setSchuif({ x: g.beginSchuif.x + dx / zoom, y: g.beginSchuif.y + dy / zoom });
                  }
                }
              }}
              onTouchEnd={(e) => {
                e.stopPropagation();
                const g = gebaar.current;
                gebaar.current = null;
                if (!g || g.soort !== "sleep" || g.bewogen > 12) return;
                const nu = Date.now();
                if (nu - laatsteTik.current < 300) {
                  /* twee keer tikken: heen en weer tussen normaal en ingezoomd */
                  laatsteTik.current = 0;
                  if (zoom > 1) {
                    setZoom(1);
                    setSchuif({ x: 0, y: 0 });
                  } else {
                    setZoom(2.5);
                  }
                  return;
                }
                laatsteTik.current = nu;
                setTimeout(() => {
                  if (laatsteTik.current === nu && zoom === 1) setGroot(false);
                }, 310);
              }}
            >
              <img
                src={images[open.id]}
                alt={open.caption || "Reisbeeld"}
                draggable={false}
                style={{
                  maxWidth: "100%",
                  maxHeight: "100%",
                  objectFit: "contain",
                  transform: `translate(${schuif.x}px, ${schuif.y}px) scale(${zoom})`,
                  transition: gebaar.current ? "none" : "transform 0.15s ease-out",
                  userSelect: "none",
                }}
              />
              <button
                onClick={(e) => {
                  e.stopPropagation();
                  setGroot(false);
                }}
                onTouchEnd={(e) => e.stopPropagation()}
                className="fixed rounded-full px-4 py-2 font-mono uppercase text-xs tracking-widest focus:outline-none focus:ring-2"
                style={{ right: 14, top: 14, background: "rgba(255,255,255,0.9)", color: C.ink }}
              >
                Sluiten
              </button>
              <span
                className="fixed font-mono text-xs"
                style={{ left: 0, right: 0, bottom: 16, textAlign: "center", color: "rgba(255,255,255,0.65)" }}
              >
                {zoom > 1
                  ? `${zoom.toFixed(1).replace(".", ",")}x | sleep om te schuiven`
                  : "Knijp met twee vingers om in te zoomen"}
              </span>
            </div>
          )}
          <div className="flex gap-2 mt-3">
            <Btn onClick={() => setOpen(null)}>Sluiten</Btn>
            <Btn tone="danger" onClick={() => remove(open)}>
              Verwijderen
            </Btn>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- notes ---------- */

    setNotes([
      { id: uid(), title: draft.title.trim() || "Zonder titel", body: draft.body.trim(), by: me.name, at: new Date().toISOString() },

  return (
    <div className="space-y-4">
      <Card>
        <Eyebrow>Nieuwe notitie</Eyebrow>

          <label className="block">

              value={draft.body}

/* ---------- to-do ---------- */
function TodoView({ todos, setTodos, members, me }) {
  const [text, setText] = useState("");
  const [who, setWho] = useState("");

  const add = () => {
    if (!text.trim()) return;
    setTodos([...todos, { id: uid(), text: text.trim(), who, done: false, by: me.name }]);
    setText("");
  };
  const toggle = (id) => setTodos(todos.map((t) => (t.id === id ? { ...t, done: !t.done } : t)));

  const open = todos.filter((t) => !t.done);
  const done = todos.filter((t) => t.done);

  const Row = ({ t }) => (
    <li className="flex items-center gap-3 py-3">
      <input
        type="checkbox"
        checked={t.done}
        onChange={() => toggle(t.id)}
        className="w-5 h-5 shrink-0"
        aria-label={t.text}
      />
      <span className="flex-1">
        <span className="block text-base" style={{ textDecoration: t.done ? "line-through" : "none", color: t.done ? C.muted : C.ink }}>
          {t.text}
        </span>
        {t.who && (
          <span className="block font-mono text-xs" style={{ color: C.muted }}>
            {t.who}
          </span>
        )}
      </span>
      <button
        onClick={() => setTodos(todos.filter((x) => x.id !== t.id))}
        aria-label={`Verwijder ${t.text}`}
        className="font-mono px-2 rounded focus:outline-none focus:ring-2"
        style={{ color: C.ember }}
      >
        x
      </button>
    </li>
  );

  return (
    <div className="space-y-4">
      <Card>
        <Eyebrow>Nog te doen ({open.length})</Eyebrow>
        {open.length === 0 ? (
          <Empty>Niets meer op de lijst. Mooi.</Empty>
        ) : (
          <ul className="divide-y" style={{ borderColor: C.line }}>
            {open.map((t) => (
              <Row key={t.id} t={t} />
            ))}
          </ul>
        )}
      </Card>

      <Card>
        <Eyebrow>Taak toevoegen</Eyebrow>
        <div className="mt-2 space-y-2">
          <Field label="Wat moet er gebeuren" placeholder="Paspoorten controleren" value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} />
          <label className="block">
            <Eyebrow>Wie pakt het op</Eyebrow>
            <select
              value={who}
              onChange={(e) => setWho(e.target.value)}
              className="w-full mt-1 px-4 py-3 rounded-2xl text-base focus:outline-none focus:ring-2"
              style={{ background: "#FFFFFF", color: C.ink, border: `2px solid ${C.line}` }}
            >
              <option value="">Iedereen</option>
              {members.map((m) => (
                <option key={m.email} value={m.name}>
                  {m.name}
                </option>
              ))}
            </select>
          </label>
          <Btn onClick={add} disabled={!text.trim()}>
            Taak toevoegen
          </Btn>
        </div>
      </Card>

      {done.length > 0 && (
        <Card>
          <Eyebrow color={C.mint}>Afgerond ({done.length})</Eyebrow>
          <ul className="divide-y" style={{ borderColor: C.line }}>
            {done.map((t) => (
              <Row key={t.id} t={t} />
            ))}
          </ul>
        </Card>
      )}
    </div>
  );
}

/* ---------- shopping per day ---------- */
function ShoppingView({ list, setList, days, selected, setSelected, me }) {
  const [text, setText] = useState("");
  const dayList_ = list.filter((i) => i.date === selected);
  const openCount = dayList_.filter((i) => !i.done).length;

  const add = () => {
    if (!text.trim()) return;
    setList([...list, { id: uid(), date: selected, text: text.trim(), done: false, by: me.name }]);
    setText("");
  };
  const toggle = (id) => setList(list.map((i) => (i.id === id ? { ...i, done: !i.done } : i)));

  const counts = useMemo(() => {
    const c = {};
    list.filter((i) => !i.done).forEach((i) => (c[i.date] = (c[i.date] || 0) + 1));
    return c;
  }, [list]);

  return (
    <div className="space-y-4">
      <DayStrip days={days} selected={selected} onSelect={setSelected} counts={counts} />
      <Card
        style={{
          background: dagKleur(days.indexOf(selected)).tint,
          border: `3px solid ${dagKleur(days.indexOf(selected)).rand}`,
          boxShadow: `0 10px 26px ${dagKleur(days.indexOf(selected)).schaduw}`,
        }}
      >
        <div className="flex items-baseline justify-between">
          <Eyebrow color={C.ink}>{fmtLong(selected)}</Eyebrow>
          <span className="font-mono text-xs" style={{ color: C.muted }}>
            {openCount} te halen
          </span>
        </div>
        {dayList_.length === 0 ? (
          <Empty>Nog geen boodschappen voor deze dag.</Empty>
        ) : (
          <ul className="divide-y mt-2" style={{ borderColor: C.line }}>
            {dayList_.map((i) => (
              <li key={i.id} className="flex items-center gap-3 py-3">
                <input type="checkbox" checked={i.done} onChange={() => toggle(i.id)} className="w-5 h-5 shrink-0" aria-label={i.text} />
                <span className="flex-1 text-base" style={{ textDecoration: i.done ? "line-through" : "none", color: i.done ? C.muted : C.ink }}>
                  {i.text}
                </span>
                <button
                  onClick={() => setList(list.filter((x) => x.id !== i.id))}
                  aria-label={`Verwijder ${i.text}`}
                  className="font-mono px-2 rounded focus:outline-none focus:ring-2"
                  style={{ color: C.ember }}
                >
                  x
                </button>
              </li>
            ))}
          </ul>
        )}
        <div className="mt-3 space-y-2">
          <Field label="Toevoegen" placeholder="Brood, tomaten, ijs" value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} />
          <div className="flex gap-2">
            <Btn onClick={add} disabled={!text.trim()}>
              Op de lijst
            </Btn>
            {dayList_.some((i) => i.done) && (
              <Btn tone="ghost" onClick={() => setList(list.filter((i) => !(i.date === selected && i.done)))}>
                Afgevinkte wissen
              </Btn>
            )}
          </div>
        </div>
      </Card>
    </div>
  );
}

/* ---------- app ---------- */
function VakantieApp() {
  const [phase, setPhase] = useState("loading"); // loading | login | setup | app
  const [me, setMe] = useState(null);
  const [trip, setTrip] = useState(null);
  const [members, setMembers] = useState([]);
  const [agenda, setAgenda] = useState([]);
  const [photoIndex, setPhotoIndex] = useState([]);
  const [images, setImages] = useState({});
  const [notes, setNotes] = useState([]);
  const [todos, setTodos] = useState([]);
  const [shopping, setShopping] = useState([]);
  const [places, setPlaces] = useState([]);
  const [apiKey, setApiKeyState] = useState("");
  const [tab, setTab] = useState("dagen");
  const [menuOpen, setMenuOpen] = useState(false);
  const [editingProfile, setEditingProfile] = useState(false);
  const [avatars, setAvatars] = useState({});
  const [selected, setSelected] = useState(localToday());
  const [editingTrip, setEditingTrip] = useState(false);
  const [locaties, setLocaties] = useState({});
  const [deelLocatie, setDeelLocatie] = useState(false);
  const [locatieFout, setLocatieFout] = useState("");
  const [syncing, setSyncing] = useState(false);
  const [notice, setNotice] = useState("");

  const days = useMemo(() => (trip ? dayList(trip.start, trip.end) : []), [trip]);

  const pullAll = async () => {
    setSyncing(true);
    const core = await loadKey("trip-core", null);
    const [a, n, t, s, pi, pl, mk] = await Promise.all([
      loadKey("agenda", []),
      loadKey("notes", []),
      loadKey("todos", []),
      loadKey("shopping", []),
      loadKey("photos-index", []),
      loadKey("places", []),
      loadKey("maps-key", ""),
    ]);
    if (core) {
      setTrip(core.trip);
      setMembers(core.members || []);
    }
    setAgenda(a);
    setNotes(n);
    setTodos(t);
    setShopping(s);
    setPhotoIndex(pi);
    setPlaces(pl);
    setApiKeyState(typeof mk === "string" ? mk : "");
    await haalLocaties();
    setSyncing(false);
    return core;
  };

  /* Zelf locatie doorgeven, zolang de app openstaat. */
  const laatsteZet = useRef(0);
  useEffect(() => {
    if (!deelLocatie || !me || !navigator.geolocation) return;
    setLocatieFout("");
    let stop = false;
    const wacht = navigator.geolocation.watchPosition(
      async (pos) => {
        if (stop) return;
        const nu = Date.now();
        if (nu - laatsteZet.current < 60000) return; // hooguit eens per minuut
        laatsteZet.current = nu;
        const gegeven = {
          punt: `${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`,
          nauwkeurig: Math.round(pos.coords.accuracy || 0),
          naam: me.name,
          at: new Date().toISOString(),
        };
        await saveKey(`locatie:${me.email}`, gegeven);
        setLocaties((v) => ({ ...v, [me.email]: gegeven }));
      },
      (err) => {
        if (stop) return;
        setLocatieFout(
          err && err.code === 1
            ? "Je browser mag je locatie niet gebruiken. Zet dat aan bij de site-instellingen."
            : "Je locatie kon niet bepaald worden."
        );
      },
      { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 }
    );
    return () => {
      stop = true;
      navigator.geolocation.clearWatch(wacht);
    };
  }, [deelLocatie, me]);

  /* De eigen keuze onthouden, per apparaat. */
  useEffect(() => {
    (async () => {
      const aan = await loadKey("locatie-delen", false, false);
      if (aan === true) setDeelLocatie(true);
    })();
  }, []);

  const wisselLocatieDelen = async (aan) => {
    setDeelLocatie(aan);
    await saveKey("locatie-delen", aan, false);
    if (!aan && me) {
      await AppStore.delete(`locatie:${me.email}`, true).catch(() => {});
      setLocaties((v) => {
        const kopie = { ...v };
        delete kopie[me.email];
        return kopie;
      });
    }
  };

  /* Waar is iedereen? Elke persoon heeft een eigen sleutel. */
  const haalLocaties = async () => {
    try {
      const r = await AppStore.list("locatie:", true);
      const uit = {};
      for (const sleutel of r?.keys || []) {
        const w = await loadKey(sleutel, null);
        if (w && w.punt) uit[sleutel.slice("locatie:".length)] = w;
      }
      setLocaties(uit);
    } catch (e) {
      /* nog niemand deelt iets */
    }
  };

  /* first load */
  useEffect(() => {
    (async () => {
      const stored = await loadKey("me", null, false);
      const core = await pullAll();
      if (!stored) {
        setPhase("login");
      } else {
        setMe(stored);
        setPhase(core ? "app" : "setup");
      }
    })();
  }, []);

  /* keep the selected day inside the trip */
  useEffect(() => {
    if (days.length && !days.includes(selected)) {
      const today = localToday();
      setSelected(days.includes(today) ? today : days[0]);
    }
  }, [days]);

  const login = async (person, blijfIngelogd, googleFoto) => {
    setMe(person);
    if (blijfIngelogd) await saveKey("me", person, false);
    const core = await loadKey("trip-core", null);
    const existing = core?.members || [];
    const bestaand = existing.find((m) => m.email === person.email);
    const samen = bestaand ? { ...bestaand, ...person } : person;
    const nextMembers = bestaand
      ? existing.map((m) => (m.email === person.email ? samen : m))
      : [...existing, samen];
    setMembers(nextMembers);
    if (core) {
      await saveKey("trip-core", { ...core, members: nextMembers });
      setTrip(core.trip);
    }
    if (googleFoto && !avatars[person.email]) {
      setAvatars((prev) => ({ ...prev, [person.email]: googleFoto }));
      await saveKey(`avatar:${person.email}`, googleFoto);
    }
    setMe(samen);
    if (!bestaand?.profileDone) {
      setPhase("profiel");
    } else {
      setPhase(core ? "app" : "setup");
    }
  };

  const saveProfile = async (person, foto) => {
    const compleet = { ...person, profileDone: true };
    setMe(compleet);
    const stored = await loadKey("me", null, false);
    if (stored) await saveKey("me", compleet, false);
    if (foto) {
      await saveKey(`avatar:${compleet.email}`, foto);
      setAvatars((prev) => ({ ...prev, [compleet.email]: foto }));
    }
    const core = await loadKey("trip-core", null);
    const lijst = core?.members || members;
    const nextMembers = lijst.some((m) => m.email === compleet.email)
      ? lijst.map((m) => (m.email === compleet.email ? compleet : m))
      : [...lijst, compleet];
    setMembers(nextMembers);
    if (core) await saveKey("trip-core", { ...core, members: nextMembers });
    setEditingProfile(false);
    setPhase(core ? "app" : "setup");
  };

  const logout = async () => {
    try {
      if (window.AppAuth && window.AppAuth.beschikbaar) await window.AppAuth.uitloggen();
    } catch (e) {
      /* was al afgemeld */
    }
    try {
      await AppStore.delete("me", false);
    } catch (e) {
      /* stond er al niet */
    }
    setMe(null);
    setMenuOpen(false);
    setPhase("login");
  };

  /* Met het menu open sluit de terugknop het menu, niet de app. */
  useEffect(() => {
    if (!menuOpen) return;
    let viaTerugknop = false;
    window.history.pushState({ reisboekMenu: true }, "");
    const terug = () => {
      viaTerugknop = true;
      setMenuOpen(false);
    };
    window.addEventListener("popstate", terug);
    return () => {
      window.removeEventListener("popstate", terug);
      if (!viaTerugknop) window.history.back();
    };
  }, [menuOpen]);

  const laadAvatars = async (lijst) => {
    for (const m of lijst) {
      if (avatars[m.email]) continue;
      const foto = await loadKey(`avatar:${m.email}`, null);
      if (foto) setAvatars((prev) => ({ ...prev, [m.email]: foto }));
    }
  };

  useEffect(() => {
    if (members.length) laadAvatars(members);
  }, [members.length]);

  const saveTrip = async (t) => {
    const nextMembers = members.some((m) => m.email === me.email) ? members : [...members, me];
    setTrip(t);
    setMembers(nextMembers);
    const ok = await saveKey("trip-core", { trip: t, members: nextMembers });
    setNotice(ok ? "" : "Opslaan lukte niet. Probeer het opnieuw.");
    setEditingTrip(false);
    setPhase("app");
  };

  /* write-through setters */
  const persist = (key, setter) => async (value) => {
    setter(value);
    const ok = await saveKey(key, value);
    if (!ok) setNotice("Opslaan lukte niet. Tik op Vernieuwen en probeer het opnieuw.");
  };

  const setApiKey = async (k) => {
    setApiKeyState(k);
    const ok = await saveKey("maps-key", k);
    setNotice(ok ? "" : "De key kon niet opgeslagen worden. Probeer het opnieuw.");
  };

  const addAgendaItem = (item) => persist("agenda", setAgenda)([...agenda, item]);

  const loadImages = async () => {
    const missing = photoIndex.filter((p) => !images[p.id]).slice(0, 24);
    for (const p of missing) {
      try {
        const beeld = await loadKey(`photo:${p.id}`, null);
        if (beeld) setImages((prev) => ({ ...prev, [p.id]: beeld }));
      } catch (e) {
        /* foto niet meer aanwezig */
      }
    }
  };

  if (phase === "loading") {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: C.bg }}>
        <Eyebrow color={C.marigold}>Reisboek wordt geopend...</Eyebrow>
      </div>
    );
  }

  if (phase === "login") return <LoginView onLogin={login} />;

  if (phase === "profiel" || editingProfile) {
    return (
      <AvatarsContext.Provider value={avatars}>
        <div className="min-h-screen" style={{ background: C.bg }}>
          <Letters />
          <ProfileView
            me={me}
            photo={avatars[me.email]}
            onSave={saveProfile}
            onSkip={
              editingProfile
                ? () => setEditingProfile(false)
                : () => setPhase(trip ? "app" : "setup")
            }
            onWandelingen={
              trip
                ? () => {
                    setEditingProfile(false);
                    setPhase("app");
                    setTab("wandeling");
                  }
                : null
            }
          />
        </div>
      </AvatarsContext.Provider>
    );
  }

  if (phase === "setup" || editingTrip) {
    return (
      <MapsKeyContext.Provider value={apiKey}>
        <div className="min-h-screen" style={{ background: C.bg }}>
          <Letters />
          <SetupView
            me={me}
            initial={editingTrip ? trip : null}
            onSave={saveTrip}
            onCancel={editingTrip ? () => setEditingTrip(false) : null}
            apiKey={apiKey}
            setApiKey={setApiKey}
            onImportTimeline={(items) =>
              persist("agenda", setAgenda)([
                ...agenda,
                ...items.map((i) => ({ ...i, id: uid(), by: `${me.name} | tijdlijn` })),
              ])
            }
          />
        </div>
      </MapsKeyContext.Provider>
    );
  }

  const stats = {
    agenda: agenda.length,
    photos: photoIndex.length,
    notes: notes.length,
    todosOpen: todos.filter((t) => !t.done).length,
    shopOpen: shopping.filter((s) => !s.done).length,
    plekken: places.length,
  };

  return (
    <MapsKeyContext.Provider value={apiKey}>
    <AvatarsContext.Provider value={avatars}>
    <div className="min-h-screen" style={{ background: C.bg }}>
      <Letters />
      <header
        className="px-4 pt-5 pb-3 sticky top-0 z-40"
        style={{
          background: C.deep,
          borderBottom: "2px solid rgba(255,255,255,0.65)",
          boxShadow: SCHADUW.kop,
        }}
      >
        <div className="flex items-start justify-between gap-3">
          <div className="flex items-start gap-3">
            <div className="relative">
              <button
                onClick={() => setMenuOpen(!menuOpen)}
                aria-label="Menu"
                className="rounded-md px-3 py-2 focus:outline-none focus:ring-2"
                style={{ background: C.bone, color: C.deep }}
              >
                <span className="flex items-center gap-2">
                  <Icoon
                    naam={tab}
                    kleur={TABS.find((t) => t.id === tab)?.kleur || C.ink}
                    maat={18}
                  />
                  <span className="font-mono uppercase text-xs tracking-widest">
                    {TABS.find((t) => t.id === tab)?.label || "Menu"} v
                  </span>
                </span>
              </button>
              {menuOpen && (
                <div
                  className="absolute left-0 mt-2 rounded-lg overflow-hidden z-50"
                  style={{ background: C.bone, minWidth: 200, border: `1px solid ${C.line}` }}
                >
                  {TABS.map((t) => (
                    <button
                      key={t.id}
                      onClick={() => {
                        setTab(t.id);
                        setMenuOpen(false);
                      }}
                      className="flex items-center gap-3 w-full text-left px-3 py-2 focus:outline-none focus:ring-2"
                      style={{
                        background: tab === t.id ? t.kleur + "33" : "transparent",
                        borderBottom: `1px solid ${C.line}`,
                      }}
                    >
                      <Tegel naam={t.id} kleur={t.kleur} maat={34} />
                      <span
                        className="font-mono uppercase text-xs tracking-widest"
                        style={{ color: C.ink }}
                      >
                        {t.label}
                      </span>
                    </button>
                  ))}
                  <button
                    onClick={() => {
                      setMenuOpen(false);
                      setEditingProfile(true);
                    }}
                    className="flex items-center gap-3 w-full text-left px-3 py-2 focus:outline-none focus:ring-2"
                    style={{ borderBottom: `1px solid ${C.line}` }}
                  >
                    <Tegel naam="profiel" kleur={C.muted} maat={34} />
                    <span className="font-mono uppercase text-xs tracking-widest" style={{ color: C.ink }}>
                      Mijn profiel
                    </span>
                  </button>
                  <button
                    onClick={logout}
                    className="flex items-center gap-3 w-full text-left px-3 py-2 focus:outline-none focus:ring-2"
                  >
                    <Tegel naam="uit" kleur={C.ember} maat={34} />
                    <span className="font-mono uppercase text-xs tracking-widest" style={{ color: C.ember }}>
                      Uitloggen
                    </span>
                  </button>
                </div>
              )}
            </div>
            <div>
              <div className="flex items-center gap-2">
                <Logo size={26} tekst={false} />
                <Eyebrow color={C.marigold}>{members.length} reisgenoten</Eyebrow>
              </div>
              <h1 className="font-serif text-xl mt-1" style={{ color: C.ink }}>
                {trip.name}
              </h1>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <div className="flex -space-x-2">
              {members.slice(0, 4).map((m) => (
                <Avatar key={m.email} member={m} size={26} />
              ))}
            </div>
            <Btn tone="dark" onClick={pullAll} disabled={syncing} className="shrink-0">
              {syncing ? "..." : "Vernieuw"}
            </Btn>
          </div>
        </div>
      </header>

      <main
        className="p-4 max-w-lg mx-auto"
        style={{ paddingBottom: "calc(126px + env(safe-area-inset-bottom, 0px))" }}
      >
        {notice && (
          <p className="text-sm mb-3" style={{ color: C.marigold }}>
            {notice}
          </p>
        )}
        {tab === "dagen" && (
          <DayBoardView
            trip={trip}
            days={days}
            agenda={agenda}
            setAgenda={persist("agenda", setAgenda)}
            shopping={shopping}
            setShopping={persist("shopping", setShopping)}
            todos={todos}
            photoIndex={photoIndex}
            images={images}
            loadImages={loadImages}
            selected={selected}
            setSelected={setSelected}
            me={me}
            onGoTo={setTab}
          />
        )}
        {tab === "reis" && (
          <TripView
            trip={trip}
            members={members}
            days={days}
            stats={stats}
            onEdit={() => setEditingTrip(true)}
            apiKey={apiKey}
            setApiKey={setApiKey}
            onGaNaar={setTab}
            locaties={locaties}
            deelLocatie={deelLocatie}
            onDeelLocatie={wisselLocatieDelen}
            locatieFout={locatieFout}
          />
        )}
        {tab === "agenda" && (
          <AgendaView items={agenda} setItems={persist("agenda", setAgenda)} days={days} selected={selected} setSelected={setSelected} me={me} />
        )}
        {tab === "buurt" && (
          <NearbyView
            trip={trip}
            days={days}
            selected={selected}
            setSelected={setSelected}
            saved={places}
            setSaved={persist("places", setPlaces)}
            onAddToAgenda={addAgendaItem}
            me={me}
          />
        )}
        {tab === "fotos" && (
          <PhotosView
            index={photoIndex}
            setIndex={persist("photos-index", setPhotoIndex)}
            images={images}
            loadImages={loadImages}
            days={days}
            selected={selected}
            setSelected={setSelected}
            me={me}
            trip={trip}
          />
        )}
        {tab === "wandeling" && (
          <WandelView
            me={me}
            agenda={agenda}
            setAgenda={persist("agenda", setAgenda)}
            days={days}
          />
        )}
        {tab === "notities" && <NotesView notes={notes} setNotes={persist("notes", setNotes)} me={me} />}
        {tab === "todo" && <TodoView todos={todos} setTodos={persist("todos", setTodos)} members={members} me={me} />}
        {tab === "lijst" && (
          <ShoppingView list={shopping} setList={persist("shopping", setShopping)} days={days} selected={selected} setSelected={setSelected} me={me} />
        )}
        <p className="font-mono text-xs mt-8 text-center" style={{ color: C.muted }}>
          Aangemeld als {me.name} | tik op Vernieuw voor wat anderen toevoegden
        </p>
      </main>
      <ZwevendeBalk tab={tab} onGaNaar={setTab} />
    </div>
    </AvatarsContext.Provider>
    </MapsKeyContext.Provider>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<VakantieApp />);

</script>

<script>
/* Bibliotheken laden, met een tweede bron als de eerste niet werkt. */
(function () {
  function laadEen(url) {
    return new Promise(function (klaar, mis) {
      var s = document.createElement("script");
      s.src = url;
      s.onload = klaar;
      s.onerror = function () { mis(new Error("niet geladen: " + url)); };
      document.head.appendChild(s);
    });
  }
  function laad(urls, naam) {
    return urls
      .reduce(function (p, url) {
        return p.catch(function () { return laadEen(url); });
      }, Promise.reject(new Error("start")))
      .catch(function () {
        window.__fouten.push(naam + " kon van geen enkele bron geladen worden");
        throw new Error(naam);
      });
  }

  var FB = "https://www.gstatic.com/firebasejs/10.12.2/";
  function firebaseLaden() {
    if (!window.__firebaseNodig()) return Promise.resolve();
    var c = window.VAKANTIE_CONFIG || {};
    var lijst = [FB + "firebase-app-compat.js", FB + "firebase-firestore-compat.js", FB + "firebase-auth-compat.js"];
    if (c.opslag) lijst.push(FB + "firebase-storage-compat.js");
    return lijst
      .reduce(function (p, url) {
        return p.then(function () { return laadEen(url); });
      }, Promise.resolve())
      .catch(function () {
        window.__fouten.push("Firebase kon niet geladen worden; de app werkt nu alleen op dit apparaat.");
      });
  }

  firebaseLaden()
    .then(function () {
      window.__initOpslag();
    })
    .then(function () {
      return laad(
        ["https://unpkg.com/react@18/umd/react.production.min.js",
         "https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"], "React");
    })
    .then(function () {
      return laad(
        ["https://unpkg.com/react-dom@18/umd/react-dom.production.min.js",
         "https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"], "ReactDOM");
    })
    .then(function () {
      return laad(
        ["https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js",
         "https://unpkg.com/@babel/standalone/babel.min.js"], "Babel");
    })
    .then(function () {
      return laad(["https://cdn.tailwindcss.com"], "Tailwind").catch(function () {
        /* zonder Tailwind is de app lelijk, maar wel bruikbaar */
      });
    })
    .then(function () {
      try {
        /* Alleen starten als Babel het niet al zelf gedaan heeft. */
        if (document.getElementById("laden")) Babel.transformScriptTags();
      } catch (e) {
        window.__fouten.push("Babel: " + e.message);
        __toon("De app kon niet gestart worden.");
      }
    })
    .catch(function () {
      __toon("Een onderdeel kon niet geladen worden.");
    });
})();
</script>
</body>
</html>
